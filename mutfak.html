<style>

/* Layout: tek sütun telefon uygulaması — üstte ay seçici, ortada sekme içeriği, altta sabit sekme çubuğu + ekle düğmesi */
:root{
  --bg:#FFFAEB; --surface:#FFFFFF; --sunk:#FDF0C9; --line:#F3E3B2;
  --ink:#262006; --muted:#76683A;
  --accent:#F2B600; --accent-ink:#241C00; --accent-text:#9A6E00; --accent-soft:#FFEDB0;
  --hero:linear-gradient(135deg,#FFD83D 0%,#F5A800 100%);
  --in:#1E9E57; --out:#E5484D; --warn:#F08C00; --alarm:#E5484D; --mid:color-mix(in oklch, var(--accent), var(--alarm));
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0C0F; --surface:#18181E; --sunk:#23232B; --line:#30303A;
  --ink:#F8F6EE; --muted:#A9A69C;
  --accent:#FFD23F; --accent-ink:#1A1500; --accent-text:#FFD23F; --accent-soft:#3A3212;
  --hero:linear-gradient(135deg,#FFE066 0%,#FFB300 100%);
  --in:#3DD68C; --out:#FF6B6B; --warn:#FF9F1A; --alarm:#FF6B6B; --mid:color-mix(in oklch, var(--accent), var(--alarm)); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0C0F; --surface:#18181E; --sunk:#23232B; --line:#30303A;
  --ink:#F8F6EE; --muted:#A9A69C;
  --accent:#FFD23F; --accent-ink:#1A1500; --accent-text:#FFD23F; --accent-soft:#3A3212;
  --hero:linear-gradient(135deg,#FFE066 0%,#FFB300 100%);
  --in:#3DD68C; --out:#FF6B6B; --warn:#FF9F1A; --alarm:#FF6B6B; --mid:color-mix(in oklch, var(--accent), var(--alarm)); color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px calc(160px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:6px 14px}
.brand{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.05;letter-spacing:-.01em;min-width:0}
.brand.home{display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;min-height:44px;margin-left:-4px}
.brand .homei{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.brand.home:active .homei{transform:scale(.94)}
.brand small{display:block;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;width:40px;height:40px;border-radius:50%;font-size:18px;line-height:1}
.month button:hover{background:var(--sunk)}
.month .mlabel{width:auto;min-width:96px;padding:0 6px;border-radius:999px;font-size:14px;font-weight:600}
.top-r{display:flex;align-items:center;gap:6px}
.lrow{display:flex;align-items:center;gap:6px}
.goz{border:0;background:color-mix(in srgb,currentColor 14%,transparent);color:inherit;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin:-8px 0;padding:0;flex:none}
.goz svg{width:18px;height:18px}
.gear{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.gear svg{width:20px;height:20px}
.gear[aria-current="page"]{color:var(--accent);border-color:var(--accent)}

/* summary */
.hero{background:var(--hero);color:var(--accent-ink);border-radius:20px;padding:18px 18px 16px;display:grid;gap:14px}
.hero .label{color:inherit;opacity:.75}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.herobtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid color-mix(in srgb,var(--accent-ink) 55%,transparent);background:color-mix(in srgb,var(--accent-ink) 12%,transparent);color:inherit;font:inherit;font-weight:700;font-size:14px;border-radius:999px;min-height:40px;padding:0 14px}
.herobtn svg{width:18px;height:18px}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,46px);line-height:1;letter-spacing:-.02em}
.hero .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .cell{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);border-radius:12px;padding:10px 12px}
.hero .cell b{display:block;font-size:17px;font-weight:600;margin-top:2px}

section{margin-top:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-head h2{font-size:19px}
.sec-head small{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* budget bars */
.bars{display:grid;gap:14px}
.plain{display:grid;gap:0;margin-top:14px;padding-top:6px;border-top:1px solid var(--line)}
.plain:first-child{margin-top:0;padding-top:0;border-top:0}
.plain .label{margin-bottom:4px}
.bar-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-size:14px;margin-bottom:6px}
.bar-top span:first-child{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-top span:last-child{color:var(--muted);white-space:nowrap;margin-left:auto}
.track{position:relative;height:10px;border-radius:6px;background:var(--sunk);overflow:visible}
.fill{height:100%;border-radius:6px;background:var(--accent);transition:width .4s ease}
.limit{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.pill.near{--tip:color-mix(in oklch,var(--mid),var(--alarm) 30%);background:color-mix(in srgb,var(--tip) 18%,transparent);color:color-mix(in srgb,var(--tip) 70%,var(--ink))}
.pill.over{background:color-mix(in srgb,var(--alarm) 18%,transparent);color:color-mix(in srgb,var(--alarm) 75%,var(--ink))}

/* trend */
.trend svg{display:block;width:100%;height:auto}
.trend .hit{cursor:pointer}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* list */
.day{margin-top:14px}
.day:first-child{margin-top:0}
.day h3{display:flex;justify-content:space-between;gap:8px;font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.items{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item:hover{background:var(--sunk)}
.dot{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-family:var(--display);font-size:15px;background:var(--sunk);color:var(--muted)}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mid small{color:var(--muted);font-size:13px}
.amt{font-weight:600;white-space:nowrap}
.amt.in{color:var(--in)} .amt.out{color:var(--ink)}
.rec{font-size:11px;color:var(--accent-text);font-weight:600;margin-left:6px}

.empty{text-align:center;color:var(--muted);padding:26px 14px}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:17px;margin-bottom:4px}

/* settings */
.profile{display:flex;align-items:center;gap:14px}
.avatar{flex:none;width:68px;height:68px;border-radius:22px;overflow:hidden;cursor:pointer;position:relative;background:var(--sunk);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar span{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px;font-weight:700;border:2px solid var(--surface)}
.profile .who{flex:1;min-width:0;display:grid;gap:2px}
.pname{font-family:var(--display);font-size:22px;font-weight:700;border:0;background:none;padding:2px 0;border-bottom:2px dashed transparent;border-radius:0}
.pname:focus{outline:none;border-bottom-color:var(--accent)}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.pstats div{background:var(--sunk);border-radius:12px;padding:10px;display:grid;gap:2px}
.pstats b{font-family:var(--display);font-size:18px}
.pstats small{font-size:12px;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.swatch{border:0;background:none;display:grid;justify-items:center;gap:6px;padding:0;font-size:12px;font-weight:600;color:var(--muted)}
.swatch i{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-size:20px;font-weight:700;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .08)}
.swatch[aria-pressed="true"]{color:var(--ink)}
.swatch[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.set-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0;padding-top:0}
.set-row .name{flex:1;min-width:0}
.set-row input{width:110px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;min-width:44px;padding:0 12px;font-size:14px;font-weight:600}
.icon-btn.danger{color:var(--out)}
.note{font-size:13px;color:var(--muted)}
.mode{display:flex;gap:10px;align-items:flex-start}
.mode i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--in);margin-top:6px}
.mode i.local{background:var(--warn)}

input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:90px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
#tips{position:fixed;inset:0;z-index:90}
#tips .tip-spot{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgb(0 0 0 / .62);transition:all .25s ease;pointer-events:none}
#tips .tip-box{position:fixed;background:var(--surface);color:var(--ink);border:1px solid color-mix(in oklch, var(--accent), transparent 45%);border-radius:16px;padding:14px 16px;box-shadow:0 12px 32px rgb(0 0 0 / .3);display:grid;gap:6px;transition:top .25s ease,left .25s ease}
#tips .tip-box small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#tips .tip-box b{font-family:var(--display);font-size:18px;line-height:1.2}
#tips .tip-box p{margin:0;font-size:14.5px;line-height:1.45}
#tips .tip-box .btns{display:flex;gap:8px;margin-top:6px} #tips .tip-box .btn{flex:1;min-height:44px}
@media (prefers-reduced-motion: reduce){ #tips .tip-spot,#tips .tip-box{transition:none} }
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--out);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
nav.tabs button.tab{border:0;background:none;padding:8px 0;font-size:12px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:2px}
nav.tabs button.tab svg{width:22px;height:22px}
nav.tabs button.tab[aria-current="page"]{color:var(--accent-text)}
.fab{position:fixed;z-index:6;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--hero);color:var(--accent-ink);font-size:32px;line-height:1;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent)}
.fab:active{transform:scale(.95)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .38);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-radius:22px 22px 0 0;max-height:92%;overflow:auto;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:grid;gap:14px}
.grab{height:26px;margin:-10px -16px -6px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab::before{content:'';width:44px;height:5px;border-radius:3px;background:var(--line)}
.sheet.dragging{transition:none!important;animation:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:10px;padding:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.amount-in{font-family:var(--display);font-size:34px;font-weight:700;border:0;border-bottom:2px solid var(--line);border-radius:0;background:none;padding:4px 0}
.amount-in:focus-visible{outline:none;border-bottom-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;min-height:40px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.field{display:grid;gap:6px}

/* savings */
.assets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.asset{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;min-width:0}
.asset:last-child{grid-column:span 2}
.asset .q{font-family:var(--display);font-size:21px;font-weight:700;overflow-wrap:anywhere}
.asset small{color:var(--muted);font-size:13px}
.streak{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.streak div{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted)}
.streak b{width:100%;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:var(--sunk);color:var(--muted)}
.streak b.ok{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.streak b.neg{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.streak .cur{color:var(--ink);font-weight:600}
.savstat{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;width:100%;text-align:left}
.savstat .badge{grid-row:span 2;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;font-weight:700}
.savstat b{font-weight:600}
.savstat small{color:var(--muted);font-size:13px}
.savstat .track{grid-column:1/-1;margin-top:8px}
.badge.ok{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)} .badge.no{background:var(--sunk);color:var(--muted)} .badge.neg{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{font-size:14px;color:var(--muted)}
/* payments */
.alert{display:grid;gap:6px;width:100%;text-align:left;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.alert.late{background:color-mix(in srgb,var(--out) 9%,var(--surface));border-color:color-mix(in srgb,var(--out) 40%,transparent)}
.alert b{font-weight:600}
.alert div{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.alert div span:last-child{color:var(--muted);white-space:nowrap}
.debt{display:grid;gap:10px}
.debt + .debt{margin-top:10px}
.debt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.debt-top b{font-size:16px;font-weight:600}
.debt-top small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.amtbig{font-family:var(--display);font-size:23px;font-weight:700}
.st{flex:none;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.st.paid{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.st.soon,.st.today{background:color-mix(in srgb,var(--warn) 24%,transparent);color:color-mix(in srgb,var(--warn) 55%,var(--ink))}
.st.late{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:10px}
/* daily calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal button{border:0;border-radius:9px;min-height:46px;padding:5px 1px 4px;display:grid;align-content:space-between;justify-items:center;background:var(--sunk);font-size:13px;font-weight:600;color:var(--ink)}
.cal button small{font-size:10px;font-weight:500;color:var(--ink);opacity:.75;font-variant-numeric:tabular-nums}
.cal button.fut{opacity:.4}
.cal button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cal button[aria-pressed="true"] small{color:inherit;opacity:1}
.daystats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.daystats b{color:var(--ink);font-weight:600}
.day h3 span:last-child{text-transform:none;letter-spacing:0;color:var(--ink)}
/* month picker */
.ynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ynav b{font-family:var(--display);font-size:24px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 4px;font-weight:600}
.mgrid button.now{border-color:var(--accent);color:var(--accent-text)}
.mgrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(156px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
/* dokunma: parmak boyu hedefler, basınca tepki, çift dokunma yakınlaştırması yok */
button,label,a,.tap{touch-action:manipulation}
button,.tap{-webkit-user-select:none;user-select:none}
.btn:active,.chip:active,.icon-btn:active,.swatch:active,.seg button:active,.cal button:active,.mgrid button:active,.month button:active,nav.tabs button.tab:active{transform:scale(.96)}
.item:active,.tap:active{background:var(--sunk)}
.hero .tap:active{background:color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.set-row.tap{width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;font:inherit;color:inherit;min-height:52px;padding:10px 4px;margin:0;border-radius:0}
.set-row.tap:first-child{padding-top:10px}
.chev{color:var(--muted);font-size:20px;line-height:1;margin-left:2px}
.set-row .meta{color:var(--muted);font-size:14px;white-space:nowrap}
.barrow{display:block;width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;padding:6px 6px;margin:-6px -6px;width:calc(100% + 12px);border-radius:10px}
.plain .tap{display:flex;justify-content:space-between;gap:8px;width:calc(100% + 12px);margin:0 -6px;padding:10px 6px;border:0;background:none;font:inherit;color:inherit;text-align:left;border-radius:8px;font-size:14px}
.plain .tap span:last-child{font-weight:500}
.hero button.cell{border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.asset.tap{font:inherit;color:inherit;text-align:left;cursor:pointer}
.filterchip{display:inline-flex;align-items:center;gap:6px}
.btn.sm{min-height:44px}
.seg button{min-height:44px}
.check{min-height:44px;cursor:pointer}
.pname{min-height:44px}
/* alt başlıklar */
.catblock{display:grid}
.subs{display:grid;margin:4px 0 0 4px;padding-left:12px;border-left:2px solid var(--line)}
.subs .sub{display:flex;justify-content:space-between;gap:8px;border:0;background:none;font:inherit;color:var(--muted);font-size:14px;padding:8px 6px;min-height:38px;border-radius:8px;text-align:left}
.subs .sub span:last-child{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.subrow{display:flex;gap:8px;align-items:center}
.subrow input{flex:1}
.sublist{display:grid;gap:8px}
.subadd{display:inline-flex;gap:6px;align-items:center}
.subadd input{width:150px;min-height:40px;padding:6px 10px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg .chip{border-style:dashed}
/* rapor */
.reportcard{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit}
.reportcard .ic{grid-row:span 2;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.reportcard .ic svg{width:22px;height:22px}
.reportcard b{font-weight:600}
.reportcard small{color:var(--muted);font-size:13px;grid-column:2}
.reportcard .chev{grid-row:1 / span 2;grid-column:3}
.rp{display:grid;gap:18px}
.rp-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rp-head h2{font-size:22px}
.rp-sub{color:var(--muted);font-size:13px;margin-top:2px}
.rp-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rp-tile{background:var(--sunk);border-radius:14px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.rp-tile b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rp-tile small{color:var(--muted);font-size:12px}
.rp-sec{display:grid;gap:6px}
.rp-sec h3{font-family:var(--display);font-size:17px;margin-bottom:2px}
.rp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.rp-row:first-of-type{border-top:0}
.rp-row .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rp-row .r small{display:block;color:var(--muted);font-size:12px}
.rp-row .sub2{grid-column:1/-1;color:var(--muted);font-size:13px;padding-left:12px}
.rp-bar{grid-column:1/-1;height:6px;border-radius:4px;background:var(--sunk);overflow:hidden}
.rp-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),color-mix(in oklch,var(--accent),var(--surface) 35%))}
.rp .up,.rp small.up{color:var(--alarm)!important;font-weight:600} .rp .down,.rp small.down{color:var(--in)!important;font-weight:600}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.rp-note{font-size:14px;line-height:1.5}
.rp-note b{font-weight:600}
/* kredi kartı ekstresi */
.cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cardgrid div{background:var(--sunk);border-radius:12px;padding:8px 10px;display:grid;gap:1px;min-width:0}
.cardgrid small{color:var(--muted);font-size:12px}
.cardgrid b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cardgrid .hl{background:color-mix(in srgb,var(--accent) 14%,var(--sunk))}
.warnc{color:var(--alarm)}
.st.part{background:var(--accent-soft);color:var(--accent-text)}
.cardnote{font-size:13px;color:var(--muted);line-height:1.45}
.cardnote b{color:var(--ink);font-weight:600}
details.charges{border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.charges summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:600;cursor:pointer;list-style:none}
details.charges summary::-webkit-details-marker{display:none}
details.charges summary::after{content:'›';transform:rotate(90deg);color:var(--muted);font-size:20px}
details.charges[open] summary::after{transform:rotate(-90deg)}
.chg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.chg small{color:var(--muted);font-size:12px}
.chg .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.instcalc{font-size:13px;color:var(--muted)}
.debtbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.debtbtns3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.debtbtns3 .btn:first-child{grid-column:1/-1}
.debtbtns3 .btn{padding-inline:6px;font-size:13.5px}
.stmtsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stmtsum div{background:var(--sunk);border-radius:12px;padding:8px 10px;display:grid;min-width:0}
.stmtsum small{color:var(--muted);font-size:12px} .stmtsum b{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.debtbtns .btn:first-child{grid-column:1/-1}
.instcalc b{color:var(--ink)}
/* beklenen (tarihi gelmemiş) kayıtlar */
.pend{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;width:100%;text-align:left;font:inherit;color:inherit;border:1px dashed color-mix(in srgb,var(--accent-ink) 45%,transparent);background:color-mix(in srgb,var(--accent-ink) 8%,transparent);border-radius:12px;padding:9px 12px;font-size:13.5px;cursor:pointer}
.pend .label{margin-right:6px}
.pend b{font-weight:700;font-variant-numeric:tabular-nums}
.item.pending{opacity:.75}
.item.pending .amt{color:var(--muted)}
.pendtag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;background:var(--accent-soft);color:var(--accent-text);vertical-align:1px}
.futnote{font-size:13px;color:var(--accent-text);font-weight:500}
/* kategori simgesi + rengi */
.cdot{background:color-mix(in srgb,var(--cc) 22%,var(--surface));font-size:19px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.cico{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;margin-right:4px}
.icongrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.ico{border:1px solid var(--line);background:var(--bg);border-radius:10px;aspect-ratio:1;font-size:20px;min-height:40px;padding:0;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.ico[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.colorrow{display:flex;flex-wrap:wrap;gap:10px}
.cc{width:38px;height:38px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .12)}
.cc[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.cathead{display:flex;align-items:center;gap:10px}
/* bugün harcanabilir */
.spend{display:grid;gap:6px;width:100%;text-align:left;font:inherit;color:inherit}
.spend-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.spend-big{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:-.01em}
.spend small{color:var(--muted);font-size:13px;line-height:1.4}
.spend small b{color:var(--ink)}
.bd-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.bd-row:first-child{border-top:0}
.bd-row span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.bd-row.total{border-top:2px solid var(--ink);font-weight:700}
/* yedek hatırlatıcı */
.bkp{display:grid;gap:10px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 40%,transparent);margin-bottom:14px}
.bkp b{font-weight:700} .bkp small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.4}
/* hızlı ekle */
.quickchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.quickchips::-webkit-scrollbar{display:none}
.quickchips .chip{flex:none;white-space:nowrap}
/* hedefler */
.goals{display:grid;gap:10px}
.goal{display:grid;gap:8px;width:100%;text-align:left;font:inherit;color:inherit}
.goal-top,.goal-row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.goal-top b{font-size:16px;font-weight:600}
.goal small{color:var(--muted);font-size:13px;line-height:1.4}
.goal .track{height:12px}
/* alacak verecek */
.iouhead{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.iouhead div{background:var(--sunk);border-radius:12px;padding:8px 10px;display:grid}
.iouhead small{color:var(--muted);font-size:12px} .iouhead b{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.iouhead .al b{color:var(--in)}
.overdue{color:var(--alarm);font-weight:600}
.paylist .chg:first-child{border-top:0}
/* hero: hızlı gelir/gider ekle */
.hero .cell{position:relative}
.plusb{position:absolute;top:8px;right:10px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;line-height:1;background:color-mix(in srgb,var(--accent-ink) 18%,transparent)}
.iouline{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:inherit}
.iouline b{font-variant-numeric:tabular-nums}
/* açılır-kapanır kart/kredi + banka rozeti */
.debt{gap:0!important}
.debthead{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;width:100%;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;min-height:48px}
.dh-mid{display:grid;gap:2px;min-width:0}
.dh-mid b{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh-mid small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh-r{display:grid;justify-items:end;gap:4px}
.dh-r b{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dh-chev{font-size:22px;transition:transform .2s}
.debt.open .dh-chev{transform:rotate(90deg)}
.debt-body{display:none}
.debt.open .debt-body{display:grid;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.bbadge{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.02em;flex:none;overflow:hidden;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .06)}
.bbadge img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.debtlist{display:grid;gap:10px}
.debt + .debt{margin-top:0!important}

/* ---- Mutfak bölümüne özel ---- */
nav.tabs .in{grid-template-columns:repeat(3,minmax(0,1fr))}
.top .chef{flex:none;width:44px;height:44px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2px var(--surface),0 3px 10px rgb(0 0 0 / .15)}
.top .chef img{width:100%;height:100%;object-fit:cover;display:block}
.dnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.dnav button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;line-height:1}
.dnav .t{text-align:center;min-width:0}
.dnav .t b{display:block;font-family:var(--display);font-size:20px;line-height:1.15}
.dnav .t small{color:var(--muted);font-size:13px;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.week button{border:1px solid transparent;background:none;border-radius:12px;padding:6px 0 7px;display:grid;justify-items:center;gap:2px;color:var(--ink);font:inherit}
.week button small{font-size:11px;font-weight:600;color:var(--muted)}
.week button b{font-size:16px;font-variant-numeric:tabular-nums}
.week button i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.week button[aria-pressed="true"]{background:var(--surface);border-color:var(--line)}
.week button.bugun b{color:var(--accent-text)}
.k-tencere{background:var(--accent)!important}.k-keyif{background:#F0A23A!important}.k-tava,.k-airfryer{background:var(--muted)!important}.k-hazirlik{background:var(--ink)!important}
.dish{position:relative;overflow:hidden;grid-template-columns:1fr auto;align-items:end}
.dish h1{font-family:var(--display);font-size:clamp(24px,7vw,30px);line-height:1.08;margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
.dish .sq{width:96px;height:96px;border-radius:24px;overflow:hidden;box-shadow:0 6px 18px rgb(0 0 0 / .18),0 0 0 3px rgb(255 255 255 / .5);align-self:start}
.dish .sq img{width:100%;height:100%;object-fit:cover;display:block}
.dish .meta{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.dish .meta span{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.hatir{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--accent-soft);border:0}
.hatir .em{font-size:22px;line-height:1.2}
.hatir b{display:block;margin-bottom:2px}
.ing{list-style:none;margin:0;padding:0}
.ing li{border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.ing label{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;min-height:46px;cursor:pointer;font-size:15px}
.ing input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent)}
.ing input:checked + span{color:var(--muted);text-decoration:line-through}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:15px;line-height:1.5}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-size:14px;display:grid;place-items:center}
.side{display:grid;gap:12px}
.side h3{margin:0;font-family:var(--display);font-size:17px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:3px 8px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.tencere{background:var(--accent-soft);color:var(--accent-text)}
.tag.keyif{background:#FDEBD0;color:#8A4B00}
.item.bugun{background:var(--accent-soft)}
.item .dt{width:46px;flex:none;text-align:center;line-height:1.1}
.item .dt b{display:block;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.item .dt small{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.item .mid b{white-space:normal}
.shop .item{align-items:flex-start}
.shop .item input{flex:none;width:22px;height:22px;margin-top:1px;accent-color:var(--accent)}
.shop .item.ok .mid b{text-decoration:line-through;color:var(--muted)}
.shop .cat{background:var(--sunk);font-weight:600;font-size:13px;padding:8px 14px}
.shop .item{gap:8px;padding:0}
.shop .pick{flex:1;min-width:0;display:flex;align-items:flex-start;gap:12px;padding:12px 0 12px 14px;cursor:pointer}
.shop .fiyat{flex:none;border:0;background:none;color:var(--ink);text-align:right;padding:12px 14px 12px 6px;min-width:92px;display:grid;justify-items:end;gap:1px;font:inherit}
.shop .fiyat b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.shop .fiyat.girildi b{color:var(--ink)}
.shop .fiyat small{font-size:11.5px;color:var(--accent-text);font-weight:600}
.shop .item.ok .fiyat b{color:var(--ink)}
.shop .ekle{padding:14px;justify-content:center;font-weight:600;color:var(--accent-text);border-top:1px solid var(--line)}
.evde{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--accent-text)}
.cta{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;padding:14px;border-radius:var(--r);background:var(--sunk);color:var(--ink)}
.cta .em{font-size:28px}
.cta b{display:block;font-family:var(--display);font-size:16px}
.cta small{color:var(--muted);font-size:13px}
.uyari{background:var(--accent-soft);border-color:transparent;display:grid;gap:8px}
input[type=date]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
</style>
<script src="ortak.js"></script>
<script src="mutfak-veri.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand home" href="./" aria-label="Böcekler bölüm geçişi"><span class="homei" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></span><span>Böcekler<small>Mutfak</small></span></a>
    <span class="chef" aria-hidden="true"><img src="ikon-mutfak.jpg" alt="" width="44" height="44"></span>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Sekmeler"><div class="in">
  <button class="tab" data-tab="gun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-1.5 1-1.5 1-3M14 7c0-1.5 1-1.5 1-3"/></svg>Bugün</button>
  <button class="tab" data-tab="takvim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Takvim</button>
  <button class="tab" data-tab="liste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h2l2.5 11h10L20 8H6.5"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>Alışveriş</button>
</div></nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(() => {
const APP_VERSION = '1.2 · 4 Kasım 2026';
const KEY = 'bocekler-mutfak-v1';
const mode = 'local';
const M = window.MUTFAK, R = M.recipes, SD = M.sides, PLAN = M.plan, GUN = PLAN.length - 1;
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const bugun = () => isoOf(new Date());
const addDays = (iso, n) => { const d = new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return isoOf(d); };
const fark = (a, b) => Math.round((new Date(a+'T12:00') - new Date(b+'T12:00')) / 864e5);
const dayLabel = (iso, opt={day:'numeric',month:'long',weekday:'long'}) => new Date(iso+'T12:00').toLocaleDateString('tr-TR', opt);
const tl = new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0});
const tl2 = new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2});
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
// Türkçe yazım: "1.250,50" ya da "1250,5" ya da "45.5"
const tutar = v => { let x = String(v ?? '').trim().replace(/[₺\s]|tl/gi, ''); if(!x) return null;
  if(x.includes(',')) x = x.replace(/\./g, '').replace(',', '.'); else if(/^\d{1,3}(\.\d{3})+$/.test(x)) x = x.replace(/\./g, '');
  const n = parseFloat(x); return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null; };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT; function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- veri ---------- */
const BAS0 = '2026-11-04';   // ilk alışveriş günü; Takvim'den değiştirilebilir
const blank = () => ({bas: BAS0, tik: {}, alindi: {}, fiyat: {}, ekstra: [], gecmis: []});
const obj = x => x && typeof x === 'object' && !Array.isArray(x);
let okumaHatasi = false;
let S = (() => { try { const raw = localStorage.getItem(KEY); if(!raw) return blank(); const d = JSON.parse(raw);
  if(obj(d)) return {bas: /^\d{4}-\d{2}-\d{2}$/.test(d.bas) ? d.bas : BAS0, tik: obj(d.tik) ? d.tik : {}, alindi: obj(d.alindi) ? d.alindi : {},
    fiyat: Object.fromEntries(Object.entries(obj(d.fiyat) ? d.fiyat : {}).filter(([, v]) => isFinite(+v) && +v >= 0).map(([k, v]) => [k, +v])),
    ekstra: (Array.isArray(d.ekstra) ? d.ekstra : []).filter(e => obj(e) && e.id && e.ad && ['A','B'].includes(e.grup)).map(e => ({id: String(e.id), grup: e.grup, ad: String(e.ad).slice(0, 60), tl: isFinite(+e.tl) && e.tl !== null ? +e.tl : null})),
    gecmis: (Array.isArray(d.gecmis) ? d.gecmis : []).filter(g => obj(g) && g.id && Array.isArray(g.kalem))}; } catch(e){ okumaHatasi = true; } return blank(); })();
function snapYaz(){ Bocekler.snap('mutfak', {bas: S.bas, adlar: PLAN.map(([id, mod]) => (mod === 'gun2' ? '↻ ' : '') + R[id].name)}); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); okumaHatasi = false; } catch(e){ toast('Kayıt yapılamadı.'); } snapYaz(); }

const TUR = {tencere: 'Tencere', keyif: 'Keyif akşamı', tava: 'Tava', airfryer: 'Airfryer', hazirlik: 'Alışveriş günü', ekstra: 'Ekstra'};
const turYazi = (r, mod) => r.kind === 'tencere' ? `Tencere · ${mod === 'gun2' ? '2' : '1'}. gün` : TUR[r.kind];
const gunOf = iso => fark(iso, S.bas);
const plnOf = iso => { const i = gunOf(iso); return i >= 0 && i <= GUN ? {i, id: PLAN[i][0], mod: PLAN[i][1], ek: PLAN[i][2]} : null; };
const yapilanGun = (i, id) => { for(let j = i - 1; j >= 0; j--) if(PLAN[j][0] === id && PLAN[j][1] === 'yap') return j; return i - 1; };

/* ---------- görünüm ---------- */
const TABS = ['gun','takvim','liste'];
let view = {tab: TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'gun', gun: bugun()};
const main = document.getElementById('main'), sheetRoot = document.getElementById('sheetRoot');
function render(){
  Bocekler.applyTheme();
  document.querySelectorAll('nav .tab').forEach(b => { if(b.dataset.tab === view.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  main.innerHTML = view.tab === 'gun' ? rGun() : view.tab === 'takvim' ? rTakvim() : rListe();
  maybeTips(currentTipKey());
}

const tikli = (k) => !!S.tik[k];
const ingList = (list, pre) => `<ul class="ing items">${list.map((t, n) => { const k = pre + n; return `<li><label><input type="checkbox" data-tik="${esc(k)}" ${tikli(k) ? 'checked' : ''}><span>${esc(t)}</span></label></li>`; }).join('')}</ul>`;
const stepList = list => `<ol class="steps">${list.map(t => `<li><span>${esc(t)}</span></li>`).join('')}</ol>`;
const sideHTML = (sid, pre) => { const s = SD[sid]; return `<section class="side"><div class="sec-head" style="margin:0"><h2>Yanına: ${esc(s.name)}</h2><small>${esc(s.time)}</small></div>${ingList(s.ing, pre)}${s.steps.length > 1 ? `<div class="card">${stepList(s.steps)}</div>` : `<p class="note" style="margin:0 2px">${esc(s.steps[0])}</p>`}</section>`; };

function hatirlatma(p){
  if(!p || p.i >= GUN) return '';
  const [nid, nmod] = PLAN[p.i + 1], n = R[nid], out = [];
  if(nmod !== 'yap') return '';
  if(n.soak) out.push(`Bu akşam ${n.soak} bol suda ıslatmaya koy.`);
  if(n.et.length) out.push(p.i === 0 ? `Ayırdığın ${n.et.join(', ')} poşetini dondurma, buzdolabında bırak.` : `${n.et.join(', ')} poşetini buzluktan buzdolabına al.`);
  if(nid === 'doner') out.push('Yarın sabah tavuğu marine etmeyi unutma.');
  if(!out.length) return '';
  return `<section><div class="card hatir"><span class="em" aria-hidden="true">⏰</span><span><b>Yarın ${esc(n.name)} var</b><span class="note" style="color:var(--ink)">${out.map(esc).join(' ')}</span></span></div></section>`;
}

function rGun(){
  const t = bugun(), g = view.gun, p = plnOf(g), d = fark(g, t);
  const rel = d === 0 ? 'Bugün' : d === 1 ? 'Yarın' : d === -1 ? 'Dün' : '';
  const pzt = addDays(g, -((new Date(g+'T12:00').getDay() + 6) % 7));
  const hafta = Array.from({length: 7}, (_, k) => addDays(pzt, k));
  const nav = `<section style="margin-top:0"><div class="dnav"><button data-gun="${addDays(g, -1)}" aria-label="Önceki gün">‹</button>
    <div class="t"><b>${esc(dayLabel(g, {weekday:'long', day:'numeric', month:'long'}))}</b><small>${rel ? rel + ' · ' : ''}${p ? (p.i === 0 ? 'Alışveriş günü' : `${p.i}. gün / ${GUN}`) : 'Plan dışında'}</small></div>
    <button data-gun="${addDays(g, 1)}" aria-label="Sonraki gün">›</button></div>
    <div class="week">${hafta.map(h => { const q = plnOf(h), k = q ? R[q.id].kind : ''; return `<button data-gun="${h}" aria-pressed="${h === g}" class="${h === t ? 'bugun' : ''}" aria-label="${esc(dayLabel(h))}${q ? ': ' + esc(R[q.id].name) : ''}"><small>${esc(dayLabel(h, {weekday:'short'}))}</small><b>${new Date(h+'T12:00').getDate()}</b><i class="${k ? 'k-' + k : ''}"></i></button>`; }).join('')}</div>
    ${d !== 0 ? `<div class="btns" style="justify-content:center;margin-top:8px"><button class="chip" data-gun="${t}">Bugüne dön</button></div>` : ''}</section>`;
  if(!p){
    const once = gunOf(g) < 0;
    return `${nav}<section><div class="card empty"><b>${once ? 'Plan henüz başlamadı' : 'Bu ayın planı bitti'}</b>${once ? `Alışveriş günü ${esc(dayLabel(S.bas, {day:'numeric', month:'long'}))}. İleri ok ile o güne geç.` : 'Aynı 28 günlük menüyü yeniden başlatabilirsin. Sepet sıfırlanır, ödediğin fiyatlar geçmişte kalır.'}
      ${once ? '' : `<div class="btns" style="justify-content:center;margin-top:12px"><button class="btn" data-yeniay="1">Yeni ayı bugün başlat</button></div>`}</div></section>`;
  }
  const r = R[p.id], gun2 = p.mod === 'gun2', pre = `${g}:`;
  const hero = `<section><div class="hero dish"><span><span class="label">${rel ? (rel === 'Bugün' ? 'Bu akşam' : rel + ' akşam') : esc(dayLabel(g, {weekday:'long'})) + ' akşamı'}</span><h1>${esc(r.name)}</h1></span>
    <span class="sq" aria-hidden="true"><img src="ikon-mutfak.jpg" alt=""></span>
    <div class="meta"><span>${esc(turYazi(r, p.mod))}</span>${gun2 ? '<span>Isıt, 10 dk</span>' : `<span>${esc(r.time)}</span><span>${esc(r.serves)}</span>`}</div></div></section>`;
  let govde;
  if(gun2){
    const j = yapilanGun(p.i, p.id);
    govde = `<section><div class="sec-head"><h2>Dünden kalan</h2><small>${esc(dayLabel(addDays(S.bas, j), {day:'numeric', month:'long'}))} yapıldı</small></div>
      <div class="card">${stepList(['Yemeği tencereye al, 2-3 kaşık su ekle.', 'Kapağı kapalı kısık ateşte arada karıştırarak 8-10 dakika ısıt.', 'Zeytinyağlı sebze yemeklerini istersen ılık da yiyebilirsin.'])}</div>
      <button class="btn ghost" data-tarif="${esc(p.id)}" style="width:100%;margin-top:10px">Tarifin tamamını aç</button></section>`;
  } else {
    govde = `<section><div class="sec-head"><h2>Malzemeler</h2><small>Dokun: hazırladım</small></div>${ingList(r.ing, pre + 'm')}</section>
      <section><div class="sec-head"><h2>Yapılışı</h2></div><div class="card">${stepList(r.steps)}</div>
      ${r.note ? `<p class="note" style="margin:10px 2px 0">💡 ${esc(r.note)}</p>` : ''}</section>`;
  }
  const yanlar = [...(gun2 ? [] : (r.side || [])), ...(p.ek || [])];
  return `${okumaHatasi ? `<section style="margin-top:0"><div class="card uyari"><b>Mutfak kayıtları okunamadı</b><span class="note" style="color:var(--ink)">Kayıtların bozulmuş olabilir. İşaretlerin sıfırdan başlıyor.</span></div></section>` : ''}
    ${nav}${hero}${hatirlatma(p)}${govde}${yanlar.map(s => sideHTML(s, pre + 's' + s)).join('')}
    <section><button class="cta" data-tarif="corba"><span class="em" aria-hidden="true">🥣</span><span><b>Tek kaldığın akşam</b><small>Kırmızı mercimek çorbası · 30 dk · buzlukta 1 ay durur</small></span><span class="chev" aria-hidden="true">›</span></button></section>`;
}

function rTakvim(){
  const t = bugun();
  const haftalar = [];
  for(let i = 0; i <= GUN; i++){ const w = i === 0 ? 0 : Math.ceil(i / 7); (haftalar[w] = haftalar[w] || []).push(i); }
  const sayi = PLAN.filter(([id, m]) => R[id].kind === 'tencere' && m === 'yap').length, keyif = PLAN.filter(([id]) => R[id].kind === 'keyif').length;
  return `<section style="margin-top:0"><div class="hero"><span class="label">28 günlük menü</span>
    <div class="row"><div class="cell"><span class="label">Tencere yemeği</span><b>${sayi} çeşit · 2'şer gün</b></div><div class="cell"><span class="label">Keyif akşamı</span><b>${keyif} cuma</b></div></div>
    <span style="font-size:14px">Zeytinyağı ağırlıklı, kızartmasız; köfteler airfryer'da ya da az yağlı tavada; fırın gerekmez. Etler kasaptan, alışveriş günü porsiyonlanıp dondurulur.</span></div></section>
    ${haftalar.map((g, w) => `<section><div class="sec-head"><h2>${w === 0 ? 'Hazırlık' : w + '. hafta'}</h2><small>${esc(dayLabel(addDays(S.bas, g[0]), {day:'numeric', month:'short'}))}${g.length > 1 ? ' – ' + esc(dayLabel(addDays(S.bas, g[g.length-1]), {day:'numeric', month:'short'})) : ''}</small></div>
      <div class="items">${g.map(i => { const [id, mod] = PLAN[i], r = R[id], iso = addDays(S.bas, i);
        return `<button class="item${iso === t ? ' bugun' : ''}" data-git="${iso}"><span class="dt"><b>${new Date(iso+'T12:00').getDate()}</b><small>${esc(dayLabel(iso, {weekday:'short'}))}</small></span>
          <span class="mid"><b>${mod === 'gun2' ? '↻ ' : ''}${esc(r.name)}</b><small>${mod === 'gun2' ? 'Dünden kalan, ısıt' : esc(r.time)}${iso === t ? ' · bugün' : ''}</small></span>
          <span class="tag ${r.kind}">${esc(turYazi(r, mod))}</span></button>`; }).join('')}</div></section>`).join('')}
    <section><div class="card" style="display:grid;gap:10px"><b style="font-family:var(--display);font-size:17px">Alışveriş günü</b>
      <span class="note">Menü bu günden sayılır: ertesi gün 1. gün olur. Alışverişi başka gün yaptıysan buradan değiştir.</span>
      <input type="date" id="basGun" value="${esc(S.bas)}" aria-label="Alışveriş günü"></div>
      <p class="note" style="margin:10px 2px 0">Sürüm ${APP_VERSION}</p></section>`;
}

const ROWS = {A: M.shopA, B: M.shopB};
const grupRows = g => [...ROWS[g].map(r => ({...r, k: g + ':' + r.key})), ...S.ekstra.filter(e => e.grup === g).map(e => ({k: g + ':x-' + e.id, ekstra: e, name: e.ad, cat: 'Listede olmayanlar', qty: 'Sonradan eklendi', unit: '', cost: null}))];
// sepetteki bir ürünün tutarı: girdiğin fiyat, yoksa tahmin
const tutarOf = r => r.ekstra ? r.ekstra.tl : S.fiyat[r.k] ?? r.cost;
const sepet = g => { const sec = grupRows(g).filter(r => S.alindi[r.k]); return {sec, top: sec.reduce((a, r) => a + (tutarOf(r) || 0), 0),
  gercek: sec.filter(r => r.ekstra ? r.ekstra.tl != null : S.fiyat[r.k] != null)}; };
const sonFiyat = key => { for(const g of S.gecmis) { const k = g.kalem.find(x => x.key === key && x.tl != null); if(k) return {tl: k.tl, tarih: g.tarih}; } return null; };
function shopGrup(g){
  let cat = '', html = '';
  for(const r of grupRows(g)){
    if(r.cat !== cat){ cat = r.cat; html += `<div class="cat">${esc(cat)}</div>`; }
    const ok = !!S.alindi[r.k], f = r.ekstra ? r.ekstra.tl : S.fiyat[r.k];
    html += `<div class="item${ok ? ' ok' : ''}"><label class="pick"><input type="checkbox" data-al="${esc(r.k)}" ${ok ? 'checked' : ''} aria-label="${esc(r.name)} sepette"><span class="mid"><b>${esc(r.name)}${r.pantry ? '<span class="evde">evde varsa alma</span>' : ''}</b><small>${esc(r.qty)}${r.unit ? ' · ' + esc(r.unit) : ''}</small></span></label>
      <button class="fiyat${f != null ? ' girildi' : ''}" data-fiyat="${esc(r.k)}" aria-label="${esc(r.name)} fiyatını yaz">${f != null ? `<b>${esc(tl2.format(f))}</b>${r.cost != null ? `<small>tahmin ${esc(tl.format(r.cost))}</small>` : '<small>ödenen</small>'}` : `<b>${r.cost != null ? esc(tl.format(r.cost)) : '—'}</b><small>${r.cost != null ? 'tahmin' : 'fiyat yaz'} ✎</small>`}</button></div>`;
  }
  return `<div class="items shop">${html}<button class="item ekle" data-ekstra="${g}">＋ Listede olmayan ürün ekle</button></div>`;
}
function grupKutu(g, baslik, alt){
  const s = sepet(g);
  return `<section><div class="sec-head"><h2>${baslik}</h2><small>${alt}</small></div>${shopGrup(g)}
    <div class="btns" style="margin-top:10px"><button class="btn${s.sec.length ? '' : ' ghost'}" data-bitir="${g}" style="flex:1"${s.sec.length ? '' : ' disabled'}>${S.gecmis.some(x => x.id === S.bas + '-' + g) ? 'Kaydı güncelle' : 'Alışverişi bitir ve kaydet'} · ${esc(tl.format(s.top))}</button></div></section>`;
}
function rListe(){
  const a = sepet('A'), b = sepet('B'), tB = addDays(S.bas, 14), T = M.totals;
  const ger = [...a.gercek, ...b.gercek], gT = ger.reduce((x, r) => x + tutarOf(r), 0), gTah = ger.filter(r => r.cost != null).reduce((x, r) => x + r.cost, 0), gFark = ger.filter(r => r.cost != null).reduce((x, r) => x + tutarOf(r), 0) - gTah;
  return `<section style="margin-top:0"><div class="hero"><span class="label">Sepetim</span><span class="big num">${esc(tl.format(a.top + b.top))}</span>
    <div class="row"><div class="cell"><span class="label">Bugün · ${a.sec.length} ürün</span><b class="num">${esc(tl.format(a.top))}</b></div><div class="cell"><span class="label">${esc(dayLabel(tB, {day:'numeric', month:'short'}))} · ${b.sec.length} ürün</span><b class="num">${esc(tl.format(b.top))}</b></div></div>
    <span style="font-size:14px">${ger.length ? `Fiyatını yazdığın ${ger.length} ürün: <strong class="num">${esc(tl2.format(gT))}</strong>${gTah ? ` · tahmine göre <strong class="num">${gFark > 0 ? '+' : gFark < 0 ? '−' : ''}${esc(tl.format(Math.abs(gFark)))}</strong>` : ''}` : 'İşaretlediğin ürünler sepete eklenir. Fiyatı farklıysa tutara dokunup ödediğini yaz.'}<br>Listenin tamamı tahminen ${esc(tl.format(T.all))}.</span></div></section>
    ${grupKutu('A', 'Bugün al', 'Et, kiler, ilk 2 haftanın tazesi')}
    ${grupKutu('B', esc(dayLabel(tB, {day:'numeric', month:'long', weekday:'long'})), 'Son 2 haftanın tazesi')}
    <section><div class="sec-head"><h2>Geçmiş alışverişler</h2><small>${S.gecmis.length ? 'Dokun: ürün ürün' : ''}</small></div>
      ${S.gecmis.length ? `<div class="items">${S.gecmis.map(g => { const tah = g.kalem.filter(k => k.tahmin != null && k.tl != null), f = tah.reduce((x, k) => x + k.tl - k.tahmin, 0);
        return `<button class="item" data-gecmis="${esc(g.id)}"><span class="mid"><b>${esc(dayLabel(g.tarih, {day:'numeric', month:'long', year:'numeric'}))} · ${g.grup === 'A' ? 'ana alışveriş' : 'tazeleme'}</b><small>${g.kalem.length} ürün${tah.length ? ` · fiyatı yazılan ${tah.length} üründe ${f > 0 ? 'tahminden ' + esc(tl.format(f)) + ' pahalı' : f < 0 ? 'tahminden ' + esc(tl.format(-f)) + ' ucuz' : 'tahminle aynı'}` : ''}</small></span><span class="amt num">${esc(tl.format(g.toplam))}</span></button>`; }).join('')}</div>`
        : `<div class="card empty"><b>Henüz kayıt yok</b>Alışverişi bitirince ödediğin fiyatlar burada ay ay saklanır; sonraki ay tahminle karşılaştırırsın.</div>`}</section>
    <section><p class="note" style="margin:0 2px">Tahminler: et Samsun kasabı (kıyma 900, göğüs 280, kemiksiz but 250 TL/kg), diğerleri Kasım 2026 zincir market raf fiyatları. Tutar yazmadığın ürün sepete tahmini fiyatla girer.</p>
      <div class="btns" style="margin-top:12px"><button class="btn ghost" data-sifirla="1" style="flex:1">Sepeti boşalt</button></div></section>`;
}
function arsivle(g){
  const s = sepet(g); if(!s.sec.length) return false;
  const id = S.bas + '-' + g, kayit = {id, grup: g, tarih: g === 'A' ? S.bas : addDays(S.bas, 14), kaydedildi: bugun(), toplam: Math.round(s.top * 100) / 100,
    kalem: s.sec.map(r => ({key: r.ekstra ? 'x:' + r.name.toLocaleLowerCase('tr') : r.key, ad: r.name, miktar: r.ekstra ? '' : r.qty, tahmin: r.cost, tl: r.ekstra ? r.ekstra.tl : S.fiyat[r.k] ?? null}))};
  S.gecmis = [kayit, ...S.gecmis.filter(x => x.id !== id)].sort((x, y) => y.tarih.localeCompare(x.tarih)).slice(0, 36);
  return true;
}
function openFiyat(k){
  const r = [...grupRows('A'), ...grupRows('B')].find(x => x.k === k); if(!r) return;
  const f = r.ekstra ? r.ekstra.tl : S.fiyat[k], son = r.ekstra ? null : sonFiyat(r.key);
  openSheet(`${head(r.name)}<div class="note" style="color:var(--ink)">${r.ekstra ? 'Listeye sonradan eklediğin ürün.' : `${esc(r.qty)}${r.cost != null ? ` · tahmin <b>${esc(tl.format(r.cost))}</b>` : ''}`}${son ? `<br>Geçen sefer ödediğin: <b>${esc(tl2.format(son.tl))}</b> (${esc(dayLabel(son.tarih, {day:'numeric', month:'long'}))})` : ''}</div>
    <label class="field"><span class="label">Ödediğin tutar (bu miktarın toplamı)</span><input id="fGir" inputmode="decimal" autocomplete="off" placeholder="${r.cost != null ? esc(String(r.cost)) : 'Örn. 125,50'}" value="${f != null ? esc(String(f).replace('.', ',')) : ''}" style="font:inherit;font-size:20px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></label>
    <div class="btns"><button class="btn" id="fKaydet" style="flex:1">Kaydet ve sepete ekle</button>${f != null || r.ekstra ? `<button class="btn ghost" id="fSil">${r.ekstra ? 'Ürünü sil' : 'Tahmine dön'}</button>` : ''}</div>`, 'Fiyat');
  const inp = document.getElementById('fGir'); setTimeout(() => inp.focus(), 250);
  const kaydet = () => { const v = tutar(inp.value); if(v === null) return toast('Tutarı rakamla yaz, örn. 125,50'); if(r.ekstra) r.ekstra.tl = v; else S.fiyat[k] = v; S.alindi[k] = 1; save(); closeSheet(); keepScroll(); toast(r.name + ': ' + tl2.format(v)); };
  document.getElementById('fKaydet').onclick = kaydet; inp.addEventListener('keydown', e => { if(e.key === 'Enter') kaydet(); });
  const sil = document.getElementById('fSil'); if(sil) sil.onclick = () => { if(r.ekstra){ S.ekstra = S.ekstra.filter(e => e.id !== r.ekstra.id); delete S.alindi[k]; } else delete S.fiyat[k]; save(); closeSheet(); keepScroll(); };
}
function openEkstra(g){
  openSheet(`${head('Listede olmayan ürün')}<label class="field"><span class="label">Ürün</span><input id="eAd" maxlength="60" autocomplete="off" placeholder="Örn. Çay 1 kg" style="font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></label>
    <label class="field"><span class="label">Ödediğin tutar</span><input id="eTl" inputmode="decimal" autocomplete="off" placeholder="Örn. 89,90" style="font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></label>
    <button class="btn" id="eKaydet">Sepete ekle</button>`, 'Ürün ekle');
  setTimeout(() => document.getElementById('eAd').focus(), 250);
  document.getElementById('eKaydet').onclick = () => { const ad = document.getElementById('eAd').value.trim(), v = tutar(document.getElementById('eTl').value);
    if(!ad) return toast('Ürün adını yaz'); if(v === null) return toast('Tutarı rakamla yaz, örn. 89,90');
    const e = {id: uid(), grup: g, ad, tl: v}; S.ekstra.push(e); S.alindi[g + ':x-' + e.id] = 1; save(); closeSheet(); keepScroll(); toast(ad + ' sepete eklendi'); };
}
function openGecmis(id){
  const g = S.gecmis.find(x => x.id === id); if(!g) return;
  openSheet(`${head(dayLabel(g.tarih, {day:'numeric', month:'long', year:'numeric'}))}<div class="note">${g.grup === 'A' ? 'Ana alışveriş' : 'Tazeleme'} · ${g.kalem.length} ürün · toplam <b style="color:var(--ink)">${esc(tl2.format(g.toplam))}</b></div>
    <div class="items">${g.kalem.map(k => { const d = k.tl != null && k.tahmin != null ? k.tl - k.tahmin : null;
      return `<div class="item"><span class="mid"><b>${esc(k.ad)}</b><small>${esc(k.miktar || '')}${k.tahmin != null ? ' · tahmin ' + esc(tl.format(k.tahmin)) : ''}${d ? ` · <span style="color:${d > 0 ? 'var(--out)' : 'var(--in)'}">${d > 0 ? '+' : '−'}${esc(tl.format(Math.abs(d)))}</span>` : ''}</small></span><span class="amt num">${k.tl != null ? esc(tl2.format(k.tl)) : `<span style="color:var(--muted)">≈ ${esc(tl.format(k.tahmin || 0))}</span>`}</span></div>`; }).join('')}</div>
    <p class="note" style="margin:0">≈ olanlara fiyat yazılmamış, tahmin sayıldı. Bu kaydı güncellemek için o dönemin listesinde fiyatları düzeltip tekrar kaydet.</p>
    <button class="btn ghost" id="gSil">Bu kaydı sil</button>`, 'Geçmiş alışveriş');
  let onay = 0; document.getElementById('gSil').onclick = e => { if(Date.now() - onay > 3000){ onay = Date.now(); e.target.textContent = 'Emin misin? Tekrar dokun'; return; } S.gecmis = S.gecmis.filter(x => x.id !== id); save(); closeSheet(); keepScroll(); toast('Kayıt silindi'); };
}
const keepScroll = () => { const y = scrollY; render(); scrollTo(0, y); };

/* ---------- pencereler ---------- */
let geriFn = null;
function openSheet(html, label, geri){ geriFn = geri || null; sheetRoot.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="in"><div class="grab"></div>${html}</div></div>`;
  sheetRoot.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheetAnimated); return sheetRoot.querySelector('.sheet'); }
const head = t => `<div class="sec-head" style="margin:0"><h2>${esc(t)}</h2><button class="icon-btn" data-close>Kapat</button></div>`;
function closeSheet(){ geriFn = null; sheetRoot.innerHTML = ''; }
function closeSheetAnimated(){ if(geriFn){ const g = geriFn; geriFn = null; return g(); } const sh = sheetRoot.querySelector('.sheet'), sc = sheetRoot.querySelector('.scrim'); if(!sh) return closeSheet();
  sh.style.transition = 'transform .2s ease-in'; sh.style.transform = 'translateY(105%)'; if(sc){ sc.style.transition = 'opacity .2s'; sc.style.opacity = '0'; } setTimeout(closeSheet, 200); }
// Pencereyi aşağı çekerek kapatma: tutamaktan her zaman, içerikten en üstteyken
(() => {
  let d = null;
  const start = (y, target) => {
    const sh = target.closest('.sheet'); if(!sh || target.closest('input,select,textarea')) return;
    d = { sh, y0:y, t0:Date.now(), dy:0, on:false, grab: !!target.closest('.grab') };
  };
  const move = (y, ev) => {
    if(!d) return;
    d.dy = y - d.y0;
    if(!d.on){
      if(d.dy > 8 && (d.grab || d.sh.scrollTop <= 0)){ d.on = true; d.sh.classList.add('dragging'); }
      else if(d.dy < -8 && !d.grab){ d = null; return; }
    }
    if(d.on){ if(ev.cancelable) ev.preventDefault(); d.sh.style.transform = `translateY(${Math.max(0,d.dy)}px)`;
      const sc = sheetRoot.querySelector('.scrim'); if(sc) sc.style.opacity = String(Math.max(.2, 1 - d.dy/400)); }
  };
  const end = () => {
    if(!d) return;
    const {sh, dy, on, t0} = d; d = null; if(!on) return;
    const fast = dy / Math.max(1, Date.now()-t0) > .5;
    if(dy > 110 || (fast && dy > 30)) closeSheetAnimated();
    else { sh.classList.remove('dragging'); sh.style.transition = 'transform .2s ease-out'; sh.style.transform = '';
      const sc = sheetRoot.querySelector('.scrim'); if(sc){ sc.style.transition='opacity .2s'; sc.style.opacity=''; }
      setTimeout(()=>{ sh.style.transition=''; }, 220); }
  };
  sheetRoot.addEventListener('touchstart', e => start(e.touches[0].clientY, e.target), {passive:true});
  sheetRoot.addEventListener('touchmove', e => move(e.touches[0].clientY, e), {passive:false});
  sheetRoot.addEventListener('touchend', end); sheetRoot.addEventListener('touchcancel', end);
  sheetRoot.addEventListener('mousedown', e => { if(e.target.closest('.grab')) start(e.clientY, e.target); });
  window.addEventListener('mousemove', e => move(e.clientY, e)); window.addEventListener('mouseup', end);
})();

document.addEventListener('keydown', e => { if(e.key === 'Escape' && sheetRoot.innerHTML) closeSheetAnimated(); });
function openTarif(id){
  const r = R[id];
  openSheet(`${head(r.name)}<div class="chips"><span class="tag ${r.kind}">${esc(TUR[r.kind])}</span><span class="tag">${esc(r.time)}</span><span class="tag">${esc(r.serves)}</span></div>
    <div><div class="label" style="margin-bottom:8px">Malzemeler</div><div class="items" style="padding:10px 14px"><ul style="margin:0;padding-left:18px;display:grid;gap:6px">${r.ing.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div></div>
    <div><div class="label" style="margin-bottom:8px">Yapılışı</div>${stepList(r.steps)}</div>${r.note ? `<p class="note" style="margin:0">💡 ${esc(r.note)}</p>` : ''}`, r.name);
}

/* ---------- olaylar ---------- */
const gec = tab => { view.tab = tab; render(); window.scrollTo(0, 0); history.replaceState(null, '', '#' + tab); };
document.querySelectorAll('nav .tab').forEach(b => b.onclick = () => { if(b.dataset.tab === 'gun' && view.tab === 'gun') view.gun = bugun(); gec(b.dataset.tab); });
let sifirOnay = 0;
main.addEventListener('click', e => {
  const t = e.target.closest('[data-gun],[data-git],[data-tarif],[data-yeniay],[data-sifirla],[data-fiyat],[data-ekstra],[data-bitir],[data-gecmis]'); if(!t) return;
  const d = t.dataset;
  if(d.gun){ view.gun = d.gun; render(); return; }
  if(d.git){ view.gun = d.git; gec('gun'); return; }
  if(d.tarif) return openTarif(d.tarif);
  if(d.fiyat) return openFiyat(d.fiyat);
  if(d.ekstra) return openEkstra(d.ekstra);
  if(d.gecmis) return openGecmis(d.gecmis);
  if(d.bitir){ if(arsivle(d.bitir)){ save(); keepScroll(); toast('Kaydedildi, geçmiş alışverişlerde'); } return; }
  if(d.yeniay){ arsivle('A'); arsivle('B'); S = {...blank(), bas: bugun(), gecmis: S.gecmis}; save(); view.gun = bugun(); render(); toast('Yeni ay başladı: bugün alışveriş günü'); return; }
  if(d.sifirla){ if(Date.now() - sifirOnay > 3000){ sifirOnay = Date.now(); t.textContent = 'Emin misin? Tekrar dokun'; return; } S.alindi = {}; S.fiyat = {}; S.ekstra = []; save(); render(); toast('Sepet boşaltıldı; geçmiş kayıtlar duruyor'); }
});
main.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.tik !== undefined){ if(el.checked) S.tik[el.dataset.tik] = 1; else delete S.tik[el.dataset.tik];
    // eski günlerin işaretleri birikmesin
    const sinir = addDays(bugun(), -7); for(const k of Object.keys(S.tik)) if(k.slice(0, 10) < sinir) delete S.tik[k]; save(); return; }
  if(el.dataset.al !== undefined){ if(el.checked) S.alindi[el.dataset.al] = 1; else delete S.alindi[el.dataset.al]; save(); const y = scrollY; render(); scrollTo(0, y); return; }
  if(el.id === 'basGun' && /^\d{4}-\d{2}-\d{2}$/.test(el.value)){ S.bas = el.value; save(); render(); toast('Menü ' + dayLabel(S.bas, {day:'numeric', month:'long'}) + ' alışverişine göre ayarlandı'); }
});

/* ---------- tek seferlik ipuçları ---------- */
const TIP_KEY = 'ipuclari-v1';
const tipSeen = () => { try { return JSON.parse(localStorage.getItem(TIP_KEY) || '{}') || {}; } catch(e){ return {}; } };
const tipMark = k => { try { const s = tipSeen(); s[k] = 1; localStorage.setItem(TIP_KEY, JSON.stringify(s)); } catch(e){} };
const TIPS = {
  'm-gun': [['.dish', 'Bu akşamın yemeği', 'Tarihe göre o günün menüsü açılır. Oklarla ya da haftadaki günlere dokunarak başka günün yemeğine bak.'],
    ['.ing', 'Malzemeler', 'Hazırladığın malzemeye dokun, üstü çizilsin.']],
  'm-takvim': [['.items', 'Ayın menüsü', 'Bir güne dokun, o günün tarifi açılır. ↻ olanlar bir önceki günün tenceresinden.']],
  'm-liste': [['.shop', 'Alışveriş listesi', 'Sepete koyduğun ürünü işaretle, üstteki tutar artar. Fiyat farklıysa sağdaki tutara dokunup ödediğini yaz.']]
};
const currentTipKey = () => 'm-' + view.tab;
const TIP_FORM = k => k === 's-ekle' || k === 's-miktar';
let tipOn = false;
function tipPick(sel){ const el = typeof sel === 'function' ? sel() : document.querySelector(sel); return el && el.getClientRects().length ? el : null; }
function maybeTips(key){
  if(!key || tipOn || mode === 'loading' || !TIPS[key] || tipSeen()[key]) return;
  if(/[?&]test\b/.test(location.search) && !window.__tipsTest) return;
  if(document.getElementById('splash')) return setTimeout(() => maybeTips(currentTipKey()), 700);
  if(!TIP_FORM(key) && document.querySelector('#sheetRoot .sheet')) return;
  tipOn = true;
  setTimeout(() => {
    if(!TIP_FORM(key) && key !== currentTipKey()){ tipOn = false; return maybeTips(currentTipKey()); }   // bu arada sekme değiştiyse
    const steps = TIPS[key].filter(s => tipPick(s[0])); if(!steps.length){ tipOn = false; return; } runTips(key, steps); }, TIP_FORM(key) ? 450 : 250);
}
function runTips(key, steps){
  try { document.activeElement && document.activeElement.blur(); } catch(e){}   // klavye açılıp ipucunu örtmesin
  const ov = document.createElement('div'); ov.id = 'tips'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
  ov.innerHTML = '<div class="tip-spot"></div><div class="tip-box" aria-live="polite"></div>';
  document.body.appendChild(ov);
  const spot = ov.firstChild, box = ov.lastChild; let i = 0, cur = null;
  const end = () => { tipMark(key); ov.remove(); tipOn = false; removeEventListener('resize', place); };
  const place = () => {
    if(!cur) return; const r = cur.getBoundingClientRect(), pad = 6;
    Object.assign(spot.style, {left:(r.left-pad)+'px', top:(r.top-pad)+'px', width:(r.width+pad*2)+'px', height:(r.height+pad*2)+'px'});
    const w = Math.min(340, innerWidth - 32), bh = box.offsetHeight, below = r.bottom + pad + 12, above = r.top - pad - 12 - bh;
    box.style.width = w + 'px'; box.style.left = Math.max(16, Math.min(innerWidth - w - 16, r.left + r.width/2 - w/2)) + 'px';
    box.style.top = (below + bh < innerHeight - 12 ? below : above > 12 ? above : Math.max(12, innerHeight - bh - 12)) + 'px';
  };
  const show = () => {
    const [sel, title, text] = steps[i]; cur = tipPick(sel);
    if(!cur){ if(++i < steps.length) return show(); return end(); }
    const r0 = cur.getBoundingClientRect(); if(r0.top < 70 || r0.bottom > innerHeight - 90) cur.scrollIntoView({block: r0.height > innerHeight*.5 ? 'start' : 'center'});
    box.innerHTML = `<small>${i+1} / ${steps.length}</small><b>${esc(title)}</b><p>${esc(text)}</p><div class="btns"><button class="btn ghost" data-tskip>${i === steps.length-1 ? 'Kapat' : 'Geç'}</button><button class="btn" data-tnext>${i === steps.length-1 ? 'Anladım' : 'İleri'}</button></div>`;
    box.querySelector('[data-tskip]').onclick = end;
    box.querySelector('[data-tnext]').onclick = () => { if(++i < steps.length) show(); else end(); };
    requestAnimationFrame(() => requestAnimationFrame(place)); setTimeout(place, 80);
  };
  addEventListener('resize', place);
  ov.addEventListener('click', e => { if(e.target === ov || e.target === spot){ e.stopPropagation(); } });
  show();
}


render(); snapYaz();
addEventListener('pageshow', e => { if(e.persisted) render(); });
document.addEventListener('visibilitychange', () => { if(!document.hidden && !sheetRoot.innerHTML) render(); });
if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
</script>
