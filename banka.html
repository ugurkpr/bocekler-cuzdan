<style>
/* Layout: tek sütun telefon uygulaması — üstte ay seçici, ortada sekme içeriği, altta sabit sekme çubuğu + ekle düğmesi */
:root{
  --bg:#FFFAEB; --surface:#FFFFFF; --sunk:#FDF0C9; --line:#F3E3B2;
  --ink:#262006; --muted:#76683A;
  --accent:#F2B600; --accent-ink:#241C00; --accent-text:#9A6E00; --accent-soft:#FFEDB0;
  --hero:linear-gradient(135deg,#FFD83D 0%,#F5A800 100%);
  --in:#1E9E57; --out:#E5484D; --warn:#F08C00; --alarm:#E5484D; --mid:color-mix(in oklch, var(--accent), var(--alarm));
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0C0F; --surface:#18181E; --sunk:#23232B; --line:#30303A;
  --ink:#F8F6EE; --muted:#A9A69C;
  --accent:#FFD23F; --accent-ink:#1A1500; --accent-text:#FFD23F; --accent-soft:#3A3212;
  --hero:linear-gradient(135deg,#FFE066 0%,#FFB300 100%);
  --in:#3DD68C; --out:#FF6B6B; --warn:#FF9F1A; --alarm:#FF6B6B; --mid:color-mix(in oklch, var(--accent), var(--alarm)); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0C0F; --surface:#18181E; --sunk:#23232B; --line:#30303A;
  --ink:#F8F6EE; --muted:#A9A69C;
  --accent:#FFD23F; --accent-ink:#1A1500; --accent-text:#FFD23F; --accent-soft:#3A3212;
  --hero:linear-gradient(135deg,#FFE066 0%,#FFB300 100%);
  --in:#3DD68C; --out:#FF6B6B; --warn:#FF9F1A; --alarm:#FF6B6B; --mid:color-mix(in oklch, var(--accent), var(--alarm)); color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px calc(160px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:6px 14px}
.brand{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.05;letter-spacing:-.01em;min-width:0}
.brand.home{display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;min-height:44px;margin-left:-4px}
.brand .homei{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.brand.home:active .homei{transform:scale(.94)}
.brand small{display:block;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;width:40px;height:40px;border-radius:50%;font-size:18px;line-height:1}
.month button:hover{background:var(--sunk)}
.month .mlabel{width:auto;min-width:96px;padding:0 6px;border-radius:999px;font-size:14px;font-weight:600}
.top-r{display:flex;align-items:center;gap:6px}
.lrow{display:flex;align-items:center;gap:6px}
.goz{border:0;background:color-mix(in srgb,currentColor 14%,transparent);color:inherit;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin:-8px 0;padding:0;flex:none}
.goz svg{width:18px;height:18px}
.gear{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.gear svg{width:20px;height:20px}
.gear[aria-current="page"]{color:var(--accent);border-color:var(--accent)}

/* summary */
.hero{background:var(--hero);color:var(--accent-ink);border-radius:20px;padding:18px 18px 16px;display:grid;gap:14px}
.hero .label{color:inherit;opacity:.75}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.herobtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid color-mix(in srgb,var(--accent-ink) 55%,transparent);background:color-mix(in srgb,var(--accent-ink) 12%,transparent);color:inherit;font:inherit;font-weight:700;font-size:14px;border-radius:999px;min-height:40px;padding:0 14px}
.herobtn svg{width:18px;height:18px}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,46px);line-height:1;letter-spacing:-.02em}
.hero .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .cell{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);border-radius:12px;padding:10px 12px}
.hero .cell b{display:block;font-size:17px;font-weight:600;margin-top:2px}

section{margin-top:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-head h2{font-size:19px}
.sec-head small{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* budget bars */
.bars{display:grid;gap:14px}
.plain{display:grid;gap:0;margin-top:14px;padding-top:6px;border-top:1px solid var(--line)}
.plain:first-child{margin-top:0;padding-top:0;border-top:0}
.plain .label{margin-bottom:4px}
.bar-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-size:14px;margin-bottom:6px}
.bar-top span:first-child{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-top span:last-child{color:var(--muted);white-space:nowrap;margin-left:auto}
.track{position:relative;height:10px;border-radius:6px;background:var(--sunk);overflow:visible}
.fill{height:100%;border-radius:6px;background:var(--accent);transition:width .4s ease}
.limit{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.pill.near{--tip:color-mix(in oklch,var(--mid),var(--alarm) 30%);background:color-mix(in srgb,var(--tip) 18%,transparent);color:color-mix(in srgb,var(--tip) 70%,var(--ink))}
.pill.over{background:color-mix(in srgb,var(--alarm) 18%,transparent);color:color-mix(in srgb,var(--alarm) 75%,var(--ink))}

/* trend */
.trend svg{display:block;width:100%;height:auto}
.trend .hit{cursor:pointer}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* list */
.day{margin-top:14px}
.day:first-child{margin-top:0}
.day h3{display:flex;justify-content:space-between;gap:8px;font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.items{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item:hover{background:var(--sunk)}
.dot{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-family:var(--display);font-size:15px;background:var(--sunk);color:var(--muted)}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mid small{color:var(--muted);font-size:13px}
.amt{font-weight:600;white-space:nowrap}
.amt.in{color:var(--in)} .amt.out{color:var(--ink)}
.rec{font-size:11px;color:var(--accent-text);font-weight:600;margin-left:6px}

.empty{text-align:center;color:var(--muted);padding:26px 14px}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:17px;margin-bottom:4px}

/* settings */
.profile{display:flex;align-items:center;gap:14px}
.avatar{flex:none;width:68px;height:68px;border-radius:22px;overflow:hidden;cursor:pointer;position:relative;background:var(--sunk);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar span{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px;font-weight:700;border:2px solid var(--surface)}
.profile .who{flex:1;min-width:0;display:grid;gap:2px}
.pname{font-family:var(--display);font-size:22px;font-weight:700;border:0;background:none;padding:2px 0;border-bottom:2px dashed transparent;border-radius:0}
.pname:focus{outline:none;border-bottom-color:var(--accent)}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.pstats div{background:var(--sunk);border-radius:12px;padding:10px;display:grid;gap:2px}
.pstats b{font-family:var(--display);font-size:18px}
.pstats small{font-size:12px;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.swatch{border:0;background:none;display:grid;justify-items:center;gap:6px;padding:0;font-size:12px;font-weight:600;color:var(--muted)}
.swatch i{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-size:20px;font-weight:700;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .08)}
.swatch[aria-pressed="true"]{color:var(--ink)}
.swatch[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.set-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0;padding-top:0}
.set-row .name{flex:1;min-width:0}
.set-row input{width:110px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;min-width:44px;padding:0 12px;font-size:14px;font-weight:600}
.icon-btn.danger{color:var(--out)}
.note{font-size:13px;color:var(--muted)}
.mode{display:flex;gap:10px;align-items:flex-start}
.mode i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--in);margin-top:6px}
.mode i.local{background:var(--warn)}

input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:90px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
#tips{position:fixed;inset:0;z-index:90}
#tips .tip-spot{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgb(0 0 0 / .62);transition:all .25s ease;pointer-events:none}
#tips .tip-box{position:fixed;background:var(--surface);color:var(--ink);border:1px solid color-mix(in oklch, var(--accent), transparent 45%);border-radius:16px;padding:14px 16px;box-shadow:0 12px 32px rgb(0 0 0 / .3);display:grid;gap:6px;transition:top .25s ease,left .25s ease}
#tips .tip-box small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#tips .tip-box b{font-family:var(--display);font-size:18px;line-height:1.2}
#tips .tip-box p{margin:0;font-size:14.5px;line-height:1.45}
#tips .tip-box .btns{display:flex;gap:8px;margin-top:6px} #tips .tip-box .btn{flex:1;min-height:44px}
@media (prefers-reduced-motion: reduce){ #tips .tip-spot,#tips .tip-box{transition:none} }
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--out);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
nav.tabs button.tab{border:0;background:none;padding:8px 0;font-size:12px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:2px}
nav.tabs button.tab svg{width:22px;height:22px}
nav.tabs button.tab[aria-current="page"]{color:var(--accent-text)}
.fab{position:fixed;z-index:6;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--hero);color:var(--accent-ink);font-size:32px;line-height:1;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent)}
.fab:active{transform:scale(.95)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .38);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-radius:22px 22px 0 0;max-height:92%;overflow:auto;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:grid;gap:14px}
.grab{height:26px;margin:-10px -16px -6px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab::before{content:'';width:44px;height:5px;border-radius:3px;background:var(--line)}
.sheet.dragging{transition:none!important;animation:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:10px;padding:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.amount-in{font-family:var(--display);font-size:34px;font-weight:700;border:0;border-bottom:2px solid var(--line);border-radius:0;background:none;padding:4px 0}
.amount-in:focus-visible{outline:none;border-bottom-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;min-height:40px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.field{display:grid;gap:6px}

/* savings */
.assets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.asset{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;min-width:0}
.asset:last-child{grid-column:span 2}
.asset .q{font-family:var(--display);font-size:21px;font-weight:700;overflow-wrap:anywhere}
.asset small{color:var(--muted);font-size:13px}
.streak{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.streak div{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted)}
.streak b{width:100%;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:var(--sunk);color:var(--muted)}
.streak b.ok{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.streak b.neg{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.streak .cur{color:var(--ink);font-weight:600}
.savstat{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;width:100%;text-align:left}
.savstat .badge{grid-row:span 2;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;font-weight:700}
.savstat b{font-weight:600}
.savstat small{color:var(--muted);font-size:13px}
.savstat .track{grid-column:1/-1;margin-top:8px}
.badge.ok{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)} .badge.no{background:var(--sunk);color:var(--muted)} .badge.neg{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{font-size:14px;color:var(--muted)}
/* payments */
.alert{display:grid;gap:6px;width:100%;text-align:left;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.alert.late{background:color-mix(in srgb,var(--out) 9%,var(--surface));border-color:color-mix(in srgb,var(--out) 40%,transparent)}
.alert b{font-weight:600}
.alert div{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.alert div span:last-child{color:var(--muted);white-space:nowrap}
.debt{display:grid;gap:10px}
.debt + .debt{margin-top:10px}
.debt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.debt-top b{font-size:16px;font-weight:600}
.debt-top small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.amtbig{font-family:var(--display);font-size:23px;font-weight:700}
.st{flex:none;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.st.paid{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}

<script>
(() => {
const APP_VERSION = '2.5 · 8 Ekim 2026';
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const tl0 = new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}), tl2 = new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',minimumFractionDigits:2,maximumFractionDigits:2});
// Gizli mod: Özet'teki kalan, gelir, gider (ve beklenenler) ile toplam birikim gizlenir (ortak.js)
const gizliMi = () => !!(window.Bocekler && Bocekler.gizli());
const tl = { format: n => (Math.round(n*100)%100 ? tl2 : tl0).format(n) };
const GIZLI = '₺•••';
const tlShort = n => n>=1e6 ? (n/1e6).toLocaleString('tr-TR',{maximumFractionDigits:1})+' Mn' : n>=1e3 ? (n/1e3).toLocaleString('tr-TR',{maximumFractionDigits:1})+' B' : String(Math.round(n));
const pad = n => String(n).padStart(2,'0');
const now = new Date();
const todayYM = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
const todayISO = `${todayYM}-${pad(now.getDate())}`;
const ymAdd = (ym,d) => { let [y,m]=ym.split('-').map(Number); m+=d; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return `${y}-${pad(m)}`; };
const ymLabel = ym => { const [y,m]=ym.split('-').map(Number); return `${AYLAR[m-1]} ${y}`; };
const daysIn = ym => { const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); };
// Para alanı: yazdıkça binlik nokta, kuruş virgülle (1.250.000,50); nokta tuşu virgül sayılır
const fmtIn = v => v===''||v==null ? '' : typeof v==='number' ? v.toLocaleString('tr-TR',{maximumFractionDigits:2}) : String(v);
function formatMoneyInput(el, ev){
  let v = el.value, caret = el.selectionStart == null ? v.length : el.selectionStart;
  const prev = el.dataset.prev == null ? null : el.dataset.prev;
  // Yapıştırma ya da toplu giriş: "1250.50" gibi sonda nokta + 1-2 rakam varsa o nokta kuruş ayracıdır
  if(prev !== null && v.length - prev.length > 1){
    const st0 = caret - (v.length - prev.length), ins = v.slice(st0, caret);
    if(!ins.includes(',') && /\.\d{1,2}$/.test(ins) && !prev.includes(',')){
      const fixed = ins.replace(/\.(?=\d{1,2}$)/, ',');
      v = v.slice(0, st0) + fixed + v.slice(caret);
    }
  }
  const typedDot = caret > 0 && v[caret-1] === '.' && ((ev && ev.data === '.') || (prev !== null && v.length === prev.length + 1 && v.slice(0,caret-1) + v.slice(caret) === prev));
  if(typedDot){
    if(v.replace(/\./g,'').includes(',')){ v = v.slice(0,caret-1) + v.slice(caret); caret--; }
    else v = v.slice(0,caret-1) + ',' + v.slice(caret);
  }
  const sig = v.slice(0,caret).replace(/[^\d,]/g,'').length;
  let raw = v.replace(/[^\d,]/g,'');
  const ci = raw.indexOf(',');
  let int = ci<0 ? raw : raw.slice(0,ci), dec = ci<0 ? null : raw.slice(ci+1).replace(/,/g,'').slice(0,2);
  int = int.replace(/^0+(?=\d)/,'').slice(0, 9);   // en fazla 999.999.999

async function flush(id){

function barGrad(ratio){
  const p = Math.max(0, Math.min(1, (ratio - .5) / .5));
  const end = ratio > 1 ? 'var(--alarm)'
    : p <= .5 ? `color-mix(in oklch, var(--accent), var(--mid) ${Math.round(p*200)}%)`
    : `color-mix(in oklch, var(--mid), var(--alarm) ${Math.round((p-.5)*200)}%)`;
  return p <= .5 ? `linear-gradient(90deg, var(--accent), ${end})` : `linear-gradient(90deg, var(--accent), var(--mid) 60%, ${end})`;
}

function nextIncome(){
  const cand = [...entriesFor(todayYM), ...entriesFor(ymAdd(todayYM,1))].filter(e=>e.t==='in' && e.date>todayISO).sort((a,b)=>a.date.localeCompare(b.date));
  return cand[0] || null;

function safeSpend(){
  const t = totals(todayYM), left = r2(t.inc - t.out);
  const loans = r2(debts().filter(d=>d.kind==='loan' && instNo(d,todayYM) && todayYM>=d.from && !(payOf(d,todayYM)||{}).paid).reduce((a,d)=>a+amtOf(d,todayYM),0));

  const savedNow = savMonthTL(todayYM), tgt = S.settings.savTarget||0;
  const sav = r2(tgt > 0 ? Math.max(tgt, savedNow) : savedNow);
  const todayAll = entriesFor(todayYM).filter(e=>e.t==='out' && e.date===todayISO);
  const todaySpent = r2(todayAll.filter(countsDaily).reduce((a,e)=>a+e.amt,0));
  const todayFixed = r2(todayAll.filter(e=>!countsDaily(e)).reduce((a,e)=>a+e.amt,0));
  const daysLeft = daysIn(todayYM) - now.getDate() + 1;
  const start = r2(left + todaySpent);   // sabit/birikmiş ödemeler düşülmüş kalır, sadece günlük harcamalar geri eklenir
  const pool = r2(start + t.pin - t.pout - loans - iouDue - sav);
  const daily = r2(Math.max(0, pool) / daysLeft);
  return {left, start, pin:t.pin, pout:t.pout, loans, iouDue, sav, savedNow, tgt, todayAll, todaySpent, todayFixed, daysLeft, pool, daily, todayLeft: r2(daily - todaySpent)};
}

}

/* ---------- yedek hatırlatıcısı ---------- */
function recordCount(){ return Object.values(S.months).reduce((a,m)=>a+(m.items||[]).length+(m.sav||[]).length,0) + S.settings.recurring.length; }
function backupBanner(){
  if(recordCount() < 5) return '';
  const snooze = S.settings.backupSnooze; if(snooze && snooze > todayISO) return '';
  const last = S.settings.lastBackup, days = last ? dayDiff(last, todayISO) : null;
  if(days !== null && days < 30) return '';
  return `<div class="card bkp"><div><b>Yedek zamanı</b><small>${days===null ? 'Henüz hiç yedek almadın.' : `Son yedeğin ${days} gün önce.`} Kayıtların sadece bu telefonda duruyor. Kaybolmasın diye yedeği iCloud Drive’a, Google Drive’a ya da WhatsApp’ta kendine gönder.</small></div>
    <div class="btns debtbtns" style="grid-template-columns:1fr 1fr"><button class="btn sm" data-backup="now" style="grid-column:auto">Yedek al</button><button class="btn sm ghost" data-backup="later">Sonra hatırlat</button></div></div>`;
}
function markBackedUp(){ S.settings.lastBackup = todayISO; S.settings.backupSnooze = null; saveSettings(); }

function renderSummary(){
  const {inc,out,byCat,pin,pout} = totals(view.ym);
  const left = inc - out;
  const hasAny = entriesFor(view.ym).length > 0;
  const limited = S.settings.cats.filter(c=>c.t==='out' && c.budget>0);
  const orphan = Object.keys(byCat).filter(id=>!S.settings.cats.some(c=>c.id===id)).map(cat);
  const unlimited = [...S.settings.cats.filter(c=>c.t==='out' && !(c.budget>0) && byCat[c.id]), ...orphan]
    .sort((a,b)=>byCat[b.id]-byCat[a.id]);
  const plain = unlimited.length ? `<div class="plain"><span class="label">Limitsiz</span>${unlimited.map(c=>`<button class="tap" data-catgo="${esc(c.id)}"><span>${ci(c)}${esc(c.name)}</span><span class="num">${tl.format(byCat[c.id])} <span class="chev">›</span></span></button>${subLines(view.ym, c)}`).join('')}</div>` : '';
  const rows = limited.map(c => {
    const spent = byCat[c.id]||0, b = c.budget||0;
    const scale = Math.max(spent, b) || 1;
    const ratio = b ? spent/b : 0;
    const cls = b ? (ratio>1 ? 'over' : ratio>=.8 ? 'near' : '') : '';
    // Tahmin: bu ayın harcama hızıyla limit ayın hangi günü dolar
    let hit = 0; if(view.ym===todayYM && cls!=='over' && spent>0 && now.getDate()>=3){ const perDay = spent/now.getDate(); const day = Math.ceil(b/perDay); if(day <= daysIn(view.ym)) hit = Math.max(day, now.getDate()); }
    const fc = hit ? `${hit} ${AYLAR[+view.ym.slice(5)-1].slice(0,3)} civarı dolar` : '';
    const pill = cls==='over' ? `<span class="pill over">${tl.format(spent-b)} aştı</span>`
      : cls==='near' ? `<span class="pill near">%${Math.round(ratio*100)}${fc ? ' · '+fc : ''}</span>`
      : fc ? `<span class="pill near">${fc}</span>` : '';
    return { spent, html: `<div class="catblock"><button class="barrow tap" data-catgo="${esc(c.id)}">
      <div class="bar-top"><span>${ci(c)}${esc(c.name)}${pill}</span><span class="num">${tl.format(spent)}${b?` / ${tl.format(b)}`:''}</span></div>
      <div class="track"><div class="fill" style="width:${(spent/scale*100).toFixed(1)}%;background:${barGrad(b ? spent/b : 0)}"></div>${b?`<div class="limit" style="left:calc(${(b/scale*100).toFixed(1)}% - 1px)" title="Limit"></div>`:''}</div>
    </button>${subLines(view.ym, c)}</div>`};
  }).sort((a,b)=>b.spent-a.spent).map(r=>r.html).join('');

  return `${alertsHTML()}${backupBanner()}
  <div class="hero">
    <div class="hero-top"><div><div class="label lrow">${ymLabel(view.ym)} · kalan <button class="goz" data-goz="1" aria-label="Tutarları gizle ya da göster">${Bocekler.gozIkon()}</button></div><div class="big num">${gizliMi() ? GIZLI : (left<0?'−':'') + tl.format(Math.abs(left))}</div></div>
      <button class="herobtn tap" data-report="1" aria-label="${ymLabel(view.ym)} raporunu aç"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Rapor</button></div>
    <div class="row">
      <button class="cell tap" data-addtype="in" aria-label="Gelir ekle"><span class="label">Gelir</span><b class="num">${gizliMi() ? GIZLI : tl.format(inc)}</b><span class="plusb" aria-hidden="true">+</span></button>
      <button class="cell tap" data-addtype="out" aria-label="Gider ekle"><span class="label">Gider</span><b class="num">${gizliMi() ? GIZLI : tl.format(out)}</b><span class="plusb" aria-hidden="true">+</span></button>
      ${pin || pout ? `<button class="pend tap" data-goto="liste"><span><span class="label">Beklenen</span>${pin ? `<b>+${gizliMi() ? GIZLI : tl.format(pin)}</b> gelir` : ''}${pin && pout ? ' · ' : ''}${pout ? `<b>−${gizliMi() ? GIZLI : tl.format(pout)}</b> gider` : ''}</span><span>Ay sonu tahmini <b>${gizliMi() ? GIZLI : ((left+pin-pout)<0?'−':'') + tl.format(Math.abs(r2(left+pin-pout)))}</b></span></button>` : ''}
    </div>
  </div>
  ${spendCard()}
  ${(() => { const op = ious().filter(x=>!x.closed && iouLeft(x)>0); if(!op.length) return ''; const al = r2(op.filter(x=>x.dir==='al').reduce((a,x)=>a+iouLeft(x),0)), ver = r2(op.filter(x=>x.dir==='ver').reduce((a,x)=>a+iouLeft(x),0));
     return `<section><button class="card iouline tap" data-goiou="1"><span><span class="label">Alacak / verecek</span><br>${al ? `Alacağın <b style="color:var(--in)">${tl.format(al)}</b>` : ''}${al && ver ? ' · ' : ''}${ver ? `Borcun <b>${tl.format(ver)}</b>` : ''}</span><span class="chev">›</span></button></section>`; })()}
  <section><button class="card reportcard tap" data-report="1"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><b>${ymLabel(view.ym)} raporu</b><span class="chev">›</span><small>Nereye ne gitti, geçen aya göre ne değişti</small></button></section>
  ${savCard(view.ym)}
  ${!hasAny ? `<section><div class="card empty"><b>Bu ay henüz kayıt yok</b>Alttaki <strong>+</strong> düğmesiyle ilk gelirini ya da harcamanı ekle. Maaş, kira gibi her ay tekrarlananları bir kez “her ay tekrarla” diye eklemen yeterli.</div></section>`:''}
  <section>
    <div class="sec-head"><h2>Kategoriler ve bütçe</h2><small>Çizgi = aylık limit</small></div>
    <div class="card">${rows ? `<div class="bars">${rows}</div>` : `<div class="note">Henüz limitli kategori yok. Limit koymak için Ayarlar’a geç.</div>`}${plain}</div>
  </section>
  <section class="trend">
    <div class="sec-head"><h2>${chartMonths().length>1?'Son '+chartMonths().length+' ay':'Bu ay'}</h2><small>Bir aya dokun, o aya geç</small></div>
    <div class="card">${trendSVG()}
      <div class="legend"><span><i style="background:var(--in)"></i>Gelir</span><span><i style="background:var(--out)"></i>Gider</span></div>
    </div>
  </section>`;
}

function firstYM(){
  let f = null; const take = ym => { if(ym && (!f || ym<f)) f = ym; };
  for(const [ym,m] of Object.entries(S.months)) if((m.items||[]).length || (m.sav||[]).length) take(ym);
  for(const r of S.settings.recurring) take(r.from);
  return f;
}
function chartMonths(){
  const f = firstYM(); const out = [];
  let end = view.ym > todayYM ? view.ym : todayYM;
  if(view.ym < ymAdd(end,-5)) end = view.ym;
  for(let i=5;i>=0;i--){ const ym = ymAdd(end,-i); if(!f || ym>=f || ym===view.ym) out.push(ym); }
  return out.length ? out : [view.ym];
}
function trendSVG(){
  const months = chartMonths(), n = months.length;
  const data = months.map(ym=>({ym, ...totals(ym)}));
  const max = Math.max(1000, ...data.flatMap(d=>[d.inc,d.out]));
  const nice = (()=>{ const p=Math.pow(10,Math.floor(Math.log10(max))); for(const k of [1,2,2.5,5,10]) if(k*p>=max) return k*p; return 10*p; })();
  const W=340,H=170,L=38,B=24,T=8, ih=H-B-T, gw=(W-L)/n, bw=Math.min(n<4?22:16,gw/3.2);
  const y = v => T + ih - v/nice*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Aylara göre gelir ve gider grafiği">`;
  for(let i=0;i<=2;i++){ const v=nice*i/2; s+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${tlShort(v)}</text>`; }
  data.forEach((d,i)=>{
    const cx = L + gw*i + gw/2, cur = d.ym===view.ym;
    if(cur) s += `<rect x="${L+gw*i+3}" y="2" width="${gw-6}" height="${H-4}" rx="10" fill="var(--accent-soft)" opacity=".55"/>`;
    s += `<rect x="${cx-bw-1}" y="${y(d.inc)}" width="${bw}" height="${Math.max(0,ih+T-y(d.inc))}" rx="3" fill="var(--in)" opacity="${cur?1:.55}"/>`;
    s += `<rect x="${cx+1}" y="${y(d.out)}" width="${bw}" height="${Math.max(0,ih+T-y(d.out))}" rx="3" fill="var(--out)" opacity="${cur?1:.55}"/>`;
    s += `<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" fill="${cur?'var(--ink)':'var(--muted)'}" font-weight="${cur?600:400}">${AYLAR[+d.ym.slice(5)-1].slice(0,3)}</text>`;
    s += `<rect class="hit" data-pick-month="${d.ym}" x="${L+gw*i}" y="0" width="${gw}" height="${H}" fill="transparent"><title>${ymLabel(d.ym)}</title></rect>`;
  });
  return s + `</svg>`;
}

function savCard(ym){
  const v = savMonthTL(ym), n = savFor(ym).length, tgt = S.settings.savTarget||0;
  const cls = v>0 ? 'ok' : v<0 ? 'neg' : 'no';
  const head = v>0 ? `${tl.format(v)} birikim yapıldı` : v<0 ? `Birikimden ${tl.format(-v)} çekildi` : 'Birikim yapılmadı';
  const sub = tgt ? (v>=tgt ? `Aylık hedef (${tl.format(tgt)}) tamamlandı` : `Hedef ${tl.format(tgt)} · ${tl.format(Math.max(0,tgt-v))} kaldı`)
                  : (n ? 'Ayrıntılar Birikim sekmesinde' : 'Altın, döviz ya da TL birikimini Birikim sekmesinden ekle');
  const bar = tgt ? `<div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,v/tgt*100)).toFixed(1)}%;background:linear-gradient(90deg, var(--accent), color-mix(in oklch, var(--accent), var(--surface) 35%))"></div></div>` : '';
  return `<section><div class="sec-head"><h2>${ymLabel(ym)} birikimi</h2></div>
    <button class="card savstat" data-goto="birikim"><span class="badge ${cls}">${v>0?'✓':v<0?'↓':'–'}</span><b class="num">${head}</b><small>${sub}</small>${bar}</button></section>`;
}

/* ---------- birikim hedefleri ---------- */
const goals = () => S.settings.goals || (S.settings.goals = []);
function goalSaved(g){ let v = 0; for(const m of Object.values(S.months)) for(const x of (m.sav||[])) if(x.goal===g.id) v += x.dir * x.qty * (rate(x.asset) || x.rate); return r2(v); }
function goalCard(g){
  const saved = goalSaved(g), p = g.target ? Math.max(0, Math.min(1, saved/g.target)) : 0, rest = r2(Math.max(0, g.target - saved));
  const months = g.month ? ymDiff(todayYM, g.month) + 1 : 0;
  const tip = rest <= 0 ? '<b>Hedefe ulaşıldı.</b>' : !g.month ? `Kalan ${tl.format(rest)}` : months > 0 ? `Kalan ${tl.format(rest)} · ${ymLabel(g.month)} için ayda <b>${tl.format(Math.ceil(rest/months))}</b> ayırman yeterli` : `Hedef tarihi geçti · ${tl.format(rest)} eksik`;
  return `<button class="card goal tap" data-goal="${esc(g.id)}"><div class="goal-top"><b>${esc(g.name)}</b><span class="note">${g.month ? ymLabel(g.month) : ''}</span></div>
    <div class="track"><div class="fill" style="width:${(p*100).toFixed(1)}%;background:linear-gradient(90deg,var(--accent),var(--in))"></div></div>
    <div class="goal-row"><span class="num"><b>${tl.format(saved)}</b> / ${tl.format(g.target)}</span><span class="note num">%${Math.round(p*100)}</span></div>
    <small>${tip}</small></button>`;
}

    sheetRoot.innerHTML = `<div class="scrim" data-close></div>

      <button class="btn" id="gSave">${editing?'Kaydet':'Hedefi ekle'}</button>
      ${editing ? `<button class="btn ghost" id="gAdd">Bu hedefe birikim ekle</button><button class="btn ghost" id="gDel" style="color:var(--out)">Hedefi sil</button>` : ''}
    </div></div>`;
    sheetRoot.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheetAnimated);
    document.getElementById('gSave').onclick = () => {

      if(!name) return toast('Hedefe bir ad ver.'); if(!target) return toast('Hedef tutarını yaz.');
      if(month && month < todayYM && (!editing || month !== g.month)) return toast('Hedef tarihi geçmiş bir ay olamaz.');
      if(editing) Object.assign(g, {name, target, month}); else goals().push({id:uid(), name, target, month});
      saveSettings(); closeSheet(); render(); toast(editing ? 'Hedef güncellendi' : 'Hedef eklendi');
    };
    const ga = document.getElementById('gAdd'); if(ga) ga.onclick = () => openSavSheet(null, 'TRY', g.id);
    const gd = document.getElementById('gDel'); if(gd) gd.onclick = () => { if(!gd.dataset.armed){ gd.dataset.armed=1; gd.textContent='Silmek için tekrar dokun (birikimler silinmez)'; return; }
      S.settings.goals = goals().filter(x=>x.id!==g.id); saveSettings(); closeSheet(); render(); toast('Hedef silindi'); };
  };
  draw();
}
function renderSavings(){
  const h = holdings(), r = S.rates;
  const total = ASSETS.reduce((a,x)=>a+(h[x.id]||0)*rate(x.id), 0);
  const missing = ASSETS.some(x=>h[x.id] && !rate(x.id));
  const months = chartMonths();
  const list = savFor(view.ym).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const tgt = S.settings.savTarget||0;
  return `
  <div class="hero">
    <div><div class="label lrow">Toplam birikim · bugünkü kurla <button class="goz" data-goz="1" aria-label="Tutarları gizle ya da göster">${Bocekler.gozIkon()}</button></div><div class="big num">${gizliMi() ? GIZLI : tl.format(total)}</div></div>

    <div class="btns" style="margin-top:10px"><button class="btn ghost" data-addgoal="1" style="flex:1">+ Hedef ekle</button></div>
  </section>
  <section>

function bindSavings(){
  document.getElementById('addSav').onclick = () => openSavSheet(null);
  document.getElementById('refreshRates').onclick = () => fetchRates(true);
  main.querySelectorAll('[data-rate]').forEach(inp => inp.addEventListener('change', () => {
    const v = parseAmt(inp.value); if(!v){ toast('Geçerli bir kur yaz.'); return; }
    S.rates = {...S.rates, [inp.dataset.rate]: v, at: new Date().toISOString()}; saveLocal(); render(); toast('Kur kaydedildi');
  }));
  document.getElementById('savTarget').addEventListener('change', e => {
    const raw = e.target.value.trim(); const v = raw==='' || raw==='0' ? 0 : parseAmt(raw);
    if(v===null){ toast('Geçerli bir tutar yaz.'); return; }
    S.settings.savTarget = v; saveSettings(); render(); toast(v ? 'Hedef kaydedildi' : 'Hedef kaldırıldı');
  });
}

function openSavSheet(entry, preset, goalId){
  const editing = !!entry;
  const st = entry ? {...entry, old: !!entry.old} : { dir:1, asset:preset||'GRA', qty:'', rate: rate(preset||'GRA')||'', date: view.ym===todayYM ? todayISO : `${view.ym}-01`, note:'', goal: goalId||null, old: !Object.values(S.months).some(m=>(m.sav||[]).length) };
  const draw = () => {
    const a = asset(st.asset);
    sheetRoot.innerHTML = `<div class="scrim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Birikim"><div class="in">
      <div class="grab"></div>
      <div class="sec-head" style="margin:0"><h2>${editing?'Birikimi düzenle':'Birikim ekle'}</h2><button class="icon-btn" data-close>Kapat</button></div>
      <div class="seg" role="group" aria-label="Yön">
        <button data-dir="1" aria-pressed="${st.dir>0}">Biriktirdim</button>
        <button data-dir="-1" aria-pressed="${st.dir<0}">Bozdurdum / çektim</button>
      </div>
      <div class="field"><span class="label">Ne?</span><div class="chips">
        ${ASSETS.map(x=>`<button class="chip" data-asset="${x.id}" aria-pressed="${x.id===st.asset}">${x.name}</button>`).join('')}
      </div></div>
      <div class="field"><label class="label" for="sQty">Miktar (${a.unit})</label>
        <input class="amount-in num" id="sQty" inputmode="decimal" data-money autocomplete="off" placeholder="0" value="${st.qty!==''?fmtIn(st.qty):''}" autocomplete="off"></div>
      ${a.id==='TRY' ? '' : `<div class="field"><label class="label" for="sRate">Birim fiyat (₺)</label>
        <input class="num" id="sRate" inputmode="decimal" data-money autocomplete="off" value="${st.rate!==''?fmtIn(st.rate):''}" placeholder="Örn. ${a.id==='GRA'?'6.500':'49,20'}">
        <span class="note">Güncel kur otomatik gelir. Farklı fiyattan aldıysan onu yaz.</span></div>`}
      <div class="calc num" id="sCalc"></div>
      ${goals().length ? `<div class="field"><span class="label">Hedef (isteğe bağlı)</span><div class="chips">${goals().map(g=>`<button class="chip" data-gp="${esc(g.id)}" aria-pressed="${st.goal===g.id}">${esc(g.name)}</button>`).join('')}</div></div>` : ''}
      <div class="two">
        <div class="field"><label class="label" for="sDate">Tarih</label><input type="date" id="sDate" value="${st.date}"></div>
        <div class="field"><label class="label" for="sNote">Not</label><input id="sNote" maxlength="60" placeholder="İsteğe bağlı" value="${esc(st.note||'')}"></div>
      </div>
      ${st.dir>0 ? `<label class="field" style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input id="sOld" type="checkbox" style="width:22px;height:22px;margin-top:2px;flex:none" ${st.old?'checked':''}><span><b>Önceden birikmiş (elimde olan)</b><br><small class="note">İşaretlersen toplam birikime eklenir ama bu ayın gelirinden ayrılmış sayılmaz; günlük harcama hakkından düşmez. Bu ay maaştan ayırdığın parayı eklerken işareti kaldır.</small></span></label>` : ''}
      <button class="btn" id="sSave">${editing?'Değişiklikleri kaydet':'Kaydet'}</button>
      ${editing?'<button class="btn ghost" id="sDel" style="color:var(--out)">Sil</button>':''}
    </div></div>`;
    const keep = () => { st.qty=document.getElementById('sQty').value; const r=document.getElementById('sRate'); if(r) st.rate=r.value; st.date=document.getElementById('sDate').value; st.note=document.getElementById('sNote').value; const so=document.getElementById('sOld'); if(so) st.old=so.checked; };
    const calc = () => { keep(); const q=parseAmt(st.qty), r = st.asset==='TRY'?1:parseAmt(st.rate); document.getElementById('sCalc').textContent = q&&r&&st.asset!=='TRY' ? `Karşılığı ≈ ${tl.format(q*r)}` : ''; };
    sheetRoot.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheetAnimated);
    sheetRoot.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{ keep(); st.dir=+b.dataset.dir; draw(); });
    sheetRoot.querySelectorAll('[data-gp]').forEach(b=>b.onclick=()=>{ keep(); st.goal = st.goal===b.dataset.gp ? null : b.dataset.gp; draw(); });
    sheetRoot.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>{ keep(); if(st.asset!==b.dataset.asset){ st.asset=b.dataset.asset; st.rate=rate(st.asset)||''; } draw(); });
    ['sQty','sRate'].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', calc); });
    calc();
    document.getElementById('sSave').onclick = () => {
      keep();
      const qty = parseAmt(st.qty); const r = st.asset==='TRY' ? 1 : parseAmt(st.rate);

      if(!r) return toast('Birim fiyatı yaz.');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(st.date)) return toast('Tarihi seç.');
      if(st.asset==='CEYREK' && qty % 1) return toast('Çeyrek altın adedi tam sayı olmalı.');
      if(st.dir < 0){ const have = r2((holdings()[st.asset]||0) - (editing && entry.asset===st.asset ? entry.dir*entry.qty : 0));
        if(qty > have + 1e-9) return toast(have > 0 ? `Elinde ${qtyFmt(st.asset, have)} var, daha fazlasını bozduramazsın.` : `Elinde ${asset(st.asset).name} yok. Önce birikim olarak ekle.`); }
      const ym = st.date.slice(0,7);
      if(editing){ const om=monthDoc(entry.date.slice(0,7)); om.sav=om.sav.filter(x=>x.id!==entry.id); saveMonth(entry.date.slice(0,7)); }
      monthDoc(ym).sav.push({id: editing?entry.id:uid(), dir:st.dir, asset:st.asset, qty, rate:r, date:st.date, note:st.note.trim(), goal: st.goal||null, ...(st.dir>0 && st.old ? {old:true} : {})});
      saveMonth(ym); view.ym=ym; closeSheet(); render(); toast(editing?'Güncellendi':'Birikim kaydedildi');
    };
    const del = document.getElementById('sDel');
    if(del) del.onclick = () => { if(!del.dataset.armed){ del.dataset.armed=1; del.textContent='Silmek için tekrar dokun'; return; }
      const ym=entry.date.slice(0,7), m=monthDoc(ym); m.sav=m.sav.filter(x=>x.id!==entry.id); saveMonth(ym); closeSheet(); render(); toast('Silindi'); };
  };
  draw();
  if(!editing) setTimeout(()=>document.getElementById('sQty')?.focus(), 60);
}

function renderList(){
  let list = view.cat ? entriesFor(view.ym).filter(e=>e.cat===view.cat) : entriesFor(view.ym);
  if(view.cat && view.sub) list = list.filter(e => view.sub==='_' ? !(e.sub && subName(e.cat,e.sub)) : e.sub===view.sub);
  const outBy = {}, inBy = {};
  list.forEach(e => { const o = e.t==='in' ? inBy : outBy; o[e.date] = (o[e.date]||0) + e.amt; });
  const dim = daysIn(view.ym), [y,m] = view.ym.split('-').map(Number);
  const lead = (new Date(y,m-1,1).getDay()+6)%7;
  const max = Math.max(1, ...Object.values(outBy));
  let cells = ['Pt','Sa','Ça','Pe','Cu','Ct','Pz'].map(w=>`<span class="wd">${w}</span>`).join('') + '<span></span>'.repeat(lead);
  for(let d=1; d<=dim; d++){
    const iso = `${view.ym}-${pad(d)}`, v = outBy[iso]||0, sel = view.day===iso;
    const cls = [iso>todayISO?'fut':'', iso===todayISO?'today':''].join(' ').trim();
    const bg = !sel && v ? ` style="background:color-mix(in srgb,var(--out) ${Math.round(12+38*v/max)}%,var(--sunk))"` : '';
    cells += `<button class="${cls}" data-day="${iso}" aria-pressed="${sel}"${bg} aria-label="${d} ${AYLAR[m-1]}, ${v?tl.format(v)+' harcama':'harcama yok'}">${d}<small>${v?tlShort(v):''}</small></button>`;
  }
  const spent = Object.entries(outBy).filter(([d])=>d<=todayISO).reduce((a,[,b])=>a+b,0);
  const elapsed = view.ym<todayYM ? dim : view.ym===todayYM ? now.getDate() : 0;
  const top = Object.entries(outBy).filter(([d])=>d<=todayISO).sort((a,b)=>b[1]-a[1])[0];
  const stats = (elapsed && spent) || top ? `<div class="daystats">${elapsed&&spent?`<span>Günlük ortalama <b class="num">${tl.format(Math.round(spent/elapsed))}</b></span>`:''}${top?`<span>En çok harcanan gün <b>${dayLabel(top[0],{day:'numeric',month:'long'})}</b> <span class="num">(${tl.format(top[1])})</span></span>`:''}</div>` : '';
  const catChip = view.cat ? `<div style="margin-top:12px"><button class="chip filterchip" data-catgo="" aria-pressed="true">${esc(cat(view.cat).name)}${view.sub ? ' › '+(view.sub==='_' ? 'Alt başlıksız' : esc(subName(view.cat,view.sub))) : ''} <span aria-hidden="true">✕</span></button> <span class="note">sadece bunlar gösteriliyor</span></div>` : '';
  const head = view.day
    ? `<div class="sec-head" style="margin:18px 0 10px"><h2>${dayLabel(view.day)}</h2><button class="chip" data-day="">Tüm ay</button></div>`
    : `<div class="sec-head" style="margin:18px 0 10px"><h2>Tüm hareketler</h2><small>Bir güne dokun, sadece onu gör</small></div>`;
  const shown = view.day ? list.filter(e=>e.date===view.day) : list;
  let body;
  if(!list.length) body = `<div class="card empty"><b>${ymLabel(view.ym)} için kayıt yok</b>Alttaki <strong>+</strong> ile ekleyebilirsin.</div>`;
  else if(!shown.length) body = `<div class="card empty"><b>Bu gün kayıt yok</b>Başka bir güne dokun ya da “Tüm ay”a dön.</div>`;
  else {
    const groups = {};
    shown.forEach(e => (groups[e.date] ||= []).push(e));
    body = Object.entries(groups).map(([d,es]) => `
    <div class="day"><h3><span>${d===todayISO?'Bugün · ':''}${dayLabel(d)}</span><span class="num">${outBy[d]?'−'+tl.format(outBy[d]):''}${inBy[d]?(outBy[d]?' · ':'')+'+'+tl.format(inBy[d]):''}</span></h3><div class="items">
    ${es.map(e => { const c=cat(e.cat); return `<button class="item${isPending(e)?' pending':''}" data-edit="${esc(e.id)}">
      ${catDot(c)}
      <span class="mid"><b>${esc(e.note || subName(e.cat,e.sub) || c.name)}</b><small>${esc(c.name)}${subName(e.cat,e.sub) ? ' › '+esc(subName(e.cat,e.sub)) : ''}${e.pay && cardById(e.pay) ? ' · '+esc(cardById(e.pay).name) : ''}${e.instNo ? ` · <b>${e.instNo}/${e.inst} taksit</b> (${tl.format(e.total)})` : ''}${e.rec?'<span class="rec">↻ her ay</span>':''}${isPending(e) ? `<span class="pendtag">${e.t==='in'?'Bekleniyor':'Planlandı'}</span>` : ''}</small></span>
      <span class="amt num ${e.t}">${e.t==='in'?'+':'−'}${tl.format(e.amt)}</span></button>`; }).join('')}
    </div></div>`).join('');
  }
  return `<div class="card"><div class="cal">${cells}</div>${stats}${catChip}</div>${head}${body}`;
}

];
// Bankanın kendi adı önce, sonra en uzun eşleşen kart programı (ör. "VakıfBank Worldcard" → VakıfBank, "World" → Yapı Kredi)
function guessBank(name){ const raw = name||'', n = ' '+raw.toLocaleLowerCase('tr')+' | '+raw.toLowerCase()+' '; let best = null, sc = 0;
  for(const b of BANKS) b.k.forEach((k,i) => { const v = k.trim().length + (i===0 ? 100 : 0); if(n.includes(k) && v > sc){ best = b; sc = v; } });   // ilk anahtar bankanın kendi adı: kart programından önce gelir
  return best; }
const bankOf = d => BANKS.find(b => b.id === d.bank) || (d.bank === '' ? null : guessBank(d.name));
function bankBadge(d){
  if(d.logo) return `<span class="bbadge"><img src="${d.logo}" alt=""></span>`;
  const b = bankOf(d);
  return b ? `<span class="bbadge" style="background:${b.c};color:${b.fg||'#fff'};font-size:${b.t.length>2?12:b.t.length>1?14:18}px" aria-hidden="true">${b.t}</span>`
           : `<span class="bbadge" style="background:var(--accent);color:var(--accent-ink)" aria-hidden="true">${esc((d.name||'?').charAt(0).toLocaleUpperCase('tr'))}</span>`;
}
let openDebts; try { openDebts = new Set(JSON.parse(localStorage.getItem('acik-kartlar') || '[]')); } catch(e){ openDebts = new Set(); }
const isOpen = d => openDebts.has(d.id);
const debtHead = (d, sub, st, amt) => `<button class="debthead" data-dtgl="${esc(d.id)}" aria-expanded="${isOpen(d)}">${bankBadge(d)}<span class="dh-mid"><b>${esc(d.name)}</b><small>${sub}</small></span><span class="dh-r">${amt ? `<b>${amt}</b>` : ''}<span class="st ${st.cls}">${st.txt}</span></span><span class="chev dh-chev" aria-hidden="true">›</span></button>`;

/* ---------- kredi kartları ve krediler ---------- */
const debts = () => S.settings.debts || (S.settings.debts = []);
const ymDiff = (a,b) => { const [y1,m1]=a.split('-').map(Number), [y2,m2]=b.split('-').map(Number); return (y2-y1)*12+(m2-m1); };
const dayDiff = (a,b) => Math.round((new Date(b+'T12:00') - new Date(a+'T12:00'))/864e5);
const isoAdd = (iso,n) => { const d=new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
function instNo(d, ym){ if(d.kind!=='loan') return ym >= d.from ? 1 : 0; const i = ymDiff(d.start, ym); return i>=0 && i<d.count ? i+1 : 0; }
const dueOf = (d, ym) => `${ym}-${pad(Math.min(d.dueDay, daysIn(ym)))}`;
const payOf = (d, ym) => ((S.months[ym]||{}).pay||{})[d.id] || null;
const cards = () => debts().filter(d=>d.kind==='card');
const cardById = id => id ? debts().find(d=>d.id===id && d.kind==='card') : null;
const cutDayOf = d => d.cutDay || (d.dueDay > 10 ? d.dueDay - 10 : d.dueDay + 18);
// Ekstre: (önceki kesim, bu kesim] arasındaki harcama/taksitler + önceki aydan devreden borç
function cutISO(d, ym){ const cd = cutDayOf(d), cm = cd < d.dueDay ? ym : ymAdd(ym,-1); return `${cm}-${pad(Math.min(cd, daysIn(cm)))}`; }
let _cc = {ver:-1, ch:{}, st:{}};
const ccache = () => { if(_cc.ver !== dataVer) _cc = {ver:dataVer, ch:{}, st:{}}; return _cc; };
function cardCharges(d){
  const c = ccache(); if(c.ch[d.id]) return c.ch[d.id];
  const out = [];
  for(const m of Object.values(S.months)) for(const it of (m.items||[])) if(it.t==='out' && it.pay===d.id){
    const n = it.inst||1; for(let k=1;k<=n;k++) out.push({date:isoAddMonths(it.date,k-1), amt:instPart(it,k), it, k, n});
  }
  const horizon = ymAdd(todayYM, 13);
  for(const r of S.settings.recurring) if(r.t==='out' && r.pay===d.id)
    for(let ym=r.from; ym<=horizon && (!r.until || ym<=r.until); ym=ymAdd(ym,1)){
      if(((S.months[ym]||{}).skip||[]).includes(r.id)) continue;
      out.push({date:`${ym}-${pad(Math.min(r.day,daysIn(ym)))}`, amt:r.amt, it:{note:r.note, cat:r.cat, sub:r.sub, rec:true}, k:1, n:1});
    }
  out.sort((a,b)=>a.date.localeCompare(b.date));
  return c.ch[d.id] = out;
}
function cardRec(d, ym){ const p = payOf(d, ym) || {};

function ensureCat(id, name){ if(!S.settings.cats.some(c=>c.id===id)){ S.settings.cats.push({id, name, t:'out', budget:0}); saveSettings(); } return id; }
function markPaid(d, ym, amt, addExp, date){
  date = /^\d{4}-\d{2}-\d{2}$/.test(date||'') ? date : defPayDate(d, ym);
  const m = monthDoc(ym); let exp = null;
  if(m.pay[d.id] && m.pay[d.id].exp) removeItemById(m.pay[d.id].exp);
  if(addExp){
    const catId = d.kind==='loan' ? ensureCat('kredi','Kredi ödemesi') : ensureCat('kartodeme','Kart ödemesi');

    monthDoc(date.slice(0,7)).items.push({id:exp, t:'out', amt, cat:catId, date, note:`${d.name} ${d.kind==='loan'?'taksidi':'ödemesi'}`});
    saveMonth(date.slice(0,7));
  }
  m.pay[d.id] = {amt, paid:true, paidOn:date, exp};
  saveMonth(ym);
}
function unpay(d, ym){

    const dl = document.getElementById('dLogoDel'); if(dl) dl.onclick = () => { keep(); st.logo = null; draw(); };
    document.getElementById('dLogo').addEventListener('change', e => {
      const f = e.target.files[0]; if(!f) return; keep();
      const img = new Image(), url = URL.createObjectURL(f);
      img.onload = () => { const S2 = 160, c = document.createElement('canvas'); c.width = c.height = S2; const x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0,0,S2,S2); const k = Math.min(S2/img.width, S2/img.height); const w = img.width*k, h = img.height*k;
        x.drawImage(img, (S2-w)/2, (S2-h)/2, w, h); URL.revokeObjectURL(url); st.logo = c.toDataURL('image/jpeg', .9); draw(); };
      img.onerror = () => toast('Bu görsel açılamadı.'); img.src = url; });

      if(!(day>=1 && day<=31)) return toast('Son ödeme günü 1 ile 31 arasında olmalı.');
      const rec = {kind:st.kind, name, dueDay:day, remind:st.remind||3, bank: st.bank || '', logo: st.logo || null};
      if(st.kind==='card'){
        const cut = String(st.cutDay||'').trim()==='' ? null : parseInt(st.cutDay,10);
        if(cut!==null && !(cut>=1 && cut<=31)) return toast('Kesim günü 1 ile 31 arasında olmalı.');
        const lim = String(st.limit||'').trim()==='' ? 0 : parseAmt(st.limit);
        if(lim===null) return toast('Limiti kontrol et.');
        Object.assign(rec, {cutDay:cut, minRate:st.minRate||0.2, limit:lim||0});
      }
      if(st.kind==='loan'){
        const amt = parseAmt(st.amt), count = parseInt(st.count,10);
        if(!amt) return toast('Aylık taksiti yaz.');
        if(!(count>=1)) return toast('Taksit sayısını yaz.');
        if(count > 360) return toast('Taksit sayısı en fazla 360 olabilir.');
        if(!/^\d{4}-\d{2}$/.test(st.start)) return toast('İlk taksit ayını seç.');
        Object.assign(rec, {amt, count, start:st.start});
      }
      if(editing) Object.assign(d, rec);
      else {
        const nd = {id:uid(), from:todayYM, ...rec}; debts().push(nd);
        if(nd.kind==='card'){ const stv = String(st.stmt||'').trim() ? parseAmt(st.stmt) : null, bal = String(st.bal||'').trim() ? parseAmt(st.bal) : null;
          if(stv || bal){ const ym = dayDiff(todayISO, dueOf(nd, todayYM)) >= 0 ? todayYM : ymAdd(todayYM,1);
            monthDoc(ym).pay[nd.id] = {stmt: stv || 0, min: null, bal: bal || null, balOn: bal ? todayISO : null, paidAmt: 0}; saveMonth(ym); } }
      }
      saveSettings(); closeSheet(); render(); toast(editing?'Kaydedildi':`${name} eklendi`);
    };
    const del = document.getElementById('dDel');
    if(del) del.onclick = () => { if(!del.dataset.armed){ del.dataset.armed=1; del.textContent='Silmek için tekrar dokun'; return; }
      S.settings.debts = debts().filter(x=>x.id!==d.id); saveSettings(); closeSheet(); render(); toast('Silindi'); };
  };
  draw();
}

/* takvim (.ics) hatırlatıcısı */
function icsText(d){
  let ym = todayYM;
  if(dayDiff(todayISO, dueOf(d, ym)) < 0 || settled(d, ym)) ym = ymAdd(ym, 1);
  const byDay = d.dueDay > 28 ? `BYMONTHDAY=${Array.from({length:d.dueDay-27},(_,i)=>28+i).join(',')};BYSETPOS=-1` : `BYMONTHDAY=${d.dueDay}`;
  let rule = `FREQ=MONTHLY;${byDay}`;
  if(d.kind==='loan'){
    if(ym < d.start) ym = d.start;
    const rem = d.count - ymDiff(d.start, ym);
    if(rem <= 0) return null;
    rule += `;COUNT=${rem}`;
  }
  const dt = dueOf(d, ym).replace(/-/g,'');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const r = d.remind || 3;
  const t = v => String(v).replace(/[\\,;]/g, m => '\\' + m);
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Bocekler Cuzdan//TR','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT', `UID:${d.id}-${dt}@bocekler-cuzdan`, `DTSTAMP:${stamp}`, `DTSTART:${dt}T100000`, `DTEND:${dt}T103000`, `RRULE:${rule}`,
    `SUMMARY:${t(d.name+' son ödeme günü')}`, `DESCRIPTION:${t('Böcekler Cüzdan hatırlatıcısı. Ödeyince uygulamada Ödendi olarak işaretle.')}`,
    'BEGIN:VALARM','ACTION:DISPLAY', `DESCRIPTION:${t(d.name+': son ödemeye '+r+' gün kaldı')}`, `TRIGGER:-P${r}D`, 'END:VALARM',
    'BEGIN:VALARM','ACTION:DISPLAY', `DESCRIPTION:${t(d.name+': son ödeme günü bugün')}`, 'TRIGGER:PT0M', 'END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function addToCalendar(d){
  const text = icsText(d); if(!text) return toast('Bu kredinin kalan taksiti yok.');
  const file = 'bocekler-' + (d.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'odeme') + '.ics';
  if(navigator.serviceWorker && navigator.serviceWorker.controller){
    location.href = `./takvim.ics?n=${encodeURIComponent(file)}&d=${encodeURIComponent(text)}`;
  } else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:'text/calendar'})); a.download = file;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  toast('Takvim açılıyor, “Ekle”ye dokun');
}

/* Android bildirimleri: hatırlatma listesi IndexedDB'de tutulur, servis çalışanı günde bir kontrol eder */
function idb(){ return new Promise((res,rej)=>{ const r = indexedDB.open('bocekler',1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(k,v){ const db = await idb(); return new Promise(res=>{ const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete = () => res(); tx.onerror = () => res(); }); }
async function writeReminders(){
  try {
    const list = [];
    for(const ym of [ymAdd(todayYM,-1), todayYM, ymAdd(todayYM,1), ymAdd(todayYM,2)])
      for(const d of debts()){
        if(!instNo(d,ym) || ym < d.from || settled(d,ym)) continue;
        const v = amtOf(d,ym);
        list.push({key:d.id+'@'+ym, name:d.name, due:dueOf(d,ym), from:isoAdd(dueOf(d,ym), -(d.remind||3)), amt: v ? tl.format(v) : ''});
      }
    await idbSet('reminders', list);
  } catch(e){}
}
async function enableNotifications(){
  if(!notifOK()) return toast('Bu tarayıcı bildirim desteklemiyor.');
  const p = await Notification.requestPermission();
  if(p !== 'granted'){ render(); return toast('İzin verilmedi. Telefon ayarlarından açabilirsin.'); }
  const reg = await navigator.serviceWorker.ready;
  try { if('periodicSync' in reg) await reg.periodicSync.register('odeme-kontrol', {minInterval: 12*3600e3}); } catch(e){}
  await writeReminders();
  try { await reg.showNotification('Böcekler Cüzdan', {body:'Bildirimler açık. Yaklaşan ödemelerde haber vereceğim.', icon:'icon-192.png'}); } catch(e){}
  render();
}

/* ---------- aylık rapor ---------- */
function reportData(ym){
  const cur = totals(ym), pym = ymAdd(ym,-1), prev = totals(pym);
  const outs = entriesFor(ym).filter(e=>e.t==='out' && !isPending(e));
  const fixed = outs.filter(e=>e.rec).reduce((a,e)=>a+e.amt,0);
  const top = [...outs].sort((a,b)=>b.amt-a.amt).slice(0,5);
  const cats = Object.entries(cur.byCat).sort((a,b)=>b[1]-a[1]).map(([id,v])=>({c:cat(id), v, p: cur.out ? v/cur.out : 0, prev: prev.byCat[id]||0}));
  const limited = S.settings.cats.filter(c=>c.t==='out' && c.budget>0);
  const over = limited.filter(c=>(cur.byCat[c.id]||0) > c.budget);
  const dim = daysIn(ym), elapsed = ym<todayYM ? dim : ym===todayYM ? now.getDate() : 0;
  const byDay = {}; outs.forEach(e=>{ byDay[e.date]=(byDay[e.date]||0)+e.amt; });
  const peak = Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
  const act = debts().filter(d=>instNo(d,ym));
  const dTot = act.reduce((a,d)=>a+amtOf(d,ym),0), dPaid = act.reduce((a,d)=>a+paidAmtOf(d,ym),0);
  const prevHas = entriesFor(pym).length > 0;
  return {ym, pym, cur, prev, prevHas, fixed, top, cats, limited, over, elapsed, peak, sav: savMonthTL(ym), dTot, dPaid, left: cur.inc-cur.out};
}
const chg = (a, b) => b ? (a-b)/b : null;
const pctTxt = p => '%' + Math.abs(Math.round(p*100)).toLocaleString('tr-TR');
function reportText(r){
  const L = [`Böcekler Cüzdan · ${ymLabel(r.ym)} raporu`, ''];
  L.push(`Gelir: ${tl.format(r.cur.inc)}`);
  const ch = r.prevHas ? chg(r.cur.out, r.prev.out) : null;
  L.push(`Gider: ${tl.format(r.cur.out)}${ch!==null ? ` (geçen aya göre ${pctTxt(ch)} ${ch>=0?'fazla':'az'})` : ''}`);
  L.push(`Kalan: ${tl.format(r.left)}${r.cur.inc ? ` (tasarruf oranı ${pctTxt(Math.max(0,r.left)/r.cur.inc)})` : ''}`);
  if(r.sav) L.push(`Birikim: ${tl.format(r.sav)}`);
  if(r.cats.length){ L.push('', 'Paranın gittiği yer:'); r.cats.slice(0,6).forEach(x=>L.push(`• ${x.c.name}: ${tl.format(x.v)} (${pctTxt(x.p)})`)); }
  if(r.limited.length) L.push('', `Bütçe: ${r.limited.length} limitten ${r.limited.length - r.over.length} tanesi tutuldu${r.over.length ? ' · aşılan: '+r.over.map(c=>c.name).join(', ') : ''}`);
  return L.join('\n');
}

function openCatSheet(c){
  const editing = !!c;
  const st = c ? {name:c.name, t:c.t, budget:c.budget||'', subs:(c.subs||[]).map(x=>({...x})), icon:catIcon(c), color:catColor(c), daily:catDaily(c)} : {name:'', t:'out', budget:'', subs:[], icon:'📦', color:CAT_COLORS[6], daily:true};
  const SUGGEST = {abonelik:['Netflix','Spotify','YouTube Premium','iCloud','Disney+','Amazon Prime','Exxen','BluTV','ChatGPT','Telefon hattı','İnternet','Spor salonu'],
    fatura:['Elektrik','Su','Doğalgaz','İnternet','Telefon','Aidat'], ulasim:['Yakıt','İstanbulkart','Taksi','Otopark','Araç bakım'],
    market:['Migros','A101','BİM','Şok','CarrefourSA'], yemek:['Kahve','Restoran','Yemek siparişi'], saglik:['İlaç','Muayene','Diş'], maas:['Ana maaş','Prim','İkramiye']};
  const uses = () => {
    let n = 0; for(const m of Object.values(S.months)) n += (m.items||[]).filter(i=>i.cat===c.id).length;
    return n + S.settings.recurring.filter(r=>r.cat===c.id).length;
  };
  const draw = () => {
    sheetRoot.innerHTML = `<div class="scrim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Kategori"><div class="in">
      <div class="grab"></div>
      <div class="sec-head" style="margin:0"><h2 class="cathead">${catDot({icon:st.icon, color:st.color, id:'_'})}${editing?'Kategoriyi düzenle':'Yeni kategori'}</h2><button class="icon-btn" data-close>Kapat</button></div>
      ${editing ? '' : `<div class="seg" role="group" aria-label="Tür"><button data-ct="out" aria-pressed="${st.t==='out'}">Gider</button><button data-ct="in" aria-pressed="${st.t==='in'}">Gelir</button></div>`}
      <div class="field"><span class="label">Simge</span><div class="icongrid">${CAT_ICONS.map(i=>`<button class="ico" data-ico="${i}" aria-pressed="${i===st.icon}" aria-label="Simge ${i}">${i}</button>`).join('')}</div></div>
      <div class="field"><span class="label">Renk</span><div class="colorrow">${CAT_COLORS.map(cc=>`<button class="cc" data-cc="${cc}" aria-pressed="${cc===st.color}" style="background:${cc}" aria-label="Renk ${cc}"></button>`).join('')}</div></div>
      <div class="field"><label class="label" for="cName">Adı</label><input id="cName" maxlength="30" placeholder="${st.t==='out'?'Örn. Evcil hayvan':'Örn. Kira geliri'}" value="${esc(st.name)}"></div>
      ${st.t==='out' ? `<div class="field"><label class="label" for="cBudget">Aylık limit (₺)</label><input id="cBudget" class="num" inputmode="decimal" data-money autocomplete="off" placeholder="Boş bırakırsan limit yok" value="${fmtIn(st.budget)}"></div>` : ''}
      ${st.t==='out' ? `<label class="check"><input type="checkbox" id="cDaily" ${st.daily?'checked':''}> <span>Günlük harcama hakkına dahil<br><span class="note" style="font-size:12px">Kira, fatura gibi sabit giderlerde kapat; bunlar ayın kalanından düşülür.</span></span></label>` : ''}
      <div class="field"><span class="label">Alt başlıklar</span>
        ${st.subs.length ? `<div class="sublist">${st.subs.map((x,i)=>`<div class="subrow"><input data-subname="${i}" maxlength="30" value="${esc(x.name)}" placeholder="Alt başlık adı" aria-label="Alt başlık ${i+1}"><button class="icon-btn danger" data-subdel="${i}" aria-label="${esc(x.name)} alt başlığını sil">✕</button></div>`).join('')}</div>` : `<div class="note">Örneğin Abonelikler altında Netflix, Spotify. Kayıt eklerken seçersin, Özet’te hepsi bu başlığın altında toplanır.</div>`}
        <button class="btn ghost sm" id="cAddSub">+ Alt başlık ekle</button>
        ${(() => { const have = new Set(st.subs.map(x=>x.name.toLocaleLowerCase('tr'))); const sg = (SUGGEST[c ? c.id : ''] || []).filter(n=>!have.has(n.toLocaleLowerCase('tr'))); return sg.length ? `<span class="note">Hızlı ekle:</span><div class="sugg">${sg.map(n=>`<button class="chip" data-sugg="${esc(n)}">+ ${esc(n)}</button>`).join('')}</div>` : ''; })()}
      </div>
      <button class="btn" id="cSave">${editing?'Kaydet':'Ekle'}</button>
      ${editing ? `<button class="btn ghost" id="cDel" style="color:var(--out)">Kategoriyi sil</button>` : ''}
    </div></div>`;
    const keep = () => { st.name = document.getElementById('cName').value; const b = document.getElementById('cBudget'); if(b) st.budget = b.value; const cdl = document.getElementById('cDaily'); if(cdl) st.daily = cdl.checked;
      sheetRoot.querySelectorAll('[data-subname]').forEach(inp => { st.subs[+inp.dataset.subname].name = inp.value; }); };
    sheetRoot.querySelectorAll('[data-ico]').forEach(b => b.onclick = () => { keep(); st.icon = b.dataset.ico; draw(); });
    sheetRoot.querySelectorAll('[data-cc]').forEach(b => b.onclick = () => { keep(); st.color = b.dataset.cc; draw(); });
    document.getElementById('cAddSub').onclick = () => { keep(); st.subs.push({id:uid(), name:''}); draw(); const all = sheetRoot.querySelectorAll('[data-subname]'); all[all.length-1]?.focus(); };
    sheetRoot.querySelectorAll('[data-subdel]').forEach(b => b.onclick = () => { keep(); st.subs.splice(+b.dataset.subdel, 1); draw(); });
    sheetRoot.querySelectorAll('[data-sugg]').forEach(b => b.onclick = () => { keep(); st.subs.push({id:uid(), name:b.dataset.sugg}); draw(); });
    sheetRoot.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheetAnimated);
    sheetRoot.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{ keep(); st.t=b.dataset.ct; draw(); });
    document.getElementById('cSave').onclick = () => {
      keep();
      const name = st.name.trim(); if(!name) return toast('Kategori adı yaz.');
      const ct = editing ? c.t : st.t;
      if(S.settings.cats.some(k=>k!==c && k.t===ct && k.name.toLocaleLowerCase('tr')===name.toLocaleLowerCase('tr'))) return toast('Bu adda bir kategori zaten var.');
      const raw = String(st.budget||'').trim(), budget = raw==='' ? 0 : parseAmt(raw);
      if(raw!=='' && budget===null) return toast('Geçerli bir limit yaz.');
      const subs = st.subs.map(x=>({id:x.id, name:x.name.trim()})).filter(x=>x.name);
      if(editing){ c.name = name; if(c.t==='out'){ c.budget = budget||0; c.daily = st.daily; } c.subs = subs; c.icon = st.icon; c.color = st.color; }
      else S.settings.cats.push({id:uid(), name, t:st.t, budget: st.t==='out' ? (budget||0) : 0, subs, icon:st.icon, color:st.color, ...(st.t==='out' ? {daily: st.daily} : {})});
      saveSettings(); closeSheet(); render(); toast(editing ? 'Kaydedildi' : `${name} eklendi`);
    };
    const del = document.getElementById('cDel');
    if(del) del.onclick = () => {
      const n = uses(), fb = c.t==='out' ? 'diger' : 'digergelir';
      if(n && c.id===fb) return toast('Bu kategori kullanılıyor, silinemez.');
      if(!del.dataset.armed){ del.dataset.armed = 1; del.textContent = n ? `Silmek için tekrar dokun (${n} kayıt “${c.t==='out'?'Diğer':'Diğer gelir'}”e taşınır)` : 'Silmek için tekrar dokun'; return; }
      if(n){
        if(!S.settings.cats.some(x=>x.id===fb)) S.settings.cats.push({id:fb, name: c.t==='out'?'Diğer':'Diğer gelir', t:c.t, budget:0});
        for(const [ym,m] of Object.entries(S.months)){ let ch=false; (m.items||[]).forEach(i=>{ if(i.cat===c.id){ i.cat=fb; ch=true; } }); if(ch) saveMonth(ym); }
        S.settings.recurring.forEach(r=>{ if(r.cat===c.id) r.cat=fb; });
      }
      S.settings.cats = S.settings.cats.filter(x=>x.id!==c.id);
      saveSettings(); closeSheet(); render(); toast('Kategori silindi');
    };
  };
  draw();
}

function applyTheme(){
  const pal = PALETTES[(S.settings && S.settings.color) || 'sari'] || PALETTES.sari;
  const t0 = (S.settings && S.settings.theme) || 'system';
  const dk = t0==='dark' || (t0==='system' && matchMedia('(prefers-color-scheme: dark)').matches);
  const v = pal[dk ? 'dark' : 'light'], st = document.documentElement.style;
  for(const k in TOKENS) st.setProperty(TOKENS[k], v[k]);
  st.colorScheme = dk ? 'dark' : 'light';
  if(t0==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t0);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', v.bg);
}

  document.getElementById('profName').addEventListener('change', e => { S.settings.profile = {...(S.settings.profile||{}), name: e.target.value.trim()}; saveSettings(); toast('Adın kaydedildi'); });
  document.getElementById('avatarFile').addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 200;
      const k = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width-k)/2, (img.height-k)/2, k, k, 0, 0, 200, 200);
      URL.revokeObjectURL(url);
      S.settings.profile = {...(S.settings.profile||{}), photo: c.toDataURL('image/jpeg', .85)}; saveSettings(); render(); toast('Fotoğraf güncellendi');
    };
    img.onerror = () => toast('Bu fotoğraf açılamadı.');
    img.src = url;
  });
  main.querySelectorAll('[data-color-pick]').forEach(b => b.onclick = () => { S.settings.color = b.dataset.colorPick; saveSettings(); render(); toast(PALETTES[b.dataset.colorPick].name + ' seçildi'); });
  main.querySelectorAll('[data-theme-pick]').forEach(b => b.onclick = () => { S.settings.theme = b.dataset.themePick; saveSettings(); render(); });
  document.getElementById('addCat').onclick = () => openCatSheet(null);
  document.getElementById('tipsAgain').onclick = () => { try { localStorage.removeItem(TIP_KEY); } catch(e){} toast('İpuçları her bölümü ilk açışında yeniden gösterilecek'); window.scrollTo(0,0); setTimeout(() => maybeTips('ayar'), 400); };
  document.getElementById('updBtn').onclick = async () => {
    toast('Güncelleme kontrol ediliyor…');
    try { const r = await navigator.serviceWorker?.getRegistration(); if(r) await r.update(); } catch(e){}
    try { const c = await caches.keys(); await Promise.all(c.map(k => caches.delete(k))); } catch(e){}
    setTimeout(() => location.reload(), 400);
  };
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importFile').addEventListener('change', importData);
}

function stopRecurring(rid){
  const r = S.settings.recurring.find(x=>x.id===rid); if(!r) return;
  const until = ymAdd(todayYM, -1);
  if(until < r.from) S.settings.recurring = S.settings.recurring.filter(x=>x.id!==rid);
  else r.until = until;
  saveSettings();
}

async function exportData(){
  let saglik = null; try { saglik = JSON.parse(localStorage.getItem('bocekler-saglik-v1') || 'null'); } catch(e){}
  const json = JSON.stringify({app:'bocekler-cuzdan', v:1, exported:todayISO, settings:S.settings, months:S.months, rates:S.rates, saglik}, null, 1);
  const name = `bocekler-cuzdan-yedek-${todayISO}.json`;
  try {
    const file = new File([json], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Böcekler Cüzdan yedeği'}); markBackedUp(); render(); toast('Yedek hazır'); return; }
  } catch(e){ if(e && e.name==='AbortError') return; }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    markBackedUp(); render(); toast('Yedek indirildi'); return;
  } catch(e){}
  if(!document.getElementById('dataArea')){ view.tab='ayar'; render(); }
  const area = document.getElementById('dataArea');
  area.innerHTML = `<div class="field"><span class="note">Bu metni kopyalayıp bir nota kaydet:</span><textarea id="exportText" readonly></textarea><button class="btn ghost" id="copyBtn">Kopyala</button></div>`;
  const ta = document.getElementById('exportText'); ta.value = json;
  document.getElementById('copyBtn').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(json); toast('Kopyalandı'); } catch(e){ ta.select(); toast('Metni seçtim, kopyala de.'); }
  });
}

function importData(ev){
  const f = ev.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let d; try { d = JSON.parse(rd.result); } catch(e){ return toast('Dosya okunamadı. Bu uygulamanın yedeği mi?'); }
    if(!d || !d.settings || !Array.isArray(d.settings.cats) || typeof d.months!=='object') return toast('Bu dosya bir Böcekler Cüzdan yedeği değil.');
    const n = Object.values(d.months).reduce((a,m)=>a+(m && Array.isArray(m.items) ? m.items.length : 0),0);
    const area = document.getElementById('dataArea');
    area.innerHTML = `<div class="field"><span class="note">${esc(d.exported||'')} tarihli yedekte ${n} kayıt var. Yüklersen mevcut kayıtlarının yerine geçer.</span>
      <div class="btns"><button class="btn danger" id="doImport">Yedeği yükle</button><button class="btn ghost" id="cancelImport">Vazgeç</button></div></div>`;
    document.getElementById('cancelImport').onclick = () => { area.innerHTML=''; ev.target.value=''; };
    document.getElementById('doImport').onclick = () => {
      const old = Object.keys(S.months);
      S = { settings: {...defaultSettings(), ...d.settings, cats:d.settings.cats, recurring:d.settings.recurring||[], savTarget:d.settings.savTarget||0, debts:d.settings.debts||[], goals:d.settings.goals||[], ious:d.settings.ious||[]}, months: {}, rates: d.rates||S.rates||{} };
      for(const [ym,m] of Object.entries(d.months)) if(/^\d{4}-\d{2}$/.test(ym) && m && typeof m==='object') S.months[ym] = {items:m.items||[], skip:m.skip||[], sav:m.sav||[], pay:m.pay||{}};
      cleanData(S);
      if(mode==='db'){
        queueWrite('settings', S.settings);
        for(const ym of Object.keys(S.months)) queueWrite('m-'+ym, S.months[ym]);
        for(const ym of old) if(!S.months[ym]) queueWrite('m-'+ym, null);
      } else saveLocal();
      if(d.saglik && typeof d.saglik === 'object' && !Array.isArray(d.saglik)) try { localStorage.setItem('bocekler-saglik-v1', JSON.stringify(d.saglik)); } catch(e){}
      render(); toast(d.saglik ? 'Yedek yüklendi (Sağlık dahil)' : 'Yedek yüklendi');
    };
  };
  rd.readAsText(f);
}

  };
  draw();
  if(!editing) setTimeout(()=>document.getElementById('fAmt')?.focus(), 60);

function closeSheet(){ sheetRoot.innerHTML=''; }
function closeSheetAnimated(){
  const sh = sheetRoot.querySelector('.sheet'), sc = sheetRoot.querySelector('.scrim');
  if(!sh) return closeSheet();
  sh.classList.remove('dragging'); sh.style.transition = 'transform .2s ease-in'; sh.style.transform = 'translateY(105%)';
  if(sc){ sc.style.transition = 'opacity .2s'; sc.style.opacity = '0'; }
  setTimeout(closeSheet, 200);
}
// Pencereyi aşağı çekerek kapatma: tutamaktan her zaman, içerikten en üstteyken
(() => {
  let d = null;
  const start = (y, target) => {
    const sh = target.closest('.sheet'); if(!sh || target.closest('input,select,textarea')) return;
    d = { sh, y0:y, t0:Date.now(), dy:0, on:false, grab: !!target.closest('.grab') };
  };
  const move = (y, ev) => {
    if(!d) return;
    d.dy = y - d.y0;
    if(!d.on){
      if(d.dy > 8 && (d.grab || d.sh.scrollTop <= 0)){ d.on = true; d.sh.classList.add('dragging'); }
      else if(d.dy < -8 && !d.grab){ d = null; return; }
    }
    if(d.on){ if(ev.cancelable) ev.preventDefault(); d.sh.style.transform = `translateY(${Math.max(0,d.dy)}px)`;
      const sc = sheetRoot.querySelector('.scrim'); if(sc) sc.style.opacity = String(Math.max(.2, 1 - d.dy/400)); }
  };
  const end = () => {
    if(!d) return;
    const {sh, dy, on, t0} = d; d = null; if(!on) return;
    const fast = dy / Math.max(1, Date.now()-t0) > .5;
    if(dy > 110 || (fast && dy > 30)) closeSheetAnimated();
    else { sh.classList.remove('dragging'); sh.style.transition = 'transform .2s ease-out'; sh.style.transform = '';
      const sc = sheetRoot.querySelector('.scrim'); if(sc){ sc.style.transition='opacity .2s'; sc.style.opacity=''; }
      setTimeout(()=>{ sh.style.transition=''; }, 220); }
  };
  sheetRoot.addEventListener('touchstart', e => start(e.touches[0].clientY, e.target), {passive:true});
