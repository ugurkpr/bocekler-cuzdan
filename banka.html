const dailyField = st => st.t==='out' && st.nodaily !== undefined && !!st.nodaily !== !catDaily(cat(st.cat)) ? {nodaily: !!st.nodaily} : {};
const payFields = st => st.t==='out' && st.pay && st.pay!=='cash' ? {pay:st.pay, inst: st.inst>1 ? st.inst : 1} : {};
// Son 4 ayda en az 2 kez girilen kayıtlar (en sık önce) + en son kayıt
function quickTemplates(t){
  const since = isoAdd(todayISO, -120), map = new Map(); let last = null;
  for(const m of Object.values(S.months)) for(const it of (m.items||[])){
    if(it.t!==t || (it.inst||1)>1 || it.date > todayISO) continue;
    if(!last || it.date > last.date) last = it;
    if(it.date < since) continue;
    const k = [it.cat, it.sub||'', (it.note||'').trim().toLocaleLowerCase('tr'), it.amt, it.pay||''].join('|');
    const v = map.get(k) || {n:0, it, d:''}; v.n++; if(it.date >= v.d){ v.d = it.date; v.it = it; } map.set(k, v);
  }
  const out = [...map.values()].filter(v=>v.n>=2).sort((a,b)=>b.n-a.n || b.d.localeCompare(a.d)).map(v=>v.it);
  if(last && !out.some(x=>x.cat===last.cat && x.amt===last.amt && (x.note||'')===(last.note||''))) out.unshift(last);
  return out.slice(0, 7);
}
function save(st, entry){
  if(st.t==='in' && st.iou && !entry){
    const x = ious().find(i=>i.id===st.iou), amt = parseAmt(st.amt);
    if(!x) return; if(!amt) return toast('Tutarı yaz.');
    const v = Math.min(amt, iouLeft(x)); x.pays = x.pays || []; x.pays.push({id:uid(), date: /^\d{4}-\d{2}-\d{2}$/.test(st.date) ? st.date : todayISO, amt:v}); x.closed = iouLeft(x) <= 0;
    saveSettings(); closeSheet(); render();
    return toast(`${x.person} alacağından ${tl.format(v)} düşüldü${x.closed ? ', kapandı' : ''} (gelire eklenmedi)`);
  }
  if(st.t==='out' && st.iouv && !entry){
    const x = ious().find(i=>i.id===st.iouv), amt = parseAmt(st.amt);
    if(!x) return; if(!amt) return toast('Tutarı yaz.');
    const date = /^\d{4}-\d{2}-\d{2}$/.test(st.date) ? st.date : todayISO, v = Math.min(amt, iouLeft(x));
    iouPay(x, v, date, {cat: st.cat || ensureCat('borcode','Borç ödemesi'), sub: st.sub||null, ...payFields(st), ...dailyField(st), note: st.note.trim() || x.person+' borcu'});
    view.ym = date.slice(0,7); closeSheet(); render();
    return toast(`${x.person} borcundan ${tl.format(v)} düşüldü${x.closed ? ', kapandı' : ''}${iouExp(x) ? ' · gidere yazıldı' : ''}`);
  }
  if(st.t==='out' && st.pay && S.settings.lastPay !== st.pay){ S.settings.lastPay = st.pay; saveSettings(); }
  const amt = parseAmt(st.amt);
  if(!amt) return toast('Tutarı yaz (örn. 1.250,50).');
  if(st.t==='out' && st.pay && st.pay!=='cash' && (st.inst||1) > 1 && amt < st.inst) return toast('Taksit başına en az 1 ₺ düşmeli.');
  if(!st.cat) return toast('Bir kategori seç.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(st.date)) return toast('Tarihi seç.');
  const ym = st.date.slice(0,7), day = +st.date.slice(8);
  if(entry && entry.rec){
    const r = S.settings.recurring.find(x=>x.id===entry.rid);
    Object.assign(r, {t:st.t, amt, cat:st.cat, sub:st.sub||null, pay: st.t==='out' && st.pay!=='cash' ? st.pay : null, note:st.note.trim(), day});
    saveSettings();
  } else if(entry){
    const oldYm = entry.date.slice(0,7);
    const om = monthDoc(oldYm); om.items = om.items.filter(i=>i.id!==entry.id);
    const nm = monthDoc(ym); nm.items.push({id:entry.id, t:st.t, amt, cat:st.cat, sub:st.sub||null, ...payFields(st), ...dailyField(st), date:st.date, note:st.note.trim()});
    saveMonth(oldYm); if(ym!==oldYm) saveMonth(ym);
    for(const x of ious()) for(const p of (x.pays||[])) if(p.exp===entry.id){ p.amt = amt; p.date = st.date; x.closed = iouLeft(x) <= 0; saveSettings(); }
  } else if(st.repeat){
    S.settings.recurring.push({id:uid(), t:st.t, amt, cat:st.cat, sub:st.sub||null, pay: st.t==='out' && st.pay!=='cash' ? st.pay : null, note:st.note.trim(), day, from:ym});
    saveSettings();
  } else {
    monthDoc(ym).items.push({id:uid(), t:st.t, amt, cat:st.cat, sub:st.sub||null, ...payFields(st), ...dailyField(st), date:st.date, note:st.note.trim()});
    saveMonth(ym);
  }
  view.ym = ym; closeSheet(); render();
  toast(st.date > todayISO ? `Kaydedildi · ${dayLabel(st.date,{day:'numeric',month:'long'})} ${st.t==='in'?'gelir olarak bekleniyor':'için planlandı'}` : entry ? 'Güncellendi' : 'Kaydedildi');
}
function removeItem(entry){
  for(const x of ious()) if((x.pays||[]).some(p=>p.exp===entry.id)){ x.pays = x.pays.filter(p=>p.exp!==entry.id); x.closed = iouLeft(x) <= 0; saveSettings(); }
  const ym = entry.date.slice(0,7); const m = monthDoc(ym);
  m.items = m.items.filter(i=>i.id!==entry.id); saveMonth(ym); closeSheet(); render(); toast('Kayıt silindi');
}

let tipOn = false;
function tipPick(sel){ const el = typeof sel === 'function' ? sel() : document.querySelector(sel); return el && el.getClientRects().length ? el : null; }
function maybeTips(key){
  if(!key || tipOn || mode === 'loading' || !TIPS[key] || tipSeen()[key]) return;
  if(/[?&]test\b/.test(location.search) && !window.__tipsTest) return;
  if(document.getElementById('splash')) return setTimeout(() => maybeTips(currentTipKey()), 700);
  if(!key.startsWith('form-') && document.querySelector('#sheetRoot .sheet')) return;
  tipOn = true;
  setTimeout(() => {
    if(!key.startsWith('form-') && key !== currentTipKey()){ tipOn = false; return maybeTips(currentTipKey()); }   // bu arada sekme değiştiyse
    const steps = TIPS[key].filter(s => tipPick(s[0])); if(!steps.length){ tipOn = false; return; } runTips(key, steps); }, key.startsWith('form-') ? 450 : 250);
}
const currentTipKey = () => view.tab === 'odeme' && view.pseg === 'iou' ? 'iou' : view.tab;
function runTips(key, steps){
  try { document.activeElement && document.activeElement.blur(); } catch(e){}   // klavye açılıp ipucunu örtmesin
  const ov = document.createElement('div'); ov.id = 'tips'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
  ov.innerHTML = '<div class="tip-spot"></div><div class="tip-box" aria-live="polite"></div>';
  document.body.appendChild(ov);
  const spot = ov.firstChild, box = ov.lastChild; let i = 0, cur = null;
  const end = () => { tipMark(key); ov.remove(); tipOn = false; removeEventListener('resize', place); };
  const place = () => {
    if(!cur) return; const r = cur.getBoundingClientRect(), pad = 6;
    Object.assign(spot.style, {left:(r.left-pad)+'px', top:(r.top-pad)+'px', width:(r.width+pad*2)+'px', height:(r.height+pad*2)+'px'});
    const w = Math.min(340, innerWidth - 32), bh = box.offsetHeight, below = r.bottom + pad + 12, above = r.top - pad - 12 - bh;
    box.style.width = w + 'px'; box.style.left = Math.max(16, Math.min(innerWidth - w - 16, r.left + r.width/2 - w/2)) + 'px';
    box.style.top = (below + bh < innerHeight - 12 ? below : above > 12 ? above : Math.max(12, innerHeight - bh - 12)) + 'px';
  };
  const show = () => {
    const [sel, title, text] = steps[i]; cur = tipPick(sel);
    if(!cur){ if(++i < steps.length) return show(); return end(); }
    const r0 = cur.getBoundingClientRect(); if(r0.top < 70 || r0.bottom > innerHeight - 90) cur.scrollIntoView({block: r0.height > innerHeight*.5 ? 'start' : 'center'});
    box.innerHTML = `<small>${i+1} / ${steps.length}</small><b>${esc(title)}</b><p>${esc(text)}</p><div class="btns"><button class="btn ghost" data-tskip>${i === steps.length-1 ? 'Kapat' : 'Geç'}</button><button class="btn" data-tnext>${i === steps.length-1 ? 'Anladım' : 'İleri'}</button></div>`;
    box.querySelector('[data-tskip]').onclick = end;
    box.querySelector('[data-tnext]').onclick = () => { if(++i < steps.length) show(); else end(); };
    requestAnimationFrame(() => requestAnimationFrame(place)); setTimeout(place, 80);
  };
  addEventListener('resize', place);
  ov.addEventListener('click', e => { if(e.target === ov || e.target === spot){ e.stopPropagation(); } });
  show();
}
new MutationObserver(() => {
  const q = id => document.getElementById(id);
  if(!document.querySelector('#sheetRoot .sheet')) return;
  const key = q('fAmt') && !q('fDel') ? 'form-kayit' : q('sQty') && !q('sDel') ? 'form-birikim' : q('iPerson') && !q('iDel') ? 'form-iou'
    : q('dName') && q('dCut') && !q('dDel') ? 'form-kart' : q('dName') && q('dCount') && !q('dDel') ? 'form-kredi' : q('cPaid') ? 'form-odeme' : q('cName') ? 'form-kategori' : null;
  maybeTips(key);
}).observe(sheetRoot, {childList: true});

      openSheet({ id:'r:'+r.id, rid:r.id, t:r.t, amt:r.amt, cat:r.cat, note:r.note, date:`${ym}-${pad(Math.min(r.day, daysIn(ym)))}`, rec:true }); } return; }
  const pm = e.target.closest('[data-pick-month]');
  if(pm){ if(pm.dataset.pickMonth!==view.ym){ view.ym = pm.dataset.pickMonth; view.day = null; render(); window.scrollTo({top:0, behavior:'smooth'}); toast(ymLabel(view.ym)); } return; }
  const g = e.target.closest('[data-goto]'); if(g){ view.tab=g.dataset.goto; if(g.dataset.ym) view.ym=g.dataset.ym; render(); window.scrollTo(0,0); return; }
  const dy = e.target.closest('[data-day]'); if(dy){ view.day = dy.dataset.day && dy.dataset.day!==view.day ? dy.dataset.day : null; render(); return; }
  const find = id => debts().find(x=>x.id===id);
  const pb = e.target.closest('[data-pay]'); if(pb){ const d=find(pb.dataset.pay); if(!d) return;
    if(d.kind==='card'){ openCardPaySheet(d, view.ym, 'pay'); return; }
    if((payOf(d,view.ym)||{}).paid){ if(!pb.dataset.armed){ pb.dataset.armed=1; pb.textContent='Geri almak için tekrar dokun'; return; } unpay(d,view.ym); render(); toast('Ödeme geri alındı'); }
    else openPaySheet(d, view.ym); return; }
  const tg = e.target.closest('[data-dtgl]'); if(tg){ const id = tg.dataset.dtgl, box = tg.closest('.debt'); if(openDebts.has(id)) openDebts.delete(id); else openDebts.add(id);
    box.classList.toggle('open', openDebts.has(id)); tg.setAttribute('aria-expanded', openDebts.has(id)); try { localStorage.setItem('acik-kartlar', JSON.stringify([...openDebts])); } catch(err){} return; }
  const ce2 = e.target.closest('[data-cedit]'); if(ce2){ const d = debts().find(x=>x.id===ce2.dataset.cedit); if(d) openCardPaySheet(d, view.ym, 'edit'); return; }
  const ic = e.target.closest('[data-ics]'); if(ic){ const d=find(ic.dataset.ics); if(d) addToCalendar(d); return; }
  const de = e.target.closest('[data-dedit]'); if(de){ const d=find(de.dataset.dedit); if(d) openDebtSheet(d); return; }
  const ad = e.target.closest('[data-adddebt]'); if(ad){ openDebtSheet(null, ad.dataset.adddebt); return; }
  const sv = e.target.closest('[data-sedit]'); if(sv){ const x=savFor(view.ym).find(y=>y.id===sv.dataset.sedit); if(x) openSavSheet(x); return; }
  const b = e.target.closest('[data-edit]'); if(!b) return;
  const entry = entriesFor(view.ym).find(x=>x.id===b.dataset.edit); if(!entry) return;
  if(entry.srcId){ const orig = findItem(entry.srcId); if(orig) openSheet({...orig}); return; }
  openSheet(entry);
});

init();
// Profil sayfasından geri dönünce (sayfa önbellekten gelirse) güncel profil ve rengi oku
addEventListener('pageshow', e => { if(e.persisted) location.reload(); });
document.addEventListener('click', e => { if(!e.target.closest('[data-goz]')) return; e.stopPropagation(); Bocekler.gizliYap(!Bocekler.gizli()); render(); toast(Bocekler.gizli() ? 'Toplamlar gizlendi' : 'Toplamlar görünüyor'); }, true);
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
