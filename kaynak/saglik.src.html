.glass.on path.o{stroke:#1F86CF}

.week{display:grid;gap:6px}
.week svg{width:100%;height:auto;display:block}
.res .item .amt{font-size:14px;color:var(--muted);font-weight:500}

<script>
(() => {
const APP_VERSION = '1.0 · 6 Ekim 2026';
const KEY = 'bocekler-saglik-v1';
const mode = 'local';
/* ---------- yardımcılar ---------- */
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now = new Date(), todayISO = isoOf(now);
const addDays = (iso, n) => { const d = new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return isoOf(d); };
const dayLabel = (iso, opt={day:'numeric',month:'long',weekday:'long'}) => new Date(iso+'T12:00').toLocaleDateString('tr-TR', opt);

const num = v => { const n = parseFloat(String(v??'').trim().replace(/\s/g,'').replace(',','.')); return isFinite(n) ? n : null; };
const fold = s => String(s||'').toLocaleLowerCase('tr').replace(/[çğıöşüâîû]/g, c => ({ç:'c',ğ:'g',ı:'i',ö:'o',ş:'s',ü:'u',â:'a',î:'i',û:'u'}[c]));
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
const OGUNLER = [['kahvalti','Kahvaltı'],['ogle','Öğle'],['aksam','Akşam'],['ara','Ara öğün']];
const ogunAd = o => (OGUNLER.find(x => x[0]===o) || [0,'Öğün'])[1];
const ogunSimdi = () => { const h = new Date().getHours(); return h < 11 ? 'kahvalti' : h < 15 ? 'ogle' : h >= 17 && h < 22 ? 'aksam' : 'ara'; };
const birimOf = g => g && (g.kat === 'ic' || g.ml) ? 'ml' : 'g';

/* ---------- veri ---------- */
const blank = () => ({profil:{cins:'', yas:'', boy:'', aktivite:1.375, hedef:'koru', hiz:0.5, hedefKilo:'', kcalElle:'', suHedef:'', bardak:200, uykuHedef:8}, gunler:{}, kilolar:[], ozel:[], tarifler:[], son:[], fav:[]});
function clean(d){
  const b = blank(), o = x => x && typeof x === 'object' && !Array.isArray(x), a = x => Array.isArray(x) ? x.filter(o) : [];
  const out = {profil: {...b.profil, ...(o(d.profil) ? d.profil : {})}, gunler:{}, kilolar: a(d.kilolar).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k.t) && isFinite(k.kg)),
    ozel: a(d.ozel).filter(f => f.ad && isFinite(f.kcal)), tarifler: a(d.tarifler).filter(t => t.ad && Array.isArray(t.malz)),
    son: Array.isArray(d.son) ? d.son.filter(x => typeof x === 'string') : [], fav: Array.isArray(d.fav) ? d.fav.filter(x => typeof x === 'string') : []};
  for(const [k, g] of Object.entries(o(d.gunler) ? d.gunler : {})) if(/^\d{4}-\d{2}-\d{2}$/.test(k) && o(g))
    out.gunler[k] = {...g, ogun: a(g.ogun).filter(e => e.b100 && isFinite(e.g)), su: +g.su || 0};
  return out;
}
let H = (() => { try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if(d && typeof d === 'object') return clean(d); } catch(e){} return blank(); })();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(H)); } catch(e){ toast('Kayıt yapılamadı: telefon hafızası dolu olabilir.'); }
  const t = hedefler(), s = sums(todayISO);
  Bocekler.snap('saglik', {kcal: Math.round(s.kcal), hedef: t.kcal, su: gun(todayISO, true).su || 0, suHedef: t.su});
}
const gun = (iso, peek) => H.gunler[iso] || (peek ? {ogun:[], su:0} : (H.gunler[iso] = {ogun:[], su:0}));
const besin = (e) => { const f = e.g/100; return {kcal: e.b100.kcal*f, p: e.b100.p*f, k: e.b100.k*f, y: e.b100.y*f}; };
function sums(iso, o){ const s = {kcal:0, p:0, k:0, y:0}; for(const e of gun(iso, true).ogun) if(!o || e.o === o){ const b = besin(e); s.kcal += b.kcal; s.p += b.p; s.k += b.k; s.y += b.y; } return s; }
const lastKg = () => { const k = [...H.kilolar].sort((a,b) => a.t.localeCompare(b.t)); return k.length ? k[k.length-1].kg : null; };
function hedefler(){
  const p = H.profil, kg = lastKg(), ok = !!(p.cins && +p.yas > 0 && +p.boy > 0 && kg);
  let bmr = null, tdee = null, kcal = 2000;
  if(ok){
    bmr = 10*kg + 6.25*p.boy - 5*p.yas + (p.cins === 'e' ? 5 : -161);
    tdee = bmr * (+p.aktivite || 1.375);
    const fark = (+p.hiz || 0.5) * 7700 / 7;
    kcal = p.hedef === 'ver' ? tdee - fark : p.hedef === 'al' ? tdee + fark : tdee;
    kcal = Math.max(kcal, p.cins === 'e' ? 1500 : 1200);
  }
  if(+p.kcalElle > 0) kcal = +p.kcalElle;
  kcal = Math.round(kcal/10)*10;
  const w = kg || 70, prot = Math.round(w * (p.hedef === 'ver' ? 1.6 : 1.3)), yag = Math.round(kcal*0.3/9), karb = Math.max(0, Math.round((kcal - prot*4 - yag*9)/4));
  const bardak = +p.bardak || 200, su = +p.suHedef > 0 ? Math.round(+p.suHedef) : Math.max(6, Math.round(w*33/bardak));
  return {ok, kg, bmr, tdee, kcal, prot, yag, karb, su, bardak, uyku: +p.uykuHedef || 8};
}

function bindProfil(){
  const P = H.profil, upd = (k, v) => { P[k] = v; save(); };
  const bindNum = (id, k, lo, hi, dec) => { const el = document.getElementById(id); if(!el) return;
    el.addEventListener('change', () => { const raw = el.value.trim(); if(raw === ''){ upd(k, ''); render(); return; }
      const v = num(raw); if(v == null || v < lo || v > hi){ toast(`${lo} ile ${hi} arasında bir değer yaz.`); el.value = P[k]; return; }
      upd(k, dec ? r1(v) : Math.round(v)); render(); }); };
  bindNum('pYas','yas',10,100); bindNum('pBoy','boy',100,230); bindNum('pHk','hedefKilo',30,250,true); bindNum('pKcal','kcalElle',800,6000);
  bindNum('pSu','suHedef',1,30); bindNum('pBardak','bardak',50,1000); bindNum('pUyku','uykuHedef',4,12,true);
  const akt = document.getElementById('pAkt'); akt.addEventListener('change', () => { upd('aktivite', +akt.value); render(); });
  main.querySelectorAll('[data-cins]').forEach(b => b.onclick = () => { upd('cins', b.dataset.cins); render(); });
  main.querySelectorAll('[data-hdf]').forEach(b => b.onclick = () => { upd('hedef', b.dataset.hdf); render(); });
  main.querySelectorAll('[data-hiz]').forEach(b => b.onclick = () => { upd('hiz', +b.dataset.hiz); render(); });
  document.getElementById('tipsAgain').onclick = () => { try { const s = JSON.parse(localStorage.getItem(TIP_KEY) || '{}'); for(const k of Object.keys(s)) if(k.startsWith('s-')) delete s[k]; localStorage.setItem(TIP_KEY, JSON.stringify(s)); } catch(e){} toast('İpuçları her bölümü ilk açışında yeniden gösterilecek'); window.scrollTo(0,0); setTimeout(() => maybeTips(currentTipKey()), 400); };
  const w = document.getElementById('wipe'); w.onclick = () => { if(!w.dataset.armed){ w.dataset.armed = 1; w.textContent = 'Emin misin? Silmek için tekrar dokun'; return; } H = blank(); save(); render(); toast('Sağlık kayıtları silindi'); };
}

/* ---------- pencereler ---------- */
function openSheet(html, label){ sheetRoot.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="in"><div class="grab"></div>${html}</div></div>`;
  sheetRoot.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheetAnimated); return sheetRoot.querySelector('.sheet'); }
const head = (title) => `<div class="sec-head" style="margin:0"><h2>${esc(title)}</h2><button class="icon-btn" data-close>Kapat</button></div>`;
function closeSheet(){ sheetRoot.innerHTML = ''; }
function closeSheetAnimated(){ const sh = sheetRoot.querySelector('.sheet'), sc = sheetRoot.querySelector('.scrim'); if(!sh) return closeSheet();
  sh.style.transition = 'transform .2s ease-in'; sh.style.transform = 'translateY(105%)'; if(sc){ sc.style.transition = 'opacity .2s'; sc.style.opacity = '0'; } setTimeout(closeSheet, 200); }
/*SWIPE*/
document.addEventListener('keydown', e => { if(e.key === 'Escape' && sheetRoot.innerHTML){ if(document.getElementById('scan')) return stopScan(); closeSheet(); } });

/* Gıda ekleme: arama → miktar */
let ekle = null;   // {mod:'ogun'|'malz', o, gun, q, sonuc:[], net:null|'yukleniyor'|[], hata, onPick}
function openEkle(opt){ ekle = {mod:'ogun', o: ogunSimdi(), gun: view.gun, q:'', net:null, ...opt}; drawEkle(); setTimeout(() => document.getElementById('aQ')?.focus(), 80); }
// Pencere bir kez çizilir; yazarken sadece sonuç listesi yenilenir (iPhone'da klavye kapanmasın)
function drawEkle(){
  const e = ekle;
  const sh = openSheet(`${head(e.mod === 'malz' ? 'Malzeme ekle' : 'Ne yedin?')}
    ${e.mod === 'ogun' ? `<div class="chips" role="group" aria-label="Öğün">${OGUNLER.map(([o, a]) => `<button class="chip" data-o="${o}" aria-pressed="${e.o===o}">${a}</button>`).join('')}</div>` : ''}
    <div class="srch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="aQ" type="search" enterkeyhint="search" placeholder="Örn. simit, mercimek çorbası, kola" value="${esc(e.q)}" autocomplete="off" aria-label="Gıda ara"></div>
    <div class="btns"><button class="btn ghost" id="aScan" style="flex:1">📷 Barkod okut</button><button class="btn ghost" id="aOzel" style="flex:1">＋ Kendi gıdam</button></div>
    <div id="aRes" class="res"></div>`, 'Gıda ekle');
  const inp = document.getElementById('aQ');
  let tm; inp.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { e.q = inp.value; e.net = null; e.hata = ''; drawRes(); }, 150); });
  inp.addEventListener('keydown', ev => { if(ev.key === 'Enter'){ ev.preventDefault(); inp.blur(); } });
  sh.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { e.o = b.dataset.o; sh.querySelectorAll('[data-o]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  document.getElementById('aScan').onclick = () => startScan();
  document.getElementById('aOzel').onclick = () => openOzel({ad: inp.value.trim()});
  drawRes();
}
function drawRes(){
  const e = ekle, box = document.getElementById('aRes'); if(!e || !box) return;
  const q = e.q.trim(), yerel = q ? araYerel(q) : [];
  const favs = H.fav.map(gidaBul).filter(Boolean), sons = H.son.map(gidaBul).filter(f => f && !H.fav.includes(gkey(f))).slice(0, 12);
  const row = (f, i, grp) => `<button class="item" data-pick="${grp}:${i}"><span class="mid"><b>${esc(f.ad)}</b><small>${esc([f.marka && !f.tarif ? f.marka : f.etiket, f.por && f.por[0] && !f.tarif ? `${f.por[0].ad} ≈ ${nf0.format(f.kcal * f.por[0].g / 100)} kcal` : ''].filter(Boolean).join(' · '))}</small></span><span class="amt">${f.tarif ? `${nf0.format(f.kcal * f.por[0].g / 100)}<small style="font-weight:400"> /porsiyon</small>` : `${nf0.format(f.kcal)}<small style="font-weight:400"> /100${birimOf(f)}</small>`}</span></button>`;
  e.liste = {y: yerel, f: favs, s: sons, n: Array.isArray(e.net) ? e.net : []};
  box.innerHTML = q ? `
      ${yerel.length ? `<div class="items">${yerel.map((f, i) => row(f, i, 'y')).join('')}</div>` : `<div class="card empty"><b>Listede bulunamadı</b>Hazır bir ürünse internette ara ya da barkodunu okut.</div>`}
      <section style="margin-top:14px"><div class="sec-head"><h2 style="font-size:16px">Hazır ürünler</h2><small>Open Food Facts</small></div>
      ${e.net === 'yukleniyor' ? `<div class="card empty">Aranıyor…</div>` : Array.isArray(e.net) ? (e.net.length ? `<div class="items">${e.net.map((f, i) => row(f, i, 'n')).join('')}</div><span class="note">Değerler üreticilerin ve gönüllülerin girdiği bilgilerdir; paketteki etiketle farklıysa kendi gıdan olarak ekle.</span>` : `<div class="card empty"><b>Ürün bulunamadı</b>Marka ve ürün adını birlikte yaz (örn. “eti karam”) ya da barkodu okut.</div>`) : `<button class="btn ghost" id="aNet" style="width:100%">🌐 “${esc(q)}” için hazır ürünlerde ara</button>${e.hata ? `<span class="note" style="color:var(--out)">${esc(e.hata)}</span>` : ''}`}</section>`
    : `${favs.length ? `<div class="sec-head" style="margin:4px 0 8px"><h2 style="font-size:16px">Favoriler</h2></div><div class="items">${favs.map((f, i) => row(f, i, 'f')).join('')}</div>` : ''}
       ${sons.length ? `<div class="sec-head" style="margin:14px 0 8px"><h2 style="font-size:16px">Son eklediklerin</h2></div><div class="items">${sons.map((f, i) => row(f, i, 's')).join('')}</div>` : ''}
       ${!favs.length && !sons.length ? `<div class="card empty"><b>${nf0.format(G.length)} gıda ve yemek hazır</b>Adını yazmaya başla. Market ürünleri için barkodu okut ya da internette ara.</div>` : ''}`;
  box.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { const [g, i] = b.dataset.pick.split(':'); const f = e.liste[g][+i]; if(f) openMiktar(f); });
  const net = document.getElementById('aNet'); if(net) net.onclick = async () => { const qq = e.q.trim(); e.net = 'yukleniyor'; drawRes();
    try { e.net = await araInternet(qq); } catch(err){ e.net = null; e.hata = navigator.onLine === false ? 'İnternet bağlantısı yok.' : 'Arama şu an yapılamadı, biraz sonra tekrar dene.'; }
    if(ekle === e && e.q.trim() === qq) drawRes(); };
}
// Miktar seçimi (yeni ekleme ya da var olan kaydı düzenleme)
function openMiktar(f, kayit){
  const e = ekle || {mod:'ogun', o: kayit ? kayit.o : ogunSimdi(), gun: view.gun};
  const birimler = [{ad: birimOf(f) === 'ml' ? 'ml' : 'gram', g: 1}, ...(f.por || [])];
  const st = kayit ? {bi: Math.max(0, birimler.findIndex(b => kayit.birim && b.ad === kayit.birim.ad)), adet: kayit.birim ? kayit.adet : kayit.g, o: kayit.o}
                   : {bi: f.por && f.por.length ? 1 : 0, adet: f.por && f.por.length ? 1 : 100, o: e.o};
  const fav = () => H.fav.includes(gkey(f));
  const draw = () => {
    const b = birimler[st.bi], g = (num(st.adet) || 0) * b.g, k = g/100;
    const sh = openSheet(`<div class="sec-head" style="margin:0"><h2 style="min-width:0">${esc(f.ad)}</h2><span style="display:flex;gap:4px">${kayit ? '' : `<button class="star" id="mFav" aria-pressed="${fav()}" aria-label="Favorilere ekle">★</button>`}<button class="icon-btn" data-close>Kapat</button></span></div>
      <div class="src">${esc([f.marka, f.etiket || (f.kat ? window.GIDA_KATEGORI[f.kat] : ''), f.tarif ? `1 porsiyon: ${nf0.format(f.kcal * f.por[0].g / 100)} kcal` : `100 ${birimOf(f)}: ${nf0.format(f.kcal)} kcal`].filter(Boolean).join(' · '))}</div>
      <div class="card portion" style="display:grid;gap:8px"><div class="kc num" id="mKc">${nf0.format(f.kcal*k)} <small style="font-size:16px;font-weight:600">kcal</small></div>
        <div class="mac" id="mMac"><span>Protein <b>${nf1.format(f.p*k)} g</b></span><span>Karbonhidrat <b>${nf1.format(f.k*k)} g</b></span><span>Yağ <b>${nf1.format(f.y*k)} g</b></span></div></div>
      <div class="field"><span class="label">Birim</span><div class="chips">${birimler.map((x, i) => i === 0 && f.tarif ? '' : `<button class="chip" data-bi="${i}" aria-pressed="${st.bi===i}">${esc(x.ad)}${i ? ` <small style="color:var(--muted)">${nf0.format(x.g)} ${birimOf(f)}</small>` : ''}</button>`).join('')}</div></div>
      <div class="amtrow"><div class="field"><label class="label" for="mAdet">${st.bi ? 'Kaç tane' : 'Miktar (' + birimOf(f) + ')'}</label><input id="mAdet" class="num amount-in" inputmode="decimal" autocomplete="off" value="${esc(String(st.adet).replace('.', ','))}"></div>
        <div class="stepper"><button data-st="-1" aria-label="Azalt">−</button><button data-st="1" aria-label="Artır">+</button></div></div>
      <div class="note" id="mG">${st.bi ? `≈ ${nf0.format(g)} ${birimOf(f)}` : ''}</div>
      ${e.mod === 'ogun' ? `<div class="field"><span class="label">Öğün</span><div class="chips">${OGUNLER.map(([o, a]) => `<button class="chip" data-mo="${o}" aria-pressed="${st.o===o}">${a}</button>`).join('')}</div></div>` : ''}
      <button class="btn" id="mOk">${kayit ? 'Kaydet' : e.mod === 'malz' ? 'Malzemeyi ekle' : ogunAd(st.o) + "'a ekle"}</button>
      ${kayit ? `<button class="btn ghost" id="mDel" style="color:var(--out)">Sil</button>` : `<button class="btn ghost" id="mBack">‹ Aramaya dön</button>`}`, 'Miktar');
    const inp = document.getElementById('mAdet');
    const live = () => { st.adet = inp.value; const gg = (num(inp.value) || 0) * birimler[st.bi].g, kk = gg/100;
      document.getElementById('mKc').innerHTML = `${nf0.format(f.kcal*kk)} <small style="font-size:16px;font-weight:600">kcal</small>`;
      document.getElementById('mMac').innerHTML = `<span>Protein <b>${nf1.format(f.p*kk)} g</b></span><span>Karbonhidrat <b>${nf1.format(f.k*kk)} g</b></span><span>Yağ <b>${nf1.format(f.y*kk)} g</b></span>`;
      document.getElementById('mG').textContent = st.bi ? `≈ ${nf0.format(gg)} ${birimOf(f)}` : ''; };
    inp.addEventListener('input', live);
    sh.querySelectorAll('[data-bi]').forEach(x => x.onclick = () => { const nb = +x.dataset.bi; if(nb === st.bi) return; const gNow = (num(inp.value) || 0) * birimler[st.bi].g;
      st.bi = nb; st.adet = nb ? (Math.round(gNow / birimler[nb].g * 2) / 2 || 1) : Math.round(gNow) || 100; draw(); });
    sh.querySelectorAll('[data-st]').forEach(x => x.onclick = () => { const step = st.bi ? 0.5 : (birimOf(f) === 'ml' ? 50 : 10); const v = Math.max(0, (num(inp.value) || 0) + step * +x.dataset.st); inp.value = String(v).replace('.', ','); live(); });
    sh.querySelectorAll('[data-mo]').forEach(x => x.onclick = () => { st.adet = inp.value; st.o = x.dataset.mo; draw(); });
    const fb = document.getElementById('mFav'); if(fb) fb.onclick = () => { H.fav = fav() ? H.fav.filter(x => x !== gkey(f)) : [gkey(f), ...H.fav]; if(f.off) ozeleKaydet(f); save(); fb.setAttribute('aria-pressed', fav()); toast(fav() ? 'Favorilere eklendi' : 'Favorilerden çıkarıldı'); };
    document.getElementById('mOk').onclick = () => {
      const adet = num(inp.value), bb = birimler[st.bi];
      if(!(adet > 0)) return toast('Miktarı yaz.'); const gg = adet * bb.g;
      if(gg > 5000) return toast('Miktar çok büyük görünüyor, kontrol et.');
      const rec = {ad: f.ad, marka: f.marka || '', tarif: f.tarif || undefined, g: r1(gg), birim: st.bi ? {ad: bb.ad, g: bb.g} : null, adet: st.bi ? adet : null, b100: {kcal: f.kcal, p: f.p, k: f.k, y: f.y}, ml: birimOf(f) === 'ml'};
      if(e.mod === 'malz'){ ekle = null; return e.onPick({ad: f.ad, g: r1(gg), b100: rec.b100}); }
      if(f.off) ozeleKaydet(f);
      if(kayit){ Object.assign(kayit, rec, {o: st.o}); }
      else { gun(e.gun).ogun.push({id: uid(), o: st.o, ...rec}); sonEkle(gkey(f)); }
      save(); ekle = null; closeSheet(); view.gun = e.gun; render();
      toast(kayit ? 'Kaydedildi' : `${ogunAd(st.o)}: ${f.ad} eklendi · ${nf0.format(f.kcal*gg/100)} kcal`); };
    const back = document.getElementById('mBack'); if(back) back.onclick = () => { if(ekle) drawEkle(); else closeSheet(); };
    const del = document.getElementById('mDel'); if(del) del.onclick = () => { if(!del.dataset.armed){ del.dataset.armed = 1; del.textContent = 'Silmek için tekrar dokun'; return; }
      const g0 = gun(view.gun); g0.ogun = g0.ogun.filter(x => x.id !== kayit.id); save(); closeSheet(); render(); toast('Silindi'); };
  };
  draw();
}

      <div class="field"><label class="label" for="oPorG">Porsiyon (g / ml)</label><input id="oPorG" class="num" inputmode="decimal" placeholder="Örn. 40"></div></div>
    ${st.barkod ? `<span class="note">Barkod: ${esc(st.barkod)} · bir dahaki okutmada bu gıda gelir.</span>` : ''}
    <button class="btn" id="oOk">Kaydet ve miktarı seç</button>`, 'Kendi gıdan');
  sh.querySelectorAll('[data-ob]').forEach(b => b.onclick = () => { st.ml = b.dataset.ob === 'ml'; sh.querySelectorAll('[data-ob]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  document.getElementById('oOk').onclick = () => {
    const v = id => document.getElementById(id).value.trim(), ad = v('oAd'), kcal = num(v('oKcal'));
    if(!ad) return toast('Gıdanın adını yaz.'); if(kcal == null || kcal < 0 || kcal > 950) return toast('100 g için kaloriyi yaz (0-950).');
    const mac = ['oP','oK','oY'].map(id => { const x = v(id); return x === '' ? 0 : num(x); });
    if(mac.some(x => x == null || x < 0 || x > 100)) return toast('Protein, karbonhidrat ve yağ 0-100 g arasında olmalı.');
    const porG = num(v('oPorG')), por = porG > 0 ? [{ad: v('oPorAd') || '1 porsiyon', g: porG}] : [];
    if(H.ozel.some(x => x.ad.toLocaleLowerCase('tr') === ad.toLocaleLowerCase('tr') && !x.off) || gByAd.has(ad)) return toast('Bu adda bir gıda zaten var, farklı bir ad ver.');
    const f = {id: uid(), ad, marka: v('oMarka'), kcal: r1(kcal), p: r1(mac[0]), k: r1(mac[1]), y: r1(mac[2]), por, barkod: st.barkod, ozel: true, ml: st.ml};
    H.ozel.unshift(f); save(); openMiktar({...f, etiket:'Kendi eklediğin'});
  };
}
/* Barkod okuyucu: telefonda varsa yerleşik okuyucu, yoksa ZXing kütüphanesi */
let scan = null;
async function startScan(){
  const box = document.createElement('div'); box.id = 'scan';
  box.innerHTML = `<div style="position:relative;overflow:hidden"><video playsinline muted autoplay></video><div class="frame"></div></div>
    <div class="bar"><b>Barkodu çerçevenin içine getir</b><div class="two"><input id="scCode" class="num" inputmode="numeric" placeholder="ya da barkod numarasını yaz" aria-label="Barkod numarası"><button class="btn" id="scGo">Bul</button></div><button class="btn ghost" id="scClose">Kapat</button></div>`;
  document.body.appendChild(box);
  const video = box.querySelector('video'); scan = {box, stream:null, timer:null, reader:null, done:false};
  document.getElementById('scClose').onclick = stopScan;
  document.getElementById('scGo').onclick = () => { const c = document.getElementById('scCode').value.replace(/\D/g, ''); if(c.length < 8) return toast('Barkod en az 8 haneli olmalı.'); found(c); };
  const found = async code => { if(!scan || scan.done) return; scan.done = true; stopScan(); toast('Ürün aranıyor…');
    const yerel = H.ozel.find(x => x.barkod === code); if(yerel) return openMiktar({...yerel, etiket: yerel.off ? (yerel.marka || 'Hazır ürün') : 'Kendi eklediğin'});
    try { const f = await barkodGida(code); if(f) return openMiktar(f); toast('Bu barkod veritabanında yok. Paketteki değerlerle ekleyebilirsin.'); openOzel({barkod: code}); }
    catch(e){ toast(navigator.onLine === false ? 'İnternet yok. Barkod için bağlantı gerekir.' : 'Ürün şu an aranamadı.'); } };
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('Bu cihazda kamera açılamıyor, numarayı yazabilirsin.'); return; }
  try {
    if('BarcodeDetector' in window){
      const det = new BarcodeDetector({formats: ['ean_13','ean_8','upc_a','upc_e']});
      scan.stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}, audio: false});
      if(!scan) return scan?.stream?.getTracks().forEach(t => t.stop());
      video.srcObject = scan.stream; await video.play();
      const loop = async () => { if(!scan || scan.done) return; try { const r = await det.detect(video); if(r && r[0]) return found(r[0].rawValue); } catch(e){} scan.timer = setTimeout(loop, 180); };
      loop();
    } else {
      if(!window.ZXing) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
      if(!scan) return;
      const hints = new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E]);
      scan.reader = new ZXing.BrowserMultiFormatReader(hints);
      await scan.reader.decodeFromConstraints({video: {facingMode: 'environment'}, audio: false}, video, (res) => { if(res) found(res.getText()); });
    }
  } catch(e){ toast(e && e.name === 'NotAllowedError' ? 'Kamera izni verilmedi. Barkod numarasını yazabilirsin.' : 'Kamera açılamadı. Barkod numarasını yazabilirsin.'); }
}
function stopScan(){ if(!scan) return; clearTimeout(scan.timer); try { scan.reader && scan.reader.reset(); } catch(e){} try { scan.stream && scan.stream.getTracks().forEach(t => t.stop()); } catch(e){} const v = scan.box.querySelector('video'); try { v.srcObject && v.srcObject.getTracks().forEach(t => t.stop()); } catch(e){} scan.box.remove(); scan = null; }

/* Kilo ekle / düzenle */
function openKilo(t0){
  const ex = t0 ? H.kilolar.find(k => k.t === t0) : null;
  openSheet(`${head(ex ? 'Ölçümü düzenle' : 'Kilo ekle')}
    <div class="field"><label class="label" for="kKg">Kilo (kg)</label><input id="kKg" class="num amount-in" inputmode="decimal" autocomplete="off" placeholder="Örn. 68,4" value="${ex ? String(ex.kg).replace('.', ',') : ''}"></div>
    <div class="field"><label class="label" for="kT">Tarih</label><input id="kT" type="date" max="${todayISO}" value="${ex ? ex.t : todayISO}"></div>
    <span class="note">Aynı güne ikinci ölçüm girersen eskisinin yerine geçer.</span>
    <button class="btn" id="kOk">Kaydet</button>${ex ? '<button class="btn ghost" id="kDel" style="color:var(--out)">Sil</button>' : ''}`, 'Kilo');
  setTimeout(() => document.getElementById('kKg')?.focus(), 80);
  document.getElementById('kOk').onclick = () => { const kg = num(document.getElementById('kKg').value), t = document.getElementById('kT').value;
    if(kg == null || kg < 20 || kg > 400) return toast('Kiloyu 20-400 kg arasında yaz.'); if(!/^\d{4}-\d{2}-\d{2}$/.test(t)) return toast('Tarihi seç.'); if(t > todayISO) return toast('İleri bir tarih seçilemez.');
    H.kilolar = H.kilolar.filter(k => k.t !== t && (!ex || k.t !== ex.t)); H.kilolar.push({t, kg: r1(kg)}); save(); closeSheet(); render(); toast('Kilo kaydedildi'); };
  const d = document.getElementById('kDel'); if(d) d.onclick = () => { if(!d.dataset.armed){ d.dataset.armed = 1; d.textContent = 'Silmek için tekrar dokun'; return; } H.kilolar = H.kilolar.filter(k => k.t !== ex.t); save(); closeSheet(); render(); toast('Silindi'); };
}
/* Tarif ayrıntısı ve düzenleyici */
function openTarif(id){
  const t = tumTarifler().find(x => x.id === id); if(!t) return;
  const s = tarifBesin(t), por = t.porsiyon || 1, st = {adet: 1, o: ogunSimdi()};
  const draw = () => { const sh = openSheet(`${head(t.ad)}
    <div class="stat3"><div><small>Porsiyon başı</small><b>${nf0.format(s.kcal/por)} kcal</b></div><div><small>Protein</small><b>${nf0.format(s.p/por)} g</b></div><div><small>${t.sure ? 'Süre' : 'Porsiyon'}</small><b>${t.sure ? t.sure + ' dk' : por}</b></div></div>
    <div class="note">${por} porsiyon · tamamı ${nf0.format(s.kcal)} kcal · karbonhidrat ${nf0.format(s.k/por)} g, yağ ${nf0.format(s.y/por)} g (porsiyon başı)</div>
    <div class="card"><div class="label" style="margin-bottom:6px">Malzemeler</div>${tarifMalz(t).map(m => `<div class="ing"><span>${esc(m.ad)}</span><span class="num" style="color:var(--muted)">${nf0.format(m.g)} g · ${nf0.format(m.b100.kcal*m.g/100)} kcal</span></div>`).join('')}</div>
    ${t.adimlar ? `<div class="card"><div class="label" style="margin-bottom:8px">Yapılışı</div><ol class="steps">${t.adimlar.split('\n').filter(x => x.trim()).map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>` : ''}
    <div class="card" style="display:grid;gap:10px"><div class="label">Öğüne ekle</div>
      <div class="chips">${OGUNLER.map(([o, a]) => `<button class="chip" data-to="${o}" aria-pressed="${st.o===o}">${a}</button>`).join('')}</div>
      <div class="chips">${[0.5,1,1.5,2].map(v => `<button class="chip" data-tp="${v}" aria-pressed="${st.adet===v}">${nf1.format(v)} porsiyon</button>`).join('')}</div>
      <button class="btn" id="tAdd">${ogunAd(st.o)}'a ekle · ${nf0.format(s.kcal/por*st.adet)} kcal</button></div>
    ${t.kendi ? `<div class="btns"><button class="btn ghost" id="tEdit" style="flex:1">Düzenle</button><button class="btn ghost" id="tDel" style="flex:1;color:var(--out)">Sil</button></div>` : `<button class="btn ghost" id="tCopy">Kopyala ve kendine göre düzenle</button>`}`, 'Tarif');
    sh.querySelectorAll('[data-to]').forEach(b => b.onclick = () => { st.o = b.dataset.to; draw(); });
    sh.querySelectorAll('[data-tp]').forEach(b => b.onclick = () => { st.adet = +b.dataset.tp; draw(); });
    document.getElementById('tAdd').onclick = () => { const f = tarifGida(t), g = f.por[0].g * st.adet;
      gun(todayISO).ogun.push({id: uid(), o: st.o, ad: t.ad, marka: '', tarif: t.id, g: r1(g), birim: {ad: '1 porsiyon', g: f.por[0].g}, adet: st.adet, b100: {kcal: f.kcal, p: f.p, k: f.k, y: f.y}}); sonEkle('t:' + t.id);
      save(); closeSheet(); view.tab = 'bugun'; view.gun = todayISO; render(); toast(`${ogunAd(st.o)}: ${t.ad} eklendi`); };
    const ed = document.getElementById('tEdit'); if(ed) ed.onclick = () => openTarifEdit(H.tarifler.find(x => x.id === t.id));
    const cp = document.getElementById('tCopy'); if(cp) cp.onclick = () => openTarifEdit(null, {ad: t.ad + ' (benim)', porsiyon: por, sure: t.sure || '', em: t.em, adimlar: t.adimlar || '', malz: tarifMalz(t)});
    const dl = document.getElementById('tDel'); if(dl) dl.onclick = () => { if(!dl.dataset.armed){ dl.dataset.armed = 1; dl.textContent = 'Silmek için tekrar dokun'; return; } H.tarifler = H.tarifler.filter(x => x.id !== t.id); save(); closeSheet(); render(); toast('Tarif silindi'); };
  };
  draw();
}
let taslak = null;
function openTarifEdit(t, kopya){
  if(!taslak || taslak.kaynak !== (t ? t.id : 'yeni')) taslak = t ? {kaynak: t.id, ...JSON.parse(JSON.stringify(t))} : {kaynak: 'yeni', ad:'', porsiyon: 2, sure:'', em:'🍽️', adimlar:'', malz: [], ...(kopya ? JSON.parse(JSON.stringify(kopya)) : {})};
  const d = taslak, s = tarifBesin(d), por = +d.porsiyon || 1;
  const sh = openSheet(`${head(t ? 'Tarifi düzenle' : 'Yeni tarif')}
    <div class="field"><label class="label" for="eAd">Tarifin adı</label><input id="eAd" maxlength="50" value="${esc(d.ad)}" placeholder="Örn. Annemin mercimek köftesi"></div>
    <div class="two"><div class="field"><label class="label" for="ePor">Kaç porsiyon?</label><input id="ePor" class="num" type="number" inputmode="numeric" min="1" max="30" value="${esc(d.porsiyon)}"></div>
      <div class="field"><label class="label" for="eSure">Süre (dk, isteğe bağlı)</label><input id="eSure" class="num" type="number" inputmode="numeric" min="1" max="600" value="${esc(d.sure)}"></div></div>
    <div class="card" style="display:grid;gap:4px"><div class="sec-head" style="margin:0"><span class="label">Malzemeler</span><small class="num">${d.malz.length ? `porsiyon başı ${nf0.format(s.kcal/por)} kcal` : ''}</small></div>
      ${d.malz.map((m, i) => `<div class="ing"><span>${esc(m.ad)} <small style="color:var(--muted)">${nf0.format(m.g)} g</small></span><span><span class="num" style="color:var(--muted)">${nf0.format(m.b100.kcal*m.g/100)} kcal</span> <button class="chip" data-rm="${i}" aria-label="${esc(m.ad)} malzemesini çıkar" style="min-height:36px;padding:4px 10px">✕</button></span></div>`).join('') || '<span class="note">Henüz malzeme yok.</span>'}
      <button class="btn ghost" id="eMalz" style="margin-top:8px">+ Malzeme ekle</button>
      <span class="note">Malzemeleri çiğ/pişmemiş hâliyle ve gram olarak gir. Yağı ve şekeri unutma, kalorinin büyük kısmı onlardan gelir.</span></div>
    <div class="field"><label class="label" for="eAdim">Yapılışı (her adım ayrı satır)</label><textarea id="eAdim" rows="5" placeholder="1. adım&#10;2. adım">${esc(d.adimlar)}</textarea></div>
    <button class="btn" id="eOk">Tarifi kaydet</button>`, 'Tarif düzenle');
  const keep = () => { d.ad = document.getElementById('eAd').value; d.porsiyon = document.getElementById('ePor').value; d.sure = document.getElementById('eSure').value; d.adimlar = document.getElementById('eAdim').value; };
  sh.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { keep(); d.malz.splice(+b.dataset.rm, 1); openTarifEdit(t); });
  document.getElementById('eMalz').onclick = () => { keep(); openEkle({mod: 'malz', onPick: m => { d.malz.push(m); openTarifEdit(t); }}); };
  sh.querySelector('[data-close]').onclick = () => { taslak = null; closeSheetAnimated(); };
  document.getElementById('eOk').onclick = () => { keep(); const ad = d.ad.trim(), p = parseInt(d.porsiyon, 10), su = d.sure === '' ? '' : parseInt(d.sure, 10);
    if(!ad) return toast('Tarife bir ad ver.'); if(!(p >= 1 && p <= 30)) return toast('Porsiyon 1-30 arasında olmalı.'); if(su !== '' && !(su >= 1 && su <= 600)) return toast('Süreyi dakika olarak yaz.');
    if(!d.malz.length) return toast('En az bir malzeme ekle.');
    const rec = {id: t ? t.id : uid(), ad, porsiyon: p, sure: su, em: d.em || '🍽️', adimlar: d.adimlar.trim(), malz: d.malz};
    if(t){ const i = H.tarifler.findIndex(x => x.id === t.id); H.tarifler[i] = rec; } else H.tarifler.unshift(rec);
    taslak = null; save(); closeSheet(); view.tab = 'tarif'; render(); openTarif(rec.id); toast('Tarif kaydedildi'); };
}
