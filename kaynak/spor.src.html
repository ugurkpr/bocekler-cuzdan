<title>Böcekler · Spor</title>

<style>
/*BANKCSS*/
/* ---- Spor bölümüne özel ---- */
nav.tabs .in{grid-template-columns:repeat(4,minmax(0,1fr))}
.ringrow{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--accent-ink) calc(var(--p)*1%), color-mix(in srgb,var(--accent-ink) 14%,transparent) 0);display:grid;place-items:center}
.ring > div{width:88px;height:88px;border-radius:50%;background:color-mix(in srgb,#fff 55%,transparent);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-family:var(--display);font-size:26px;display:block}
.ring small{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
.kinfo{display:grid;gap:8px;font-size:14px}
.kinfo .r{display:flex;justify-content:space-between;gap:8px}
.kinfo .r b{font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;font-weight:600}
.days span{display:grid;gap:3px;justify-items:center;opacity:.8}
.days i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:color-mix(in srgb,var(--accent-ink) 12%,transparent);font-size:13px}
.days i.on{background:var(--accent-ink);color:var(--accent)}
.days span.bugun{opacity:1}
.cta{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;padding:14px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink)}
.cta .em{font-size:30px}
.cta b{display:block;font-family:var(--display);font-size:17px}
.cta small{color:var(--muted);font-size:13px}
.prog{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.prog .em{width:48px;height:48px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;font-size:24px}
.exgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.exc{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0 0 10px;overflow:hidden;text-align:left;display:grid;gap:4px}
.exc img{width:100%;aspect-ratio:1;object-fit:cover;background:#F6F0E4;display:block}
.exc b{padding:0 10px;font-size:14px;line-height:1.25}
.exc small{padding:0 10px;color:var(--muted);font-size:12px}
.lvl{letter-spacing:1px;color:var(--accent-text)}
.anim{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:440/484;border-radius:20px;overflow:hidden;background:#F6F0E4}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .25s}
.anim img.b{opacity:0}
.anim.on img.b{opacity:1}
.anim.on img.a{opacity:0}
.cues{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14.5px}
.vari{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vari div{background:var(--sunk);border-radius:12px;padding:10px;font-size:13px;display:grid;gap:2px}
.vari b{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.plan .item small{display:block}
.thumb{flex:none;width:52px;height:52px;border-radius:12px;object-fit:cover;background:#F6F0E4}
.hrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px 4px}
.hrow::-webkit-scrollbar{display:none}
.hrow .chip{flex:none}
.wk{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.wk button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;font-weight:600}
.wk button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.segbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.segbar i{display:block;height:100%}
.t-yavas{background:#9BC7A8}.t-rahat{background:#5FB27C}.t-tempolu{background:#F0A23A}.t-hizli{background:#E5484D}
/* oynatıcı */
#oyn{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px))}
#oyn .ust{display:flex;align-items:center;justify-content:space-between;gap:8px}
#oyn .ust small{color:var(--muted);font-weight:600}
#oyn .orta{display:grid;align-content:center;justify-items:center;gap:10px;text-align:center;min-height:0}
#oyn .anim{max-width:min(320px,42vh)}
#oyn .faz{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
#oyn .faz.din{background:var(--sunk);color:var(--ink)}
#oyn h2{font-size:26px}
#oyn .sayac{font-family:var(--display);font-size:min(22vw,110px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#oyn .ipu{color:var(--muted);font-size:14.5px;max-width:420px}
#oyn .sira{font-size:14px;color:var(--muted)}
#oyn .pbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;width:100%}
#oyn .pbar i{display:block;height:100%;background:var(--accent)}
#oyn .alt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#oyn .alt button{min-height:56px;border-radius:16px;border:0;font-size:22px;background:var(--sunk);color:var(--ink)}
#oyn .alt button.ana{background:var(--accent);color:var(--accent-ink)}
.uyari{background:var(--accent-soft);border-color:transparent;display:grid;gap:8px}
</style>
<script src="ortak.js"></script>
<script src="spor-veri.js"></script>
</head>

<div class="wrap">
  <header class="top">
    <a class="brand home" href="./" aria-label="Böcekler bölüm geçişi"><span class="homei" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></span><span>Böcekler<small>Spor</small></span></a>

  <button class="tab" data-tab="antrenman"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Antrenman</button>
  <button class="tab" data-tab="hareket"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="4.5" r="2"/><path d="M8 21l3-6 3 2v4M11 15l-1-5 4-1 3 4h3M10 10L6 12"/></svg>Hareketler</button>
  <button class="tab" data-tab="yuruyus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21l2-7M14 21l-1-5-3-2 1-5 4 3 3 1M10 9l-3 3"/><circle cx="12" cy="4" r="2"/></svg>Yürüyüş</button>
</div></nav>
<button class="fab" id="addBtn" aria-label="Aktivite ekle">+</button>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(() => {
const APP_VERSION = '1.1 · 13 Ekim 2026';
const KEY = 'bocekler-spor-v1';
const mode = 'local';
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const bugun = () => isoOf(new Date());   // uygulama gece yarısını geçerek açık kalabilir; her seferinde yeniden hesaplanır
const addDays = (iso, n) => { const d = new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return isoOf(d); };
const dayLabel = (iso, opt={day:'numeric',month:'long',weekday:'long'}) => new Date(iso+'T12:00').toLocaleDateString('tr-TR', opt);
const nf0 = new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0}), nf2 = new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const num = v => { const n = parseFloat(String(v??'').trim().replace(',','.')); return isFinite(n) ? n : null; };
let toastT; function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
const HR = window.HAREKETLER, HB = new Map(HR.map(h => [h.id, h])), PR = window.PROGRAMLAR, HD = window.SPOR_HEDEF, YP = window.YURUYUS_PLAN, YT = window.YURUYUS_TEMPO;
const img = (id, s) => `spor/${id}-${s}.webp`;
const sureYazi = sn => sn >= 60 ? `${Math.floor(sn/60)} dk${sn%60 ? ' ' + (sn%60) + ' sn' : ''}` : `${sn} sn`;
const tarafli = h => /Her (bacak|taraf)/.test(h.tk || '');

/* ---------- veri ---------- */
const blank = () => ({seanslar:[], ayar:{ekle:0.5, hedefDk:150, ses:true, uyariOk:false}, yHafta:1, secim:{hedef:'', sure:20, sev:1, zipla:true, esyasiz:false}, favori:[]});
function clean(d){
  const b = blank(), o = x => x && typeof x === 'object' && !Array.isArray(x), ayar = {...b.ayar, ...(o(d.ayar) ? d.ayar : {})}, sec = {...b.secim, ...(o(d.secim) ? d.secim : {})};
  ayar.ekle = [0, 0.5, 1].includes(+ayar.ekle) ? +ayar.ekle : 0.5; ayar.hedefDk = +ayar.hedefDk > 0 ? +ayar.hedefDk : 150; ayar.ses = ayar.ses !== false; ayar.uyariOk = !!ayar.uyariOk;
  if(!HD.some(x => x.id === sec.hedef)) sec.hedef = ''; sec.sure = [10,20,30].includes(+sec.sure) ? +sec.sure : 20; sec.sev = [1,2,3].includes(+sec.sev) ? +sec.sev : 1; sec.zipla = sec.zipla !== false; sec.esyasiz = !!sec.esyasiz;
  const seanslar = (Array.isArray(d.seanslar) ? d.seanslar : []).filter(s => o(s) && /^\d{4}-\d{2}-\d{2}$/.test(s.t) && isFinite(+s.dk) && +s.dk > 0)
    .map(s => ({...s, ad: String(s.ad || 'Aktivite').slice(0, 80), dk: Math.round(+s.dk), kcal: Math.max(0, Math.round(+s.kcal || 0)), km: +s.km > 0 ? +s.km : undefined, zorluk: [1,2,3,4,5].includes(+s.zorluk) ? +s.zorluk : undefined, gruplar: Array.isArray(s.gruplar) ? s.gruplar.filter(g => typeof g === 'string') : [], yogun: !!s.yogun}));
  const favori = (Array.isArray(d.favori) ? d.favori : []).map(progTemiz).filter(Boolean).slice(0, 10);
  seanslar.forEach(s => { if(s.prog !== undefined){ const p = progTemiz(s.prog); if(p) s.prog = p; else delete s.prog; } });
  return {seanslar, ayar, yHafta: Math.min(8, Math.max(1, Math.round(+d.yHafta) || 1)), secim: sec, favori};
}
// kayıtlı program (favori / son antrenman): bilinmeyen hareket ya da bozuk sayı varsa atılır
function progTemiz(p){
  if(!p || typeof p !== 'object' || Array.isArray(p)) return null;
  const ids = x => x === undefined ? [] : Array.isArray(x) && x.every(i => HB.has(i)) ? x.slice() : null, sn = (x, a, b, v) => isFinite(+x) ? Math.min(b, Math.max(a, Math.round(+x))) : v;
  const liste = ids(p.liste), isinma = ids(p.isinma), sogu = ids(p.sogu); if(!liste || !liste.length || !isinma || !sogu) return null;
  return {ad: String(p.ad || 'Antrenman').slice(0, 80), hedef: p.hedef, sev: [1,2,3].includes(+p.sev) ? +p.sev : 2, liste, isinma, sogu, tur: sn(p.tur, 1, 10, 1), is: sn(p.is, 5, 600, 40), din: sn(p.din, 0, 600, 15), turArasi: sn(p.turArasi, 0, 600, 0), isinSn: sn(p.isinSn, 5, 600, 30), soguSn: sn(p.soguSn, 5, 600, 40), uretildi: !!p.uretildi};
}
let okumaHatasi = false;
let S = (() => { try { const raw = localStorage.getItem(KEY); if(!raw) return blank(); const d = JSON.parse(raw); if(d && typeof d === 'object') return clean(d); } catch(e){ okumaHatasi = true; } return blank(); })();
// Sağlık'taki kilo ve hedef: kalori hesabı ve varsayılan hedef için (her çizimde bir kez okunur)
const saglik = () => { try { return JSON.parse(localStorage.getItem('bocekler-saglik-v1') || 'null') || {}; } catch(e){ return {}; } };
let KG = 70;
const kiloOku = () => { const k = (saglik().kilolar || []).filter(x => isFinite(+x.kg)).slice().sort((a,b) => String(a.t).localeCompare(String(b.t))); KG = k.length ? +k[k.length-1].kg : 70; return KG; };
// Net kalori (dinlenme harcaması çıkarılmış): (MET − 1) × 3,5 × kg / 200 × dakika
const kcalOf = (met, sn, kg = KG) => Math.max(0, (met - 1) * 3.5 * kg / 200 * sn / 60);
const haftaBasi = iso => { const d = new Date(iso+'T12:00'), g = (d.getDay()+6)%7; return addDays(iso, -g); };
function haftaOzet(iso = bugun()){ const b = haftaBasi(iso), e = addDays(b, 6), ss = S.seanslar.filter(s => s.t >= b && s.t <= e);
  const dk = ss.reduce((a, s) => a + s.dk * (s.yogun ? 2 : 1), 0), guc = new Set(ss.filter(s => (s.gruplar || []).some(g => ['alt','ust','core'].includes(g))).map(s => s.t)).size;
  return {b, ss, dk: Math.round(dk), guc, gunler: new Set(ss.map(s => s.t))}; }
function snapYaz(){
  const h = haftaOzet(), t = bugun(), kcal = Math.round(S.seanslar.filter(s => s.t === t).reduce((a, s) => a + (s.kcal || 0), 0));
  Bocekler.snap('spor', {dk: h.dk, hedef: S.ayar.hedefDk, bugun: kcal});
  // ana ekrandaki Sağlık kutucuğunun hedefi de egzersize göre güncellensin
  const sg = Bocekler.snaps().saglik; if(sg && sg.hedefTaban != null && new Date(sg.at).toDateString() === new Date().toDateString()) Bocekler.snap('saglik', {...sg, hedef: sg.hedefTaban + Math.round(kcal * S.ayar.ekle)});
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); okumaHatasi = false; } catch(e){ toast('Kayıt yapılamadı.'); } snapYaz(); }
const varsayilanHedef = () => { const p = (saglik().profil || {}); return p.hedef === 'ver' ? 'yag' : p.hedef === 'al' ? 'guc' : 'kardiyo'; };
const secim = () => ({...S.secim, hedef: S.secim.hedef || varsayilanHedef()});
const hedefOf = id => HD.find(x => x.id === id) || HD[0];

/* ---------- hedefe göre antrenman üretici ---------- */
let tohum = Date.now() % 100000;
const rnd = () => { tohum = (tohum * 9301 + 49297) % 233280; return tohum / 233280; };
function uygun(h, sec, hd){ return (sec.zipla || !h.zipla) && (!sec.esyasiz || !h.ek || h.ek === 'mat' || h.ek === 'duvar') && (sec.sev !== 1 || h.z < 3) && (!hd.sakin || (h.met < 3.5 && h.z === 1)); }
function uret(sec){
  const hd = hedefOf(sec.hedef), dun = new Set(S.seanslar.filter(s => s.t === addDays(bugun(), -1)).flatMap(s => s.gruplar || []));
  // seviye: başlangıçta daha kısa çalışma, daha uzun dinlenme; ileride tersi
  const is = Math.max(20, hd.is + (sec.sev === 1 ? -10 : sec.sev === 3 ? 10 : 0)), din = Math.max(10, hd.din + (sec.sev === 1 ? 10 : sec.sev === 3 ? -5 : 0));
  const isin = sec.sure >= 20 ? ['yerinde-yuruyus','kol-cevirme','kalca-cevirme','bacak-sallama'] : ['yerinde-yuruyus','kol-cevirme'];
  const sogu = sec.sure >= 20 ? (sec.esyasiz ? ['kedi-inek','cocuk-pozu','kalca-esneme'] : ['kedi-inek','hamstring','kalca-esneme']) : ['kedi-inek','hamstring'];
  const isinSn = isin.length * 30 + (sec.sure >= 20 ? 30 : 0), soguSn = sogu.length * 40;
  const havuz = HR.filter(h => (hd.agirlik[h.g] || 0) > 0 && !isin.includes(h.id) && !sogu.includes(h.id) && uygun(h, sec, hd));
  const agr = h => (hd.agirlik[h.g] || 0) * (dun.has(h.g) && ['alt','ust','core'].includes(h.g) ? 0.5 : 1) * (sec.sev === 1 && h.z === 2 ? 0.6 : sec.sev === 3 ? (h.z === 3 ? 1.5 : h.z === 1 ? 0.6 : 1) : 1);
  const blokSn = Math.max(150, sec.sure * 60 - isinSn - soguSn), sakin = !!hd.sakin;
  let adet = sakin ? Math.max(3, Math.min(havuz.length, Math.round(blokSn / (is + din)))) : Math.min(8, Math.max(4, Math.round(blokSn / (is + din) / 3)));
  const sec2 = [], kalan = havuz.slice();
  while(sec2.length < adet && kalan.length){ const w = kalan.map(agr), t = w.reduce((a, b) => a + b, 0); if(!t) break; let r = rnd() * t, i = 0; for(; i < w.length; i++){ r -= w[i]; if(r <= 0) break; } sec2.push(kalan.splice(Math.min(i, kalan.length-1), 1)[0].id); }
  adet = sec2.length || 1;
  const turSn = adet * is + (adet - 1) * din, turArasi = sakin ? 15 : 45, tur = Math.max(1, Math.round((blokSn + turArasi) / (turSn + turArasi)));
  return {ad: `${hd.em} ${hd.ad} · ${sec.sure} dk`, hedef: hd.id, sev: sec.sev, is, din, tur, turArasi: tur > 1 ? turArasi : 0, isinma: isin, liste: sec2, sogu, isinSn: 30, soguSn: 40, uretildi: true};
}
// Programdan adım listesi: hazırlan / çalış / dinlen. Bölüm geçişlerinde (yere inme vb.) kısa "hazırlan" eklenir.
function adimlar(p){
  const out = [], push = (tip, id, sn, ek) => { if(sn > 0) out.push({tip, id, sn, ...ek}); };
  (p.isinma || []).forEach((id, i) => push('is', id, id === 'yerinde-yuruyus' && p.uretildi && p.isinma.length > 2 ? 60 : (p.isinSn || 30), {bolum:'Isınma'}));
  for(let t = 1; t <= (p.tur || 1); t++){
    p.liste.forEach((id, i) => { if(i === 0 && t === 1) push('hazir', id, 10, {});
      push('is', id, p.is, {bolum: (p.tur || 1) > 1 ? `Tur ${t}/${p.tur}` : 'Antrenman'});
      const son = i === p.liste.length - 1; if(!son && p.din) push('din', p.liste[i+1], p.din, {}); else if(son && t < (p.tur || 1)) push('din', p.liste[0], p.turArasi || Math.max(p.din, 30), {turArasi:true}); });
  }
  (p.sogu || []).forEach((id, i) => { if(i === 0) push('hazir', id, 8, {}); push('is', id, p.soguSn || 40, {bolum:'Soğuma'}); });
  return out;
}
const progSure = p => adimlar(p).reduce((a, s) => a + s.sn, 0);
const progKcal = p => adimlar(p).reduce((a, s) => a + (s.tip === 'is' ? kcalOf((HB.get(s.id) || {met:3}).met, s.sn) : 0), 0);
const progZipla = p => [...(p.isinma || []), ...p.liste, ...(p.sogu || [])].some(i => (HB.get(i) || {}).zipla);

/* ---------- görünüm ---------- */
let view = {tab: ['bugun','antrenman','hareket','yuruyus'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'bugun', grup: '', uretilen: null};
const main = document.getElementById('main'), sheetRoot = document.getElementById('sheetRoot');
function render(){
  Bocekler.applyTheme(); kiloOku();
  document.querySelectorAll('nav .tab').forEach(b => { if(b.dataset.tab === view.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  main.innerHTML = view.tab === 'bugun' ? rBugun() : view.tab === 'antrenman' ? rAntrenman() : view.tab === 'hareket' ? rHareket() : rYuruyus();
  document.getElementById('addBtn').hidden = view.tab !== 'bugun';
  maybeTips(currentTipKey());
}
const seviyeAd = v => ['','Başlangıç','Orta','İleri'][v] || '';
function rBugun(){
  const t = bugun(), h = haftaOzet(t), p = Math.min(100, h.dk / S.ayar.hedefDk * 100), gunAd = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  const bugunS = S.seanslar.filter(s => s.t === t), bugunKcal = bugunS.reduce((a, s) => a + (s.kcal || 0), 0);
  const sec = secim(), hd = hedefOf(sec.hedef), yp = YP[S.yHafta - 1];
  const dun = S.seanslar.filter(s => s.t === addDays(t, -1)).flatMap(s => s.gruplar || []);

/* ---------- ses, ekran kilidi, geri tuşu ---------- */
let wake = null, wakeIstek = null, actx = null;
async function ekranAcik(on){

  try {
    if(on){ if(wake || wakeIstek) return; wakeIstek = navigator.wakeLock.request('screen'); const w = await wakeIstek; wakeIstek = null;
      if(!document.getElementById('oyn')){ w.release().catch(() => {}); return; } wake = w; wake.addEventListener('release', () => { wake = null; }); }
    else { if(wakeIstek){ const w = await wakeIstek.catch(() => null); wakeIstek = null; if(w) w.release().catch(() => {}); } if(wake){ const w = wake; wake = null; await w.release(); } }
  } catch(e){ wakeIstek = null; }
}
document.addEventListener('visibilitychange', () => { if(!document.hidden && document.getElementById('oyn')){ ekranAcik(true); try { speechSynthesis.resume(); } catch(e){} try { actx && actx.state !== 'running' && actx.resume(); } catch(e){} } });
const sesVar = () => S.ayar.ses && 'speechSynthesis' in window;
function soyle(t){ if(!sesVar() || !t) return; try { if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); speechSynthesis.resume(); const u = new SpeechSynthesisUtterance(t); u.lang = 'tr-TR'; const v = speechSynthesis.getVoices().find(x => /^tr/i.test(x.lang)); if(v) u.voice = v; u.rate = 1.02; speechSynthesis.speak(u); } catch(e){} }

function bip(yuksek){ if(!S.ayar.ses) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state !== 'running') actx.resume(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = yuksek ? 1046 : 660; g.gain.setValueAtTime(0.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (yuksek ? 0.35 : 0.15)); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.4); } catch(e){} }

/* ---------- antrenman oynatıcı ---------- */
let O = null;   // {p, adim, i, kalan, son, dur, aktifMs, isMs, kcal, bitirOnay}
function oynat(p){
  const adm = adimlar(p); if(!adm.length) return; kiloOku();
  O = {p, adim: adm, i: 0, kalan: adm[0].sn * 1000, son: Date.now(), dur: false, aktifMs: 0, isMs: 0, kcal: 0, bitirOnay: 0, kg: KG, yap: {}};
  oynaticiAc('Antrenman'); adimBasla(); O.tik = setInterval(tik, 200);
}
function adimBasla(sessiz, koru){
  const a = O.adim[O.i], h = HB.get(a.id), sonraki = O.adim.slice(O.i + 1).find(x => x.tip === 'is');
  if(!koru){ O.kalan = a.sn * 1000; O.son = Date.now(); } O.yari = false; O.sayac = -1;
  const box = document.getElementById('oyn'), toplam = O.adim.length, faz = a.tip === 'is' ? 'Çalış' : a.tip === 'hazir' ? 'Hazırlan' : a.turArasi ? 'Tur arası' : 'Dinlen';
  box.innerHTML = `<div class="ust"><button class="icon-btn" data-o="bitir">✕ Bitir</button><small>${O.i + 1} / ${toplam}${a.bolum ? ' · ' + esc(a.bolum) : ''}</small><button class="icon-btn" data-o="ses" aria-label="${S.ayar.ses ? 'Sesi kapat' : 'Sesi aç'}">${S.ayar.ses ? '🔊' : '🔇'}</button></div>
    <div class="orta"><div class="pbar"><i style="width:${(O.i / toplam * 100).toFixed(1)}%"></i></div>${animHTML(h)}<span class="faz ${a.tip === 'is' ? '' : 'din'}">${faz}</span>
      <h2>${a.tip === 'din' ? 'Sıradaki: ' + esc(h.ad) : esc(h.ad)}</h2>${a.tip === 'is' && h.tk ? `<div class="sira">≈ ${esc(h.tk)}${tarafli(h) ? ' · yarısında taraf değiştir' : ''}</div>` : ''}<div class="sayac" id="oSay" aria-live="off">${Math.ceil(a.sn)}</div>
      <div class="ipu">${esc(a.tip === 'is' ? h.ip[0] + ' · ' + h.ip[2] : h.ip.slice(0, 2).join(' · '))}</div>
      ${sonraki && a.tip === 'is' ? `<div class="sira">Sonra: ${esc(HB.get(sonraki.id).ad)}</div>` : ''}</div>
    <div class="alt"><button data-o="geri" aria-label="Önceki hareket">⏮</button><button class="ana" data-o="dur" aria-label="${O.dur ? 'Devam et' : 'Duraklat'}">${O.dur ? '▶' : '⏸'}</button><button data-o="atla" aria-label="Sonraki">⏭</button></div>`;
  box.querySelectorAll('[data-o]').forEach(b => b.onclick = () => kontrol(b.dataset.o));
  const an = box.querySelector('.anim'); clearInterval(animT);
  if(a.tip === 'is' && !O.dur) animBaslat(box); else if(an) an.classList.toggle('on', !!h.statik);
  if(!sessiz && !O.dur) soyle(a.tip === 'is' ? `${h.ad}. Başla!` : a.tip === 'hazir' ? `Hazırlan. ${h.ad}` : a.turArasi ? `Tur bitti. Biraz dinlen. Sıradaki ${h.ad}` : `Dinlen. Sıradaki ${h.ad}`);
}
// Geçen süre gerçek zamanla sayılır: ekran kilitlenip geri gelince taşan süre sonraki adımlara aktarılır
function tik(){
  if(!O || O.dur) return; const now = Date.now(); let d = now - O.son; O.son = now; if(d <= 0) return;
  O.aktifMs += d; const ilk = O.i;
  while(d > 0 && O){ const a = O.adim[O.i], kullan = Math.min(d, Math.max(0, O.kalan));
    if(a.tip === 'is'){ O.isMs += kullan; O.kcal += kcalOf(HB.get(a.id).met, kullan / 1000, O.kg); O.yap[a.id] = (O.yap[a.id] || 0) + kullan; }
    O.kalan -= kullan; d -= kullan;
    if(O.kalan <= 0){ if(O.i >= O.adim.length - 1){ bip(true); return bitir(true); } O.i++; O.kalan = O.adim[O.i].sn * 1000; if(d <= 0){ bip(true); adimBasla(); return; } }
    else break;
  }
  if(O.i !== ilk){ bip(true); adimBasla(false, true); return; }
  const a = O.adim[O.i], h = HB.get(a.id), sn = Math.max(0, Math.ceil(O.kalan / 1000)), el = document.getElementById('oSay'); if(el) el.textContent = sn;
  if(a.tip === 'is' && a.sn >= 30 && !O.yari && O.kalan <= a.sn * 500){ O.yari = true; soyle(tarafli(h) ? 'Taraf değiştir' : 'Yarısı bitti'); }
  if(sn <= 3 && sn > 0 && O.sayac !== sn){ O.sayac = sn; bip(false); }
}
function kontrol(k){
  if(!O) return;
  if(k !== 'bitir') O.bitirOnay = 0;
  if(k === 'dur'){ O.dur = !O.dur; O.son = Date.now(); const b = document.querySelector('#oyn [data-o="dur"]'); if(b){ b.textContent = O.dur ? '▶' : '⏸'; b.setAttribute('aria-label', O.dur ? 'Devam et' : 'Duraklat'); }
    const a = O.adim[O.i]; if(O.dur){ clearInterval(animT); sustur(); toast('Duraklatıldı'); } else if(a.tip === 'is') animBaslat(document.getElementById('oyn')); }
  else if(k === 'atla'){ if(O.i < O.adim.length - 1){ O.i++; adimBasla(); } else bitir(true); }
  else if(k === 'geri'){ let i = O.i - 1; while(i > 0 && O.adim[i].tip !== 'is') i--; O.i = Math.max(0, i); adimBasla(); }
  else if(k === 'ses'){ S.ayar.ses = !S.ayar.ses; save(); const b = document.querySelector('#oyn [data-o="ses"]'); if(b){ b.textContent = S.ayar.ses ? '🔊' : '🔇'; b.setAttribute('aria-label', S.ayar.ses ? 'Sesi kapat' : 'Sesi aç'); } if(!S.ayar.ses) sustur(); }
  else if(k === 'bitir'){ if(Date.now() - O.bitirOnay > 3000){ O.bitirOnay = Date.now(); const b = document.querySelector('#oyn [data-o="bitir"]'); if(b) b.textContent = 'Bitir? Tekrar dokun'; toast('Bitirmek için tekrar dokun'); setTimeout(() => { const b2 = document.querySelector('#oyn [data-o="bitir"]'); if(b2 && O && Date.now() - O.bitirOnay >= 3000) b2.textContent = '✕ Bitir'; }, 3100); return; } bitir(false); }
}
function bitir(tamam){

    <div class="stat3"><div><small>Aktif süre</small><b>${dk} dk</b></div><div><small>Kalori</small><b>≈ ${nf0.format(kcal)}</b></div><div><small>Hareket</small><b>${hareket}</b></div></div>
    <div class="field"><span class="label">Nasıl geçti?</span><div class="chips">${[[1,'Çok kolay'],[2,'Kolay'],[3,'Tam kıvamında'],[4,'Zor'],[5,'Çok zor']].map(([v, a]) => `<button class="chip" data-z="${v}" aria-pressed="${s.zorluk === v}">${a}</button>`).join('')}</div>
      ${s.zorluk ? `<span class="note">${s.zorluk <= 2 ? 'Bir dahaki sefere seviyeyi ya da süreyi artırmayı dene.' : s.zorluk >= 4 ? 'Bir dahaki sefere kolay varyasyonları kullan ya da süreyi kısalt.' : 'Harika, böyle devam!'}</span>` : ''}</div>
    <div class="btns"><button class="btn ghost" id="kPay" style="flex:1">📤 Paylaş</button><button class="btn" data-close style="flex:1">Tamam</button></div>`, 'Antrenman sonu');
    sh.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { s.zorluk = +b.dataset.z; save(); render(); draw(); });

/* ---------- yürüyüş oynatıcı ---------- */
let Y = null;
function yuruyus(){
  kiloOku(); const yp = YP[S.yHafta - 1], seg = yp.bolum.map(([dk, tp]) => ({tp, sn: dk * 60}));
  Y = {yp, seg, i: 0, kalan: seg[0].sn * 1000, son: Date.now(), dur: false, aktifMs: 0, gps: null, km: 0, onceki: null, kcal: 0, kg: KG, bitirOnay: 0};
  oynaticiAc('Yürüyüş'); yCiz(); soyle(`${S.yHafta}. hafta yürüyüşü başlıyor. ${YT[seg[0].tp].ses}`); Y.tik = setInterval(yTik, 250);
}
const fmt = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return `${Math.floor(s/60)}:${pad(s%60)}`; };
function yCiz(){
  const s = Y.seg[Y.i], kalanTop = Y.seg.slice(Y.i + 1).reduce((a, x) => a + x.sn, 0) * 1000 + Math.max(0, Y.kalan), box = document.getElementById('oyn'), sonraki = Y.seg[Y.i + 1], tum = Y.seg.reduce((a, b) => a + b.sn, 0);
  box.innerHTML = `<div class="ust"><button class="icon-btn" data-y="bitir">✕ Bitir</button><small>${Y.i + 1} / ${Y.seg.length} bölüm</small><button class="icon-btn" data-y="ses" aria-label="${S.ayar.ses ? 'Sesi kapat' : 'Sesi aç'}">${S.ayar.ses ? '🔊' : '🔇'}</button></div>
    <div class="orta"><div class="segbar" style="width:100%">${Y.seg.map((x, i) => `<i class="t-${x.tp}" style="width:${(x.sn / tum * 100).toFixed(1)}%;opacity:${i < Y.i ? .35 : 1}"></i>`).join('')}</div>
      <img src="ikon-spor.jpg" alt="" style="width:120px;height:120px;border-radius:32px">
      <span class="faz">${YT[s.tp].ad} tempo</span><div class="sayac" id="ySay">${fmt(Y.kalan)}</div>
      <div class="ipu">${esc(YT[s.tp].ses)}</div>
      <div class="sira">Toplam kalan: <b id="yTop">${fmt(kalanTop)}</b>${sonraki ? ` · Sonra: ${YT[sonraki.tp].ad.toLocaleLowerCase('tr')}` : ''}</div>
      <div class="sira" id="yGps">${Y.gps != null ? `📍 ${esc(nf2.format(Y.km))} km` : `<button class="chip" data-y="gps">📍 Mesafeyi ölç</button>`}</div></div>
    <div class="alt"><button data-y="geri" aria-label="Önceki bölüm">⏮</button><button class="ana" data-y="dur" aria-label="${Y.dur ? 'Devam et' : 'Duraklat'}">${Y.dur ? '▶' : '⏸'}</button><button data-y="atla" aria-label="Sonraki bölüm">⏭</button></div>`;
  box.querySelectorAll('[data-y]').forEach(b => b.onclick = () => yKontrol(b.dataset.y));
}
function yTik(){
  if(!Y || Y.dur) return; const now = Date.now(); let d = now - Y.son; Y.son = now; if(d <= 0) return;
  Y.aktifMs += d; const ilk = Y.i;
  while(d > 0 && Y){ const kullan = Math.min(d, Math.max(0, Y.kalan)); Y.kcal += kcalOf(YT[Y.seg[Y.i].tp].met, kullan / 1000, Y.kg); Y.kalan -= kullan; d -= kullan;
    if(Y.kalan <= 0){ if(Y.i >= Y.seg.length - 1){ bip(true); return yBitir(true); } Y.i++; Y.kalan = Y.seg[Y.i].sn * 1000; } else break; }
  if(Y.i !== ilk){ bip(true); yCiz(); soyle(YT[Y.seg[Y.i].tp].ses); return; }
  const el = document.getElementById('ySay'); if(el) el.textContent = fmt(Y.kalan);
  const t = document.getElementById('yTop'); if(t) t.textContent = fmt(Y.seg.slice(Y.i + 1).reduce((a, x) => a + x.sn, 0)*1000 + Math.max(0, Y.kalan));
}
function gpsKapat(){ if(Y && Y.gps != null){ try { navigator.geolocation.clearWatch(Y.gps); } catch(e){} Y.gps = null; } }
function yKontrol(k){
  if(!Y) return; if(k !== 'bitir') Y.bitirOnay = 0;
  if(k === 'dur'){ Y.dur = !Y.dur; Y.son = Date.now(); Y.onceki = null; yCiz(); if(Y.dur){ sustur(); toast('Duraklatıldı'); } else soyle('Devam'); }
  else if(k === 'atla'){ if(Y.i < Y.seg.length - 1){ Y.i++; Y.kalan = Y.seg[Y.i].sn * 1000; yCiz(); soyle(YT[Y.seg[Y.i].tp].ses); } else yBitir(true); }
  else if(k === 'geri'){ Y.i = Math.max(0, Y.i - 1); Y.kalan = Y.seg[Y.i].sn * 1000; yCiz(); soyle(YT[Y.seg[Y.i].tp].ses); }
  else if(k === 'ses'){ S.ayar.ses = !S.ayar.ses; save(); if(!S.ayar.ses) sustur(); yCiz(); }
  else if(k === 'gps'){ if(!navigator.geolocation) return toast('Bu cihazda konum yok.'); if(Y.gps != null) return;
    const id = navigator.geolocation.watchPosition(pos => { if(!Y || Y.dur) return; const c = pos.coords; if(c.accuracy > 25) return;
      if(Y.onceki){ const R = 6371, r = x => x * Math.PI / 180, dLa = r(c.latitude - Y.onceki.latitude), dLo = r(c.longitude - Y.onceki.longitude), a = Math.sin(dLa/2)**2 + Math.cos(r(Y.onceki.latitude))*Math.cos(r(c.latitude))*Math.sin(dLo/2)**2, km = 2*R*Math.asin(Math.sqrt(a));
        // titreşimi saymamak için iki ölçümün doğruluk payından kısa hareketler atlanır
        if(km * 1000 < Math.max(8, (c.accuracy + (Y.onceki.accuracy || c.accuracy)) / 2)) return; if(km < 0.25) Y.km += km; }
      Y.onceki = {latitude: c.latitude, longitude: c.longitude, accuracy: c.accuracy}; const g = document.getElementById('yGps'); if(g) g.innerHTML = `📍 ${esc(nf2.format(Y.km))} km`; },
      e => { if(e.code === 1){ gpsKapat(); if(Y) yCiz(); toast('Konum izni verilmedi.'); } }, {enableHighAccuracy: true, maximumAge: 2000, timeout: 30000});
    Y.gps = id; yCiz(); toast('Ekran açık kaldıkça mesafeyi ölçüyorum.'); }

}
function yBitir(tamam){

  const buHafta = S.seanslar.filter(s => s.tip === 'yuruyus' && s.t >= haftaBasi(bugun())).length;
  save(); view.tab = 'bugun'; render();
  const sh = openSheet(`${head(tamam ? '🎉 Yürüyüş tamam!' : 'Yürüyüş kaydedildi')}<div class="stat3"><div><small>Aktif süre</small><b>${dk} dk</b></div><div><small>Kalori</small><b>≈ ${nf0.format(kcal)}</b></div><div><small>Mesafe</small><b>${km > 0.05 ? esc(nf2.format(km)) + ' km' : '—'}</b></div></div>
    <div class="note">Bu hafta ${buHafta} yürüyüş yaptın. Planda haftada 5 gün var.</div>
    ${buHafta >= 5 && h < 8 ? `<button class="btn" id="ySonraki">${h + 1}. haftaya geç</button>` : ''}<div class="btns"><button class="btn ghost" id="yPay" style="flex:1">📤 Paylaş</button><button class="btn" data-close style="flex:1">Tamam</button></div>`, 'Yürüyüş sonu');
  const ys = document.getElementById('ySonraki'); if(ys) ys.onclick = () => { S.yHafta = h + 1; save(); closeSheet(); render(); toast(`${h + 1}. haftaya geçtin`); };
  document.getElementById('yPay').onclick = () => paylas(`Bugün ${dk} dk yürüdüm${km > 0.05 ? ', ' + nf2.format(km) + ' km' : ''} 🚶 (Böcekler Spor)`);
}

/* ---------- olaylar ---------- */
document.querySelectorAll('nav .tab').forEach(b => b.onclick = () => { view.tab = b.dataset.tab; render(); window.scrollTo(0, 0); history.replaceState(null, '', '#' + view.tab); });
document.getElementById('addBtn').onclick = openManuel;
main.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-uyari],[data-yuru],[data-seans],[data-ekle],[data-hedef],[data-sure],[data-sev],[data-tog],[data-yenile],[data-basla],[data-prog],[data-hrk],[data-grup],[data-hafta],[data-tekrar],[data-favlist],[data-fav]'); if(!t) return;
  const d = t.dataset, sec = S.secim; if(!sec.hedef) sec.hedef = varsayilanHedef();
  if(d.go){ view.tab = d.go; render(); window.scrollTo(0, 0); return; }
  if(d.uyari){ S.ayar.uyariOk = true; save(); render(); return; }
  if(d.yuru) return yuruyus();
  if(d.seans) return openSeans(d.seans);
  if(d.ekle !== undefined){ S.ayar.ekle = +d.ekle; save(); render(); toast(S.ayar.ekle ? 'Sağlık hedefin egzersize göre artacak' : 'Egzersiz kalorisi Sağlık’a eklenmeyecek'); return; }
  if(d.hedef){ sec.hedef = d.hedef; save(); render(); return; }
  if(d.sure){ sec.sure = +d.sure; save(); render(); return; }
  if(d.sev){ sec.sev = +d.sev; save(); render(); return; }
  if(d.tog){ sec[d.tog] = !sec[d.tog]; save(); render(); return; }
  if(d.yenile){ view.uretilen = null; tohum = (tohum + 7919) % 100000; render(); return; }
  if(d.basla) return oynat(view.uretilen.p);
  if(d.fav){ const p = view.uretilen.p, i = S.favori.findIndex(f => f.liste.join() === p.liste.join()); if(i >= 0){ S.favori.splice(i, 1); toast('Favorilerden çıkarıldı'); } else { S.favori.unshift(JSON.parse(JSON.stringify(p))); S.favori = S.favori.slice(0, 10); toast('Favorilere eklendi ⭐'); } save(); render(); return; }
  if(d.favlist) return openFavoriler();
  if(d.tekrar){ const son = S.seanslar.filter(s => s.prog).sort((a, b) => (b.ts || 0) - (a.ts || 0))[0]; if(son && son.prog.liste.every(i => HB.has(i))) return oynat(son.prog); return; }
  if(d.prog) return openProgram(d.prog);
  if(d.hrk) return openHareket(d.hrk);
  if(d.grup !== undefined){ view.grup = d.grup; render(); return; }
  if(d.hafta){ S.yHafta = +d.hafta; save(); render(); return; }
});
