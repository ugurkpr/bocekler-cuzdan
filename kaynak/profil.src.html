<title>Böcekler · Profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
/*BANKCSS*/
/* ---- Profil sayfası ---- */
.wrap{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.me-big{display:grid;justify-items:center;gap:12px;text-align:center;padding:8px 0 4px}
.me-big .ph{width:132px;height:132px;border-radius:40px;overflow:hidden;background:var(--sunk);box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--accent)}
.me-big .ph img{width:100%;height:100%;object-fit:cover;display:block}
.me-big input{text-align:center;font-family:var(--display);font-size:22px;font-weight:700;max-width:280px;background:transparent;border-color:transparent;border-bottom:1px dashed var(--line);border-radius:0}
.me-big input:focus{border-bottom-color:var(--accent)}
.avs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.av{border:0;background:none;padding:0;display:grid;justify-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.av span.i{width:100%;max-width:104px;aspect-ratio:1;border-radius:28px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;font-size:30px;box-shadow:inset 0 0 0 1px var(--line)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av[aria-pressed="true"]{color:var(--ink)}
.av[aria-pressed="true"] span.i{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--accent)}
.links2{display:grid;gap:0;padding:0;overflow:hidden}
.links2 a{display:flex;align-items:center;gap:12px;padding:14px;min-height:56px;color:inherit;text-decoration:none;border-top:1px solid var(--line)}
.links2 a:first-child{border-top:0}
.links2 a img{width:36px;height:36px;border-radius:11px}
.links2 a span{flex:1}
.links2 a small{display:block;color:var(--muted);font-size:13px}
</style>
<script src="ortak.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand home" href="./" aria-label="Böcekler ana ekranına dön"><span class="homei" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></span><span>Böcekler<small>Profil</small></span></a>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(() => {
const KEY = 'cuzdan-defteri-v1';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT; const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); };
// Profil, renk ve görünüm Mobil Bank verisinde durur; bütün bölümler oradan okur
const oku = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ return null; } };
function yaz(fn){
  const d = oku() || {settings: {}, months: {}, rates: {}}; d.settings = d.settings || {};
  fn(d.settings);
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){ toast('Kaydedilemedi: telefon hafızası dolu olabilir.'); }
}
const AVATARS = [['avatar-erkek.jpg','Erkek sincap'],['avatar-kadin.jpg','Kadın sincap'],['icon-192.png','Klasik sincap']];
const mevcut = new Set();
function draw(){
  Bocekler.applyTheme();
  const st = (oku() || {}).settings || {}, pr = st.profile || {}, photo = pr.photo || 'icon-192.png', th = st.theme || 'system', P = Bocekler.PALETTES;
  const kendi = photo.startsWith('data:');
  document.getElementById('main').innerHTML = `
  <section style="margin-top:4px"><div class="me-big"><div class="ph"><img src="${esc(photo)}" alt="Profil fotoğrafın"></div>
    <input id="pName" maxlength="24" placeholder="Adını yaz" value="${esc(pr.name || '')}" aria-label="Adın" autocomplete="off"></div></section>
  <section><div class="sec-head"><h2>Profil fotoğrafı</h2><small>Seç ya da yükle</small></div>
    <div class="card"><div class="avs">
      ${AVATARS.filter(([f]) => mevcut.has(f)).map(([f, ad]) => `<button class="av" data-av="${f}" aria-pressed="${photo === f}"><span class="i"><img src="${f}" alt=""></span>${ad}</button>`).join('')}
      <label class="av" for="pFile" aria-pressed="${kendi}" style="cursor:pointer"><span class="i">${kendi ? `<img src="${esc(photo)}" alt="">` : '📷'}</span>${kendi ? 'Kendi fotoğrafın' : 'Fotoğraf yükle'}</label>
      <input type="file" id="pFile" accept="image/*" hidden>
    </div></div></section>
  ${[['banka','Mobil Bank rengi','Altın sarısı: para ve birikim'],['saglik','Sağlık rengi','Yeşil: sağlık ve tazelik']].map(([b, bas, alt]) => { const cur = Bocekler.renkOf(b, st);
    return `<section><div class="sec-head"><h2>${bas}</h2><small>Önerilen · ${alt}</small></div>
    <div class="card"><div class="swatches">${Object.entries(P).map(([id, p]) => `<button class="swatch" data-color="${id}" data-bolum="${b}" aria-pressed="${cur === id}"><i style="background:${p.light.hero};color:${p.light.accentInk}">${cur === id ? '✓' : ''}</i>${p.name}</button>`).join('')}</div></div></section>`; }).join('')}
  <section><div class="sec-head"><h2>Gizlilik</h2></div>
    <div class="card" style="display:grid;gap:6px"><label class="check"><input type="checkbox" id="pGiz" ${Bocekler.gizliTercih() ? 'checked' : ''}> <span><b>Açılışta kalan ve birikimi gizle</b><br><span class="note" style="font-size:12px">Uygulama her açıldığında toplam kalan para ve toplam birikim ₺••• görünür; diğer tutarlar açık kalır. Görmek için göz simgesine dokun.</span></span></label></div></section>
  <section><div class="sec-head"><h2>Görünüm</h2></div>
    <div class="seg seg3" role="group" aria-label="Tema" style="grid-template-columns:repeat(3,1fr)">${[['system','Telefona göre'],['light','Açık'],['dark','Koyu']].map(([k, a]) => `<button data-th="${k}" aria-pressed="${th === k}">${a}</button>`).join('')}</div></section>
  <section><div class="sec-head"><h2>Bölümler</h2></div>
    <div class="card links2">
      <a href="banka.html#ayar"><img src="ikon-banka.jpg" alt=""><span>Mobil Bank ayarları<small>Kategoriler, tekrarlayanlar, yedek al ve yükle</small></span>›</a>
      <a href="saglik.html#profil"><img src="ikon-saglik.jpg" alt=""><span>Sağlık hedefleri<small>Boy, kilo, kalori ve su hedefi</small></span>›</a>
    </div>
    <p class="note" style="margin-top:10px">Kayıtların sadece bu telefonda saklanır. Yedek, Mobil Bank ayarlarından alınır ve bütün bölümleri kapsar.</p></section>`;
  const nm = document.getElementById('pName');
  nm.addEventListener('change', () => { const v = nm.value.trim(); yaz(s => { s.profile = {...(s.profile || {}), name: v}; }); toast(v ? 'Adın kaydedildi' : 'Ad silindi'); });
  nm.addEventListener('keydown', e => { if(e.key === 'Enter') nm.blur(); });
  document.querySelectorAll('[data-av]').forEach(b => b.onclick = () => { yaz(s => { s.profile = {...(s.profile || {}), photo: b.dataset.av}; }); draw(); toast('Profil fotoğrafı değişti'); });
  document.querySelectorAll('[data-color]').forEach(b => b.onclick = () => { const sg = b.dataset.bolum === 'saglik'; yaz(s => { s[sg ? 'colorSaglik' : 'color'] = b.dataset.color; }); draw(); toast(`${sg ? 'Sağlık' : 'Mobil Bank'}: ${P[b.dataset.color].name}`); });
  document.getElementById('pGiz').addEventListener('change', e => { Bocekler.gizliTercihYap(e.target.checked); toast(e.target.checked ? 'Açılışta kalan ve birikim gizli olacak' : 'Kalan ve birikim açık başlayacak'); });
  document.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { yaz(s => { s.theme = b.dataset.th; }); draw(); });
  document.getElementById('pFile').addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 240; const k = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width-k)/2, (img.height-k)/2, k, k, 0, 0, 240, 240); URL.revokeObjectURL(url);
      yaz(s => { s.profile = {...(s.profile || {}), photo: c.toDataURL('image/jpeg', .85)}; }); draw(); toast('Fotoğrafın kaydedildi'); };
    img.onerror = () => toast('Bu fotoğraf açılamadı, başka bir tane dene.');
    img.src = url;
  });
}
// Henüz yüklenmemiş avatar dosyası seçenek olarak görünmesin
Promise.all(AVATARS.map(([f]) => new Promise(ok => { const i = new Image(); i.onload = () => { mevcut.add(f); ok(); }; i.onerror = ok; i.src = f; }))).then(draw);
draw();
addEventListener('pageshow', e => { if(e.persisted) draw(); });
if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
</script>
</body>
</html>
