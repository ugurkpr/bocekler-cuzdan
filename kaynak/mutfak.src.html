<title>Böcekler · Mutfak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
/*BANKCSS*/
/* ---- Mutfak bölümüne özel ---- */
nav.tabs .in{grid-template-columns:repeat(3,minmax(0,1fr))}
.top .chef{flex:none;width:44px;height:44px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2px var(--surface),0 3px 10px rgb(0 0 0 / .15)}
.top .chef img{width:100%;height:100%;object-fit:cover;display:block}
.dnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.dnav button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;line-height:1}
.dnav .t{text-align:center;min-width:0}
.dnav .t b{display:block;font-family:var(--display);font-size:20px;line-height:1.15}
.dnav .t small{color:var(--muted);font-size:13px;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.week button{border:1px solid transparent;background:none;border-radius:12px;padding:6px 0 7px;display:grid;justify-items:center;gap:2px;color:var(--ink);font:inherit}
.week button small{font-size:11px;font-weight:600;color:var(--muted)}
.week button b{font-size:16px;font-variant-numeric:tabular-nums}
.week button i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.week button[aria-pressed="true"]{background:var(--surface);border-color:var(--line)}
.week button.bugun b{color:var(--accent-text)}
.k-tencere{background:var(--accent)!important}.k-keyif{background:#F0A23A!important}.k-tava,.k-airfryer{background:var(--muted)!important}.k-hazirlik{background:var(--ink)!important}
.dish{position:relative;overflow:hidden;grid-template-columns:1fr auto;align-items:end}
.dish h1{font-family:var(--display);font-size:clamp(24px,7vw,30px);line-height:1.08;margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
.dish .sq{width:96px;height:96px;border-radius:24px;overflow:hidden;box-shadow:0 6px 18px rgb(0 0 0 / .18),0 0 0 3px rgb(255 255 255 / .5);align-self:start}
.dish .sq img{width:100%;height:100%;object-fit:cover;display:block}
.dish .meta{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.dish .meta span{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.hatir{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--accent-soft);border:0}
.hatir .em{font-size:22px;line-height:1.2}
.hatir b{display:block;margin-bottom:2px}
.ing{list-style:none;margin:0;padding:0}
.ing li{border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.ing label{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;min-height:46px;cursor:pointer;font-size:15px}
.ing input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent)}
.ing input:checked + span{color:var(--muted);text-decoration:line-through}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:15px;line-height:1.5}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-size:14px;display:grid;place-items:center}
.side{display:grid;gap:12px}
.side h3{margin:0;font-family:var(--display);font-size:17px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:3px 8px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.tencere{background:var(--accent-soft);color:var(--accent-text)}
.tag.keyif{background:#FDEBD0;color:#8A4B00}
.item.bugun{background:var(--accent-soft)}
.item .dt{width:46px;flex:none;text-align:center;line-height:1.1}
.item .dt b{display:block;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.item .dt small{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.item .mid b{white-space:normal}
.shop .item{align-items:flex-start}
.shop .item input{flex:none;width:22px;height:22px;margin-top:1px;accent-color:var(--accent)}
.shop .item.ok .mid b{text-decoration:line-through;color:var(--muted)}
.shop .cat{background:var(--sunk);font-weight:600;font-size:13px;padding:8px 14px}
.shop .item{gap:8px;padding:0}
.shop .pick{flex:1;min-width:0;display:flex;align-items:flex-start;gap:12px;padding:12px 0 12px 14px;cursor:pointer}
.shop .fiyat{flex:none;border:0;background:none;color:var(--ink);text-align:right;padding:12px 14px 12px 6px;min-width:92px;display:grid;justify-items:end;gap:1px;font:inherit}
.shop .fiyat b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.shop .fiyat.girildi b{color:var(--ink)}
.shop .fiyat small{font-size:11.5px;color:var(--accent-text);font-weight:600}
.shop .item.ok .fiyat b{color:var(--ink)}
.shop .ekle{padding:14px;justify-content:center;font-weight:600;color:var(--accent-text);border-top:1px solid var(--line)}
.evde{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--accent-text)}
.cta{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;padding:14px;border-radius:var(--r);background:var(--sunk);color:var(--ink)}
.cta .em{font-size:28px}
.cta b{display:block;font-family:var(--display);font-size:16px}
.cta small{color:var(--muted);font-size:13px}
.uyari{background:var(--accent-soft);border-color:transparent;display:grid;gap:8px}
input[type=date]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
</style>
<script src="ortak.js"></script>
<script src="mutfak-veri.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand home" href="./" aria-label="Böcekler bölüm geçişi"><span class="homei" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></span><span>Böcekler<small>Mutfak</small></span></a>
    <span class="chef" aria-hidden="true"><img src="ikon-mutfak.jpg" alt="" width="44" height="44"></span>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Sekmeler"><div class="in">
  <button class="tab" data-tab="gun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-1.5 1-1.5 1-3M14 7c0-1.5 1-1.5 1-3"/></svg>Bugün</button>
  <button class="tab" data-tab="takvim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Takvim</button>
  <button class="tab" data-tab="liste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h2l2.5 11h10L20 8H6.5"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>Alışveriş</button>
</div></nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(() => {
const APP_VERSION = '1.2 · 4 Kasım 2026';
const KEY = 'bocekler-mutfak-v1';
const mode = 'local';
const M = window.MUTFAK, R = M.recipes, SD = M.sides, PLAN = M.plan, GUN = PLAN.length - 1;
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const bugun = () => isoOf(new Date());
const addDays = (iso, n) => { const d = new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return isoOf(d); };
const fark = (a, b) => Math.round((new Date(a+'T12:00') - new Date(b+'T12:00')) / 864e5);
const dayLabel = (iso, opt={day:'numeric',month:'long',weekday:'long'}) => new Date(iso+'T12:00').toLocaleDateString('tr-TR', opt);
const tl = new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0});
const tl2 = new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2});
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
// Türkçe yazım: "1.250,50" ya da "1250,5" ya da "45.5"
const tutar = v => { let x = String(v ?? '').trim().replace(/[₺\s]|tl/gi, ''); if(!x) return null;
  if(x.includes(',')) x = x.replace(/\./g, '').replace(',', '.'); else if(/^\d{1,3}(\.\d{3})+$/.test(x)) x = x.replace(/\./g, '');
  const n = parseFloat(x); return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null; };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT; function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- veri ---------- */
const BAS0 = '2026-11-04';   // ilk alışveriş günü; Takvim'den değiştirilebilir
const blank = () => ({bas: BAS0, tik: {}, alindi: {}, fiyat: {}, ekstra: [], gecmis: []});
const obj = x => x && typeof x === 'object' && !Array.isArray(x);
let okumaHatasi = false;
let S = (() => { try { const raw = localStorage.getItem(KEY); if(!raw) return blank(); const d = JSON.parse(raw);
  if(obj(d)) return {bas: /^\d{4}-\d{2}-\d{2}$/.test(d.bas) ? d.bas : BAS0, tik: obj(d.tik) ? d.tik : {}, alindi: obj(d.alindi) ? d.alindi : {},
    fiyat: Object.fromEntries(Object.entries(obj(d.fiyat) ? d.fiyat : {}).filter(([, v]) => isFinite(+v) && +v >= 0).map(([k, v]) => [k, +v])),
    ekstra: (Array.isArray(d.ekstra) ? d.ekstra : []).filter(e => obj(e) && e.id && e.ad && ['A','B'].includes(e.grup)).map(e => ({id: String(e.id), grup: e.grup, ad: String(e.ad).slice(0, 60), tl: isFinite(+e.tl) && e.tl !== null ? +e.tl : null})),
    gecmis: (Array.isArray(d.gecmis) ? d.gecmis : []).filter(g => obj(g) && g.id && Array.isArray(g.kalem))}; } catch(e){ okumaHatasi = true; } return blank(); })();
function snapYaz(){ Bocekler.snap('mutfak', {bas: S.bas, adlar: PLAN.map(([id, mod]) => (mod === 'gun2' ? '↻ ' : '') + R[id].name)}); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); okumaHatasi = false; } catch(e){ toast('Kayıt yapılamadı.'); } snapYaz(); }

const TUR = {tencere: 'Tencere', keyif: 'Keyif akşamı', tava: 'Tava', airfryer: 'Airfryer', hazirlik: 'Alışveriş günü', ekstra: 'Ekstra'};
const turYazi = (r, mod) => r.kind === 'tencere' ? `Tencere · ${mod === 'gun2' ? '2' : '1'}. gün` : TUR[r.kind];
const gunOf = iso => fark(iso, S.bas);
const plnOf = iso => { const i = gunOf(iso); return i >= 0 && i <= GUN ? {i, id: PLAN[i][0], mod: PLAN[i][1], ek: PLAN[i][2]} : null; };
const yapilanGun = (i, id) => { for(let j = i - 1; j >= 0; j--) if(PLAN[j][0] === id && PLAN[j][1] === 'yap') return j; return i - 1; };

/* ---------- görünüm ---------- */
const TABS = ['gun','takvim','liste'];
let view = {tab: TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'gun', gun: bugun()};
const main = document.getElementById('main'), sheetRoot = document.getElementById('sheetRoot');
function render(){
  Bocekler.applyTheme();
  document.querySelectorAll('nav .tab').forEach(b => { if(b.dataset.tab === view.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  main.innerHTML = view.tab === 'gun' ? rGun() : view.tab === 'takvim' ? rTakvim() : rListe();
  maybeTips(currentTipKey());
}

const tikli = (k) => !!S.tik[k];
const ingList = (list, pre) => `<ul class="ing items">${list.map((t, n) => { const k = pre + n; return `<li><label><input type="checkbox" data-tik="${esc(k)}" ${tikli(k) ? 'checked' : ''}><span>${esc(t)}</span></label></li>`; }).join('')}</ul>`;
const stepList = list => `<ol class="steps">${list.map(t => `<li><span>${esc(t)}</span></li>`).join('')}</ol>`;
const sideHTML = (sid, pre) => { const s = SD[sid]; return `<section class="side"><div class="sec-head" style="margin:0"><h2>Yanına: ${esc(s.name)}</h2><small>${esc(s.time)}</small></div>${ingList(s.ing, pre)}${s.steps.length > 1 ? `<div class="card">${stepList(s.steps)}</div>` : `<p class="note" style="margin:0 2px">${esc(s.steps[0])}</p>`}</section>`; };

function hatirlatma(p){
  if(!p || p.i >= GUN) return '';
  const [nid, nmod] = PLAN[p.i + 1], n = R[nid], out = [];
  if(nmod !== 'yap') return '';
  if(n.soak) out.push(`Bu akşam ${n.soak} bol suda ıslatmaya koy.`);
  if(n.et.length) out.push(p.i === 0 ? `Ayırdığın ${n.et.join(', ')} poşetini dondurma, buzdolabında bırak.` : `${n.et.join(', ')} poşetini buzluktan buzdolabına al.`);
  if(nid === 'doner') out.push('Yarın sabah tavuğu marine etmeyi unutma.');
  if(!out.length) return '';
  return `<section><div class="card hatir"><span class="em" aria-hidden="true">⏰</span><span><b>Yarın ${esc(n.name)} var</b><span class="note" style="color:var(--ink)">${out.map(esc).join(' ')}</span></span></div></section>`;
}

function rGun(){
  const t = bugun(), g = view.gun, p = plnOf(g), d = fark(g, t);
  const rel = d === 0 ? 'Bugün' : d === 1 ? 'Yarın' : d === -1 ? 'Dün' : '';
  const pzt = addDays(g, -((new Date(g+'T12:00').getDay() + 6) % 7));
  const hafta = Array.from({length: 7}, (_, k) => addDays(pzt, k));
  const nav = `<section style="margin-top:0"><div class="dnav"><button data-gun="${addDays(g, -1)}" aria-label="Önceki gün">‹</button>
    <div class="t"><b>${esc(dayLabel(g, {weekday:'long', day:'numeric', month:'long'}))}</b><small>${rel ? rel + ' · ' : ''}${p ? (p.i === 0 ? 'Alışveriş günü' : `${p.i}. gün / ${GUN}`) : 'Plan dışında'}</small></div>
    <button data-gun="${addDays(g, 1)}" aria-label="Sonraki gün">›</button></div>
    <div class="week">${hafta.map(h => { const q = plnOf(h), k = q ? R[q.id].kind : ''; return `<button data-gun="${h}" aria-pressed="${h === g}" class="${h === t ? 'bugun' : ''}" aria-label="${esc(dayLabel(h))}${q ? ': ' + esc(R[q.id].name) : ''}"><small>${esc(dayLabel(h, {weekday:'short'}))}</small><b>${new Date(h+'T12:00').getDate()}</b><i class="${k ? 'k-' + k : ''}"></i></button>`; }).join('')}</div>
    ${d !== 0 ? `<div class="btns" style="justify-content:center;margin-top:8px"><button class="chip" data-gun="${t}">Bugüne dön</button></div>` : ''}</section>`;
  if(!p){
    const once = gunOf(g) < 0;
    return `${nav}<section><div class="card empty"><b>${once ? 'Plan henüz başlamadı' : 'Bu ayın planı bitti'}</b>${once ? `Alışveriş günü ${esc(dayLabel(S.bas, {day:'numeric', month:'long'}))}. İleri ok ile o güne geç.` : 'Aynı 28 günlük menüyü yeniden başlatabilirsin. Sepet sıfırlanır, ödediğin fiyatlar geçmişte kalır.'}
      ${once ? '' : `<div class="btns" style="justify-content:center;margin-top:12px"><button class="btn" data-yeniay="1">Yeni ayı bugün başlat</button></div>`}</div></section>`;
  }
  const r = R[p.id], gun2 = p.mod === 'gun2', pre = `${g}:`;
  const hero = `<section><div class="hero dish"><span><span class="label">${rel ? (rel === 'Bugün' ? 'Bu akşam' : rel + ' akşam') : esc(dayLabel(g, {weekday:'long'})) + ' akşamı'}</span><h1>${esc(r.name)}</h1></span>
    <span class="sq" aria-hidden="true"><img src="ikon-mutfak.jpg" alt=""></span>
    <div class="meta"><span>${esc(turYazi(r, p.mod))}</span>${gun2 ? '<span>Isıt, 10 dk</span>' : `<span>${esc(r.time)}</span><span>${esc(r.serves)}</span>`}</div></div></section>`;
  let govde;
  if(gun2){
    const j = yapilanGun(p.i, p.id);
    govde = `<section><div class="sec-head"><h2>Dünden kalan</h2><small>${esc(dayLabel(addDays(S.bas, j), {day:'numeric', month:'long'}))} yapıldı</small></div>
      <div class="card">${stepList(['Yemeği tencereye al, 2-3 kaşık su ekle.', 'Kapağı kapalı kısık ateşte arada karıştırarak 8-10 dakika ısıt.', 'Zeytinyağlı sebze yemeklerini istersen ılık da yiyebilirsin.'])}</div>
      <button class="btn ghost" data-tarif="${esc(p.id)}" style="width:100%;margin-top:10px">Tarifin tamamını aç</button></section>`;
  } else {
    govde = `<section><div class="sec-head"><h2>Malzemeler</h2><small>Dokun: hazırladım</small></div>${ingList(r.ing, pre + 'm')}</section>
      <section><div class="sec-head"><h2>Yapılışı</h2></div><div class="card">${stepList(r.steps)}</div>
      ${r.note ? `<p class="note" style="margin:10px 2px 0">💡 ${esc(r.note)}</p>` : ''}</section>`;
  }
  const yanlar = [...(gun2 ? [] : (r.side || [])), ...(p.ek || [])];
  return `${okumaHatasi ? `<section style="margin-top:0"><div class="card uyari"><b>Mutfak kayıtları okunamadı</b><span class="note" style="color:var(--ink)">Kayıtların bozulmuş olabilir. İşaretlerin sıfırdan başlıyor.</span></div></section>` : ''}
    ${nav}${hero}${hatirlatma(p)}${govde}${yanlar.map(s => sideHTML(s, pre + 's' + s)).join('')}
    <section><button class="cta" data-tarif="corba"><span class="em" aria-hidden="true">🥣</span><span><b>Tek kaldığın akşam</b><small>Kırmızı mercimek çorbası · 30 dk · buzlukta 1 ay durur</small></span><span class="chev" aria-hidden="true">›</span></button></section>`;
}

function rTakvim(){
  const t = bugun();
  const haftalar = [];
  for(let i = 0; i <= GUN; i++){ const w = i === 0 ? 0 : Math.ceil(i / 7); (haftalar[w] = haftalar[w] || []).push(i); }
  const sayi = PLAN.filter(([id, m]) => R[id].kind === 'tencere' && m === 'yap').length, keyif = PLAN.filter(([id]) => R[id].kind === 'keyif').length;
  return `<section style="margin-top:0"><div class="hero"><span class="label">28 günlük menü</span>
    <div class="row"><div class="cell"><span class="label">Tencere yemeği</span><b>${sayi} çeşit · 2'şer gün</b></div><div class="cell"><span class="label">Keyif akşamı</span><b>${keyif} cuma</b></div></div>
    <span style="font-size:14px">Zeytinyağı ağırlıklı, kızartmasız; köfteler airfryer'da ya da az yağlı tavada; fırın gerekmez. Etler kasaptan, alışveriş günü porsiyonlanıp dondurulur.</span></div></section>
    ${haftalar.map((g, w) => `<section><div class="sec-head"><h2>${w === 0 ? 'Hazırlık' : w + '. hafta'}</h2><small>${esc(dayLabel(addDays(S.bas, g[0]), {day:'numeric', month:'short'}))}${g.length > 1 ? ' – ' + esc(dayLabel(addDays(S.bas, g[g.length-1]), {day:'numeric', month:'short'})) : ''}</small></div>
      <div class="items">${g.map(i => { const [id, mod] = PLAN[i], r = R[id], iso = addDays(S.bas, i);
        return `<button class="item${iso === t ? ' bugun' : ''}" data-git="${iso}"><span class="dt"><b>${new Date(iso+'T12:00').getDate()}</b><small>${esc(dayLabel(iso, {weekday:'short'}))}</small></span>
          <span class="mid"><b>${mod === 'gun2' ? '↻ ' : ''}${esc(r.name)}</b><small>${mod === 'gun2' ? 'Dünden kalan, ısıt' : esc(r.time)}${iso === t ? ' · bugün' : ''}</small></span>
          <span class="tag ${r.kind}">${esc(turYazi(r, mod))}</span></button>`; }).join('')}</div></section>`).join('')}
    <section><div class="card" style="display:grid;gap:10px"><b style="font-family:var(--display);font-size:17px">Alışveriş günü</b>
      <span class="note">Menü bu günden sayılır: ertesi gün 1. gün olur. Alışverişi başka gün yaptıysan buradan değiştir.</span>
      <input type="date" id="basGun" value="${esc(S.bas)}" aria-label="Alışveriş günü"></div>
      <p class="note" style="margin:10px 2px 0">Sürüm ${APP_VERSION}</p></section>`;
}

const ROWS = {A: M.shopA, B: M.shopB};
const grupRows = g => [...ROWS[g].map(r => ({...r, k: g + ':' + r.key})), ...S.ekstra.filter(e => e.grup === g).map(e => ({k: g + ':x-' + e.id, ekstra: e, name: e.ad, cat: 'Listede olmayanlar', qty: 'Sonradan eklendi', unit: '', cost: null}))];
// sepetteki bir ürünün tutarı: girdiğin fiyat, yoksa tahmin
const tutarOf = r => r.ekstra ? r.ekstra.tl : S.fiyat[r.k] ?? r.cost;
const sepet = g => { const sec = grupRows(g).filter(r => S.alindi[r.k]); return {sec, top: sec.reduce((a, r) => a + (tutarOf(r) || 0), 0),
  gercek: sec.filter(r => r.ekstra ? r.ekstra.tl != null : S.fiyat[r.k] != null)}; };
const sonFiyat = key => { for(const g of S.gecmis) { const k = g.kalem.find(x => x.key === key && x.tl != null); if(k) return {tl: k.tl, tarih: g.tarih}; } return null; };
function shopGrup(g){
  let cat = '', html = '';
  for(const r of grupRows(g)){
    if(r.cat !== cat){ cat = r.cat; html += `<div class="cat">${esc(cat)}</div>`; }
    const ok = !!S.alindi[r.k], f = r.ekstra ? r.ekstra.tl : S.fiyat[r.k];
    html += `<div class="item${ok ? ' ok' : ''}"><label class="pick"><input type="checkbox" data-al="${esc(r.k)}" ${ok ? 'checked' : ''} aria-label="${esc(r.name)} sepette"><span class="mid"><b>${esc(r.name)}${r.pantry ? '<span class="evde">evde varsa alma</span>' : ''}</b><small>${esc(r.qty)}${r.unit ? ' · ' + esc(r.unit) : ''}</small></span></label>
      <button class="fiyat${f != null ? ' girildi' : ''}" data-fiyat="${esc(r.k)}" aria-label="${esc(r.name)} fiyatını yaz">${f != null ? `<b>${esc(tl2.format(f))}</b>${r.cost != null ? `<small>tahmin ${esc(tl.format(r.cost))}</small>` : '<small>ödenen</small>'}` : `<b>${r.cost != null ? esc(tl.format(r.cost)) : '—'}</b><small>${r.cost != null ? 'tahmin' : 'fiyat yaz'} ✎</small>`}</button></div>`;
  }
  return `<div class="items shop">${html}<button class="item ekle" data-ekstra="${g}">＋ Listede olmayan ürün ekle</button></div>`;
}
function grupKutu(g, baslik, alt){
  const s = sepet(g);
  return `<section><div class="sec-head"><h2>${baslik}</h2><small>${alt}</small></div>${shopGrup(g)}
    <div class="btns" style="margin-top:10px"><button class="btn${s.sec.length ? '' : ' ghost'}" data-bitir="${g}" style="flex:1"${s.sec.length ? '' : ' disabled'}>${S.gecmis.some(x => x.id === S.bas + '-' + g) ? 'Kaydı güncelle' : 'Alışverişi bitir ve kaydet'} · ${esc(tl.format(s.top))}</button></div></section>`;
}
function rListe(){
  const a = sepet('A'), b = sepet('B'), tB = addDays(S.bas, 14), T = M.totals;
  const ger = [...a.gercek, ...b.gercek], gT = ger.reduce((x, r) => x + tutarOf(r), 0), gTah = ger.filter(r => r.cost != null).reduce((x, r) => x + r.cost, 0), gFark = ger.filter(r => r.cost != null).reduce((x, r) => x + tutarOf(r), 0) - gTah;
  return `<section style="margin-top:0"><div class="hero"><span class="label">Sepetim</span><span class="big num">${esc(tl.format(a.top + b.top))}</span>
    <div class="row"><div class="cell"><span class="label">Bugün · ${a.sec.length} ürün</span><b class="num">${esc(tl.format(a.top))}</b></div><div class="cell"><span class="label">${esc(dayLabel(tB, {day:'numeric', month:'short'}))} · ${b.sec.length} ürün</span><b class="num">${esc(tl.format(b.top))}</b></div></div>
    <span style="font-size:14px">${ger.length ? `Fiyatını yazdığın ${ger.length} ürün: <strong class="num">${esc(tl2.format(gT))}</strong>${gTah ? ` · tahmine göre <strong class="num">${gFark > 0 ? '+' : gFark < 0 ? '−' : ''}${esc(tl.format(Math.abs(gFark)))}</strong>` : ''}` : 'İşaretlediğin ürünler sepete eklenir. Fiyatı farklıysa tutara dokunup ödediğini yaz.'}<br>Listenin tamamı tahminen ${esc(tl.format(T.all))}.</span></div></section>
    ${grupKutu('A', 'Bugün al', 'Et, kiler, ilk 2 haftanın tazesi')}
    ${grupKutu('B', esc(dayLabel(tB, {day:'numeric', month:'long', weekday:'long'})), 'Son 2 haftanın tazesi')}
    <section><div class="sec-head"><h2>Geçmiş alışverişler</h2><small>${S.gecmis.length ? 'Dokun: ürün ürün' : ''}</small></div>
      ${S.gecmis.length ? `<div class="items">${S.gecmis.map(g => { const tah = g.kalem.filter(k => k.tahmin != null && k.tl != null), f = tah.reduce((x, k) => x + k.tl - k.tahmin, 0);
        return `<button class="item" data-gecmis="${esc(g.id)}"><span class="mid"><b>${esc(dayLabel(g.tarih, {day:'numeric', month:'long', year:'numeric'}))} · ${g.grup === 'A' ? 'ana alışveriş' : 'tazeleme'}</b><small>${g.kalem.length} ürün${tah.length ? ` · fiyatı yazılan ${tah.length} üründe ${f > 0 ? 'tahminden ' + esc(tl.format(f)) + ' pahalı' : f < 0 ? 'tahminden ' + esc(tl.format(-f)) + ' ucuz' : 'tahminle aynı'}` : ''}</small></span><span class="amt num">${esc(tl.format(g.toplam))}</span></button>`; }).join('')}</div>`
        : `<div class="card empty"><b>Henüz kayıt yok</b>Alışverişi bitirince ödediğin fiyatlar burada ay ay saklanır; sonraki ay tahminle karşılaştırırsın.</div>`}</section>
    <section><p class="note" style="margin:0 2px">Tahminler: et Samsun kasabı (kıyma 900, göğüs 280, kemiksiz but 250 TL/kg), diğerleri Kasım 2026 zincir market raf fiyatları. Tutar yazmadığın ürün sepete tahmini fiyatla girer.</p>
      <div class="btns" style="margin-top:12px"><button class="btn ghost" data-sifirla="1" style="flex:1">Sepeti boşalt</button></div></section>`;
}
function arsivle(g){
  const s = sepet(g); if(!s.sec.length) return false;
  const id = S.bas + '-' + g, kayit = {id, grup: g, tarih: g === 'A' ? S.bas : addDays(S.bas, 14), kaydedildi: bugun(), toplam: Math.round(s.top * 100) / 100,
    kalem: s.sec.map(r => ({key: r.ekstra ? 'x:' + r.name.toLocaleLowerCase('tr') : r.key, ad: r.name, miktar: r.ekstra ? '' : r.qty, tahmin: r.cost, tl: r.ekstra ? r.ekstra.tl : S.fiyat[r.k] ?? null}))};
  S.gecmis = [kayit, ...S.gecmis.filter(x => x.id !== id)].sort((x, y) => y.tarih.localeCompare(x.tarih)).slice(0, 36);
  return true;
}
function openFiyat(k){
  const r = [...grupRows('A'), ...grupRows('B')].find(x => x.k === k); if(!r) return;
  const f = r.ekstra ? r.ekstra.tl : S.fiyat[k], son = r.ekstra ? null : sonFiyat(r.key);
  openSheet(`${head(r.name)}<div class="note" style="color:var(--ink)">${r.ekstra ? 'Listeye sonradan eklediğin ürün.' : `${esc(r.qty)}${r.cost != null ? ` · tahmin <b>${esc(tl.format(r.cost))}</b>` : ''}`}${son ? `<br>Geçen sefer ödediğin: <b>${esc(tl2.format(son.tl))}</b> (${esc(dayLabel(son.tarih, {day:'numeric', month:'long'}))})` : ''}</div>
    <label class="field"><span class="label">Ödediğin tutar (bu miktarın toplamı)</span><input id="fGir" inputmode="decimal" autocomplete="off" placeholder="${r.cost != null ? esc(String(r.cost)) : 'Örn. 125,50'}" value="${f != null ? esc(String(f).replace('.', ',')) : ''}" style="font:inherit;font-size:20px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></label>
    <div class="btns"><button class="btn" id="fKaydet" style="flex:1">Kaydet ve sepete ekle</button>${f != null || r.ekstra ? `<button class="btn ghost" id="fSil">${r.ekstra ? 'Ürünü sil' : 'Tahmine dön'}</button>` : ''}</div>`, 'Fiyat');
  const inp = document.getElementById('fGir'); setTimeout(() => inp.focus(), 250);
  const kaydet = () => { const v = tutar(inp.value); if(v === null) return toast('Tutarı rakamla yaz, örn. 125,50'); if(r.ekstra) r.ekstra.tl = v; else S.fiyat[k] = v; S.alindi[k] = 1; save(); closeSheet(); keepScroll(); toast(r.name + ': ' + tl2.format(v)); };
  document.getElementById('fKaydet').onclick = kaydet; inp.addEventListener('keydown', e => { if(e.key === 'Enter') kaydet(); });
  const sil = document.getElementById('fSil'); if(sil) sil.onclick = () => { if(r.ekstra){ S.ekstra = S.ekstra.filter(e => e.id !== r.ekstra.id); delete S.alindi[k]; } else delete S.fiyat[k]; save(); closeSheet(); keepScroll(); };
}
function openEkstra(g){
  openSheet(`${head('Listede olmayan ürün')}<label class="field"><span class="label">Ürün</span><input id="eAd" maxlength="60" autocomplete="off" placeholder="Örn. Çay 1 kg" style="font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></label>
    <label class="field"><span class="label">Ödediğin tutar</span><input id="eTl" inputmode="decimal" autocomplete="off" placeholder="Örn. 89,90" style="font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></label>
    <button class="btn" id="eKaydet">Sepete ekle</button>`, 'Ürün ekle');
  setTimeout(() => document.getElementById('eAd').focus(), 250);
  document.getElementById('eKaydet').onclick = () => { const ad = document.getElementById('eAd').value.trim(), v = tutar(document.getElementById('eTl').value);
    if(!ad) return toast('Ürün adını yaz'); if(v === null) return toast('Tutarı rakamla yaz, örn. 89,90');
    const e = {id: uid(), grup: g, ad, tl: v}; S.ekstra.push(e); S.alindi[g + ':x-' + e.id] = 1; save(); closeSheet(); keepScroll(); toast(ad + ' sepete eklendi'); };
}
function openGecmis(id){
  const g = S.gecmis.find(x => x.id === id); if(!g) return;
  openSheet(`${head(dayLabel(g.tarih, {day:'numeric', month:'long', year:'numeric'}))}<div class="note">${g.grup === 'A' ? 'Ana alışveriş' : 'Tazeleme'} · ${g.kalem.length} ürün · toplam <b style="color:var(--ink)">${esc(tl2.format(g.toplam))}</b></div>
    <div class="items">${g.kalem.map(k => { const d = k.tl != null && k.tahmin != null ? k.tl - k.tahmin : null;
      return `<div class="item"><span class="mid"><b>${esc(k.ad)}</b><small>${esc(k.miktar || '')}${k.tahmin != null ? ' · tahmin ' + esc(tl.format(k.tahmin)) : ''}${d ? ` · <span style="color:${d > 0 ? 'var(--out)' : 'var(--in)'}">${d > 0 ? '+' : '−'}${esc(tl.format(Math.abs(d)))}</span>` : ''}</small></span><span class="amt num">${k.tl != null ? esc(tl2.format(k.tl)) : `<span style="color:var(--muted)">≈ ${esc(tl.format(k.tahmin || 0))}</span>`}</span></div>`; }).join('')}</div>
    <p class="note" style="margin:0">≈ olanlara fiyat yazılmamış, tahmin sayıldı. Bu kaydı güncellemek için o dönemin listesinde fiyatları düzeltip tekrar kaydet.</p>
    <button class="btn ghost" id="gSil">Bu kaydı sil</button>`, 'Geçmiş alışveriş');
  let onay = 0; document.getElementById('gSil').onclick = e => { if(Date.now() - onay > 3000){ onay = Date.now(); e.target.textContent = 'Emin misin? Tekrar dokun'; return; } S.gecmis = S.gecmis.filter(x => x.id !== id); save(); closeSheet(); keepScroll(); toast('Kayıt silindi'); };
}
const keepScroll = () => { const y = scrollY; render(); scrollTo(0, y); };

/* ---------- pencereler ---------- */
let geriFn = null;
function openSheet(html, label, geri){ geriFn = geri || null; sheetRoot.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="in"><div class="grab"></div>${html}</div></div>`;
  sheetRoot.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheetAnimated); return sheetRoot.querySelector('.sheet'); }
const head = t => `<div class="sec-head" style="margin:0"><h2>${esc(t)}</h2><button class="icon-btn" data-close>Kapat</button></div>`;
function closeSheet(){ geriFn = null; sheetRoot.innerHTML = ''; }
function closeSheetAnimated(){ if(geriFn){ const g = geriFn; geriFn = null; return g(); } const sh = sheetRoot.querySelector('.sheet'), sc = sheetRoot.querySelector('.scrim'); if(!sh) return closeSheet();
  sh.style.transition = 'transform .2s ease-in'; sh.style.transform = 'translateY(105%)'; if(sc){ sc.style.transition = 'opacity .2s'; sc.style.opacity = '0'; } setTimeout(closeSheet, 200); }
/*SWIPE*/
document.addEventListener('keydown', e => { if(e.key === 'Escape' && sheetRoot.innerHTML) closeSheetAnimated(); });
function openTarif(id){
  const r = R[id];
  openSheet(`${head(r.name)}<div class="chips"><span class="tag ${r.kind}">${esc(TUR[r.kind])}</span><span class="tag">${esc(r.time)}</span><span class="tag">${esc(r.serves)}</span></div>
    <div><div class="label" style="margin-bottom:8px">Malzemeler</div><div class="items" style="padding:10px 14px"><ul style="margin:0;padding-left:18px;display:grid;gap:6px">${r.ing.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div></div>
    <div><div class="label" style="margin-bottom:8px">Yapılışı</div>${stepList(r.steps)}</div>${r.note ? `<p class="note" style="margin:0">💡 ${esc(r.note)}</p>` : ''}`, r.name);
}

/* ---------- olaylar ---------- */
const gec = tab => { view.tab = tab; render(); window.scrollTo(0, 0); history.replaceState(null, '', '#' + tab); };
document.querySelectorAll('nav .tab').forEach(b => b.onclick = () => { if(b.dataset.tab === 'gun' && view.tab === 'gun') view.gun = bugun(); gec(b.dataset.tab); });
let sifirOnay = 0;
main.addEventListener('click', e => {
  const t = e.target.closest('[data-gun],[data-git],[data-tarif],[data-yeniay],[data-sifirla],[data-fiyat],[data-ekstra],[data-bitir],[data-gecmis]'); if(!t) return;
  const d = t.dataset;
  if(d.gun){ view.gun = d.gun; render(); return; }
  if(d.git){ view.gun = d.git; gec('gun'); return; }
  if(d.tarif) return openTarif(d.tarif);
  if(d.fiyat) return openFiyat(d.fiyat);
  if(d.ekstra) return openEkstra(d.ekstra);
  if(d.gecmis) return openGecmis(d.gecmis);
  if(d.bitir){ if(arsivle(d.bitir)){ save(); keepScroll(); toast('Kaydedildi, geçmiş alışverişlerde'); } return; }
  if(d.yeniay){ arsivle('A'); arsivle('B'); S = {...blank(), bas: bugun(), gecmis: S.gecmis}; save(); view.gun = bugun(); render(); toast('Yeni ay başladı: bugün alışveriş günü'); return; }
  if(d.sifirla){ if(Date.now() - sifirOnay > 3000){ sifirOnay = Date.now(); t.textContent = 'Emin misin? Tekrar dokun'; return; } S.alindi = {}; S.fiyat = {}; S.ekstra = []; save(); render(); toast('Sepet boşaltıldı; geçmiş kayıtlar duruyor'); }
});
main.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.tik !== undefined){ if(el.checked) S.tik[el.dataset.tik] = 1; else delete S.tik[el.dataset.tik];
    // eski günlerin işaretleri birikmesin
    const sinir = addDays(bugun(), -7); for(const k of Object.keys(S.tik)) if(k.slice(0, 10) < sinir) delete S.tik[k]; save(); return; }
  if(el.dataset.al !== undefined){ if(el.checked) S.alindi[el.dataset.al] = 1; else delete S.alindi[el.dataset.al]; save(); const y = scrollY; render(); scrollTo(0, y); return; }
  if(el.id === 'basGun' && /^\d{4}-\d{2}-\d{2}$/.test(el.value)){ S.bas = el.value; save(); render(); toast('Menü ' + dayLabel(S.bas, {day:'numeric', month:'long'}) + ' alışverişine göre ayarlandı'); }
});

/* ---------- tek seferlik ipuçları ---------- */
const TIP_KEY = 'ipuclari-v1';
const tipSeen = () => { try { return JSON.parse(localStorage.getItem(TIP_KEY) || '{}') || {}; } catch(e){ return {}; } };
const tipMark = k => { try { const s = tipSeen(); s[k] = 1; localStorage.setItem(TIP_KEY, JSON.stringify(s)); } catch(e){} };
const TIPS = {
  'm-gun': [['.dish', 'Bu akşamın yemeği', 'Tarihe göre o günün menüsü açılır. Oklarla ya da haftadaki günlere dokunarak başka günün yemeğine bak.'],
    ['.ing', 'Malzemeler', 'Hazırladığın malzemeye dokun, üstü çizilsin.']],
  'm-takvim': [['.items', 'Ayın menüsü', 'Bir güne dokun, o günün tarifi açılır. ↻ olanlar bir önceki günün tenceresinden.']],
  'm-liste': [['.shop', 'Alışveriş listesi', 'Sepete koyduğun ürünü işaretle, üstteki tutar artar. Fiyat farklıysa sağdaki tutara dokunup ödediğini yaz.']]
};
const currentTipKey = () => 'm-' + view.tab;
/*TIPENGINE*/

render(); snapYaz();
addEventListener('pageshow', e => { if(e.persisted) render(); });
document.addEventListener('visibilitychange', () => { if(!document.hidden && !sheetRoot.innerHTML) render(); });
if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
</script>
</body>
</html>
