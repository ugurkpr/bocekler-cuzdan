<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Böcekler">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Böcekler Cüzdan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: tek sütun telefon uygulaması — üstte ay seçici, ortada sekme içeriği, altta sabit sekme çubuğu + ekle düğmesi */
:root{
  --bg:#FFF6EA; --surface:#FFFFFF; --sunk:#FBEAD5; --line:#F0DAC0;
  --ink:#2A1A0E; --muted:#7D6250;
  --accent:#C85F00; --accent-ink:#FFFFFF; --accent-soft:#FFE2C2;
  --hero:linear-gradient(135deg,#F28A12 0%,#C9520A 100%);
  --in:#1F9D55; --out:#E5484D; --warn:#F5A300;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140E09; --surface:#20170F; --sunk:#2C2016; --line:#3B2C1F;
  --ink:#FFF1E2; --muted:#C4A78D;
  --accent:#FF9F43; --accent-ink:#1E1208; --accent-soft:#4A2E12;
  --hero:linear-gradient(135deg,#FFB053 0%,#F07A1A 100%);
  --in:#3DD68C; --out:#FF6B6B; --warn:#FFC53D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140E09; --surface:#20170F; --sunk:#2C2016; --line:#3B2C1F;
  --ink:#FFF1E2; --muted:#C4A78D;
  --accent:#FF9F43; --accent-ink:#1E1208; --accent-soft:#4A2E12;
  --hero:linear-gradient(135deg,#FFB053 0%,#F07A1A 100%);
  --in:#3DD68C; --out:#FF6B6B; --warn:#FFC53D; color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px calc(160px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:6px 14px}
.brand{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.05;letter-spacing:-.01em;min-width:0}
.brand small{display:block;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.month button:hover{background:var(--sunk)}
.month .mlabel{width:auto;min-width:96px;padding:0 6px;border-radius:999px;font-size:14px;font-weight:600}
.top-r{display:flex;align-items:center;gap:6px}
.gear{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.gear svg{width:20px;height:20px}
.gear[aria-current="page"]{color:var(--accent);border-color:var(--accent)}

/* summary */
.hero{background:var(--hero);color:var(--accent-ink);border-radius:20px;padding:18px 18px 16px;display:grid;gap:14px}
.hero .label{color:inherit;opacity:.75}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,46px);line-height:1;letter-spacing:-.02em}
.hero .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .cell{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);border-radius:12px;padding:10px 12px}
.hero .cell b{display:block;font-size:17px;font-weight:600;margin-top:2px}

section{margin-top:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-head h2{font-size:19px}
.sec-head small{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* budget bars */
.bars{display:grid;gap:14px}
.plain{display:grid;gap:0;margin-top:14px;padding-top:6px;border-top:1px solid var(--line)}
.plain:first-child{margin-top:0;padding-top:0;border-top:0}
.plain .label{margin-bottom:4px}
.plain div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;font-size:14px}
.plain div span:last-child{font-weight:500}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px}
.bar-top span:first-child{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-top span:last-child{color:var(--muted);white-space:nowrap}
.track{position:relative;height:10px;border-radius:6px;background:var(--sunk);overflow:visible}
.fill{height:100%;border-radius:6px;background:var(--in)}
.fill.near{background:var(--warn)} .fill.over{background:var(--out)}
.limit{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.pill.near{background:color-mix(in srgb,var(--warn) 22%,transparent);color:color-mix(in srgb,var(--warn) 55%,var(--ink))}
.pill.over{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}

/* trend */
.trend svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* list */
.day{margin-top:14px}
.day:first-child{margin-top:0}
.day h3{display:flex;justify-content:space-between;gap:8px;font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.items{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item:hover{background:var(--sunk)}
.dot{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-family:var(--display);font-size:15px;background:var(--sunk);color:var(--muted)}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mid small{color:var(--muted);font-size:13px}
.amt{font-weight:600;white-space:nowrap}
.amt.in{color:var(--in)} .amt.out{color:var(--ink)}
.rec{font-size:11px;color:var(--accent);font-weight:600;margin-left:6px}

.empty{text-align:center;color:var(--muted);padding:26px 14px}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:17px;margin-bottom:4px}

/* settings */
.profile{display:flex;align-items:center;gap:14px}
.avatar{flex:none;width:68px;height:68px;border-radius:22px;overflow:hidden;cursor:pointer;position:relative;background:var(--sunk);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar span{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px;font-weight:700;border:2px solid var(--surface)}
.profile .who{flex:1;min-width:0;display:grid;gap:2px}
.pname{font-family:var(--display);font-size:22px;font-weight:700;border:0;background:none;padding:2px 0;border-bottom:2px dashed transparent;border-radius:0}
.pname:focus{outline:none;border-bottom-color:var(--accent)}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.pstats div{background:var(--sunk);border-radius:12px;padding:10px;display:grid;gap:2px}
.pstats b{font-family:var(--display);font-size:18px}
.pstats small{font-size:12px;color:var(--muted)}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.set-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0;padding-top:0}
.set-row .name{flex:1;min-width:0}
.set-row input{width:110px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:36px;padding:0 10px;font-size:13px}
.icon-btn.danger{color:var(--out)}
.note{font-size:13px;color:var(--muted)}
.mode{display:flex;gap:10px;align-items:flex-start}
.mode i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--in);margin-top:6px}
.mode i.local{background:var(--warn)}

input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:90px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--out);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
nav.tabs button.tab{border:0;background:none;padding:8px 0;font-size:12px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:2px}
nav.tabs button.tab svg{width:22px;height:22px}
nav.tabs button.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:6;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--hero);color:var(--accent-ink);font-size:32px;line-height:1;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent)}
.fab:active{transform:scale(.95)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .38);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-radius:22px 22px 0 0;max-height:92%;overflow:auto;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:grid;gap:14px}
.grab{height:26px;margin:-10px -16px -6px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab::before{content:'';width:44px;height:5px;border-radius:3px;background:var(--line)}
.sheet.dragging{transition:none!important;animation:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:10px;padding:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.amount-in{font-family:var(--display);font-size:34px;font-weight:700;border:0;border-bottom:2px solid var(--line);border-radius:0;background:none;padding:4px 0}
.amount-in:focus-visible{outline:none;border-bottom-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.field{display:grid;gap:6px}

/* savings */
.assets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.asset{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;min-width:0}
.asset:last-child{grid-column:span 2}
.asset .q{font-family:var(--display);font-size:21px;font-weight:700;overflow-wrap:anywhere}
.asset small{color:var(--muted);font-size:13px}
.streak{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.streak div{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted)}
.streak b{width:100%;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:var(--sunk);color:var(--muted)}
.streak b.ok{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.streak b.neg{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.streak .cur{color:var(--ink);font-weight:600}
.savstat{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;width:100%;text-align:left}
.savstat .badge{grid-row:span 2;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;font-weight:700}
.savstat b{font-weight:600}
.savstat small{color:var(--muted);font-size:13px}
.savstat .track{grid-column:1/-1;margin-top:8px}
.badge.ok{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)} .badge.no{background:var(--sunk);color:var(--muted)} .badge.neg{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{font-size:14px;color:var(--muted)}
/* payments */
.alert{display:grid;gap:6px;width:100%;text-align:left;background:color-mix(in srgb,var(--warn) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.alert.late{background:color-mix(in srgb,var(--out) 9%,var(--surface));border-color:color-mix(in srgb,var(--out) 40%,transparent)}
.alert b{font-weight:600}
.alert div{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.alert div span:last-child{color:var(--muted);white-space:nowrap}
.debt{display:grid;gap:10px}
.debt + .debt{margin-top:10px}
.debt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.debt-top b{font-size:16px;font-weight:600}
.debt-top small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.amtbig{font-family:var(--display);font-size:23px;font-weight:700}
.st{flex:none;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.st.paid{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.st.soon,.st.today{background:color-mix(in srgb,var(--warn) 24%,transparent);color:color-mix(in srgb,var(--warn) 55%,var(--ink))}
.st.late{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:10px}
/* daily calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal button{border:0;border-radius:9px;min-height:46px;padding:5px 1px 4px;display:grid;align-content:space-between;justify-items:center;background:var(--sunk);font-size:13px;font-weight:600;color:var(--ink)}
.cal button small{font-size:10px;font-weight:500;color:var(--ink);opacity:.75;font-variant-numeric:tabular-nums}
.cal button.fut{opacity:.4}
.cal button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cal button[aria-pressed="true"] small{color:inherit;opacity:1}
.daystats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.daystats b{color:var(--ink);font-weight:600}
.day h3 span:last-child{text-transform:none;letter-spacing:0;color:var(--ink)}
/* month picker */
.ynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ynav b{font-family:var(--display);font-size:24px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 4px;font-weight:600}
.mgrid button.now{border-color:var(--accent);color:var(--accent)}
.mgrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(156px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">Böcekler<small>Cüzdan</small></div>
    <div class="top-r">
      <div class="month" role="group" aria-label="Ay seçimi">
        <button id="prevM" aria-label="Önceki ay">‹</button>
        <button id="monthLbl" class="mlabel num" aria-label="Ay ve yıl seç"></button>
        <button id="nextM" aria-label="Sonraki ay">›</button>
      </div>
    </div>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="Sekmeler"><div class="in">
  <button class="tab" data-tab="ozet" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Özet</button>
  <button class="tab" data-tab="liste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Hareketler</button>
  <button class="tab" data-tab="odeme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20M6 15h4"/></svg>Ödemeler</button>
  <button class="tab" data-tab="birikim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Birikim</button>

  <button class="tab" data-tab="ayar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>Profil</button>
</div></nav>
<button class="fab" id="addBtn" aria-label="Kayıt ekle">+</button>

<div id="sheetRoot"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(() => {
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const tl0 = new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}), tl2 = new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',minimumFractionDigits:2,maximumFractionDigits:2});
const tl = { format: n => (Math.round(n*100)%100 ? tl2 : tl0).format(n) };
const tlShort = n => n>=1e6 ? (n/1e6).toLocaleString('tr-TR',{maximumFractionDigits:1})+' Mn' : n>=1e3 ? (n/1e3).toLocaleString('tr-TR',{maximumFractionDigits:1})+' B' : String(Math.round(n));
const pad = n => String(n).padStart(2,'0');
const now = new Date();
const todayYM = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
const todayISO = `${todayYM}-${pad(now.getDate())}`;
const ymAdd = (ym,d) => { let [y,m]=ym.split('-').map(Number); m+=d; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return `${y}-${pad(m)}`; };
const ymLabel = ym => { const [y,m]=ym.split('-').map(Number); return `${AYLAR[m-1]} ${y}`; };
const daysIn = ym => { const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); };
const dayLabel = (iso, opt={day:'numeric',month:'long',weekday:'long'}) => new Date(iso+'T12:00').toLocaleDateString('tr-TR', opt);
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseAmt = v => { v=String(v).trim().replace(/[\s₺]/g,''); if(v.includes(',')) v=v.replace(/\./g,'').replace(',','.'); const n=parseFloat(v); return isFinite(n)&&n>0 ? Math.round(n*100)/100 : null; };

const defaultSettings = () => ({
  cats: [
    ['market','Market','out'],['kira','Kira','out'],['fatura','Faturalar','out'],['ulasim','Ulaşım','out'],
    ['yemek','Yeme-İçme','out'],['eglence','Eğlence','out'],['giyim','Giyim','out'],['saglik','Sağlık','out'],
    ['abonelik','Abonelikler','out'],['diger','Diğer','out'],
    ['maas','Maaş','in'],['ek','Ek gelir','in'],['digergelir','Diğer gelir','in']
  ].map(([id,name,t])=>({id,name,t,budget:0})),
  recurring: [],
  debts: []
});

let S = { settings: defaultSettings(), months: {}, rates: {} };
const ASSETS = [
  {id:'GRA', name:'Gram altın', unit:'gr'},
  {id:'CEYREK', name:'Çeyrek altın', unit:'adet'},
  {id:'USD', name:'Dolar', unit:'$'},
  {id:'EUR', name:'Euro', unit:'€'},
  {id:'TRY', name:'Türk lirası', unit:'₺'},
];
const asset = id => ASSETS.find(a=>a.id===id) || ASSETS[4];
const rate = id => id==='TRY' ? 1 : (Number(S.rates[id])||0);
const qtyFmt = (id,q) => { q=Math.abs(q); if(id==='TRY') return tl.format(q); const n=q.toLocaleString('tr-TR',{maximumFractionDigits:id==='CEYREK'?0:2}); return id==='USD'?'$'+n : id==='EUR'?'€'+n : id==='GRA'? n+' gr' : n+' adet'; };
const savFor = ym => (S.months[ym] && S.months[ym].sav) || [];
const savMonthTL = ym => savFor(ym).reduce((a,x)=>a + x.dir*x.qty*x.rate, 0);
function holdings(){ const h={}; for(const m of Object.values(S.months)) for(const x of (m.sav||[])) h[x.asset]=(h[x.asset]||0)+x.dir*x.qty; return h; }
const fmtAt = at => { if(!at) return ''; const d=new Date(String(at).replace(' ','T')); return isNaN(d) ? String(at) : d.toLocaleString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); };
async function fetchRates(manual){
  try {
    const r = await fetch('https://finans.truncgil.com/v4/today.json', {cache:'no-store'});
    const d = await r.json();
    const g = k => Number(d[k] && d[k].Buying);
    const n = {USD:g('USD'), EUR:g('EUR'), GRA:g('GRA'), CEYREK:g('CEYREKALTIN')};
    if(!Object.values(n).every(v=>v>0)) throw new Error('eksik');
    S.rates = {...n, at: d.Update_Date || new Date().toISOString(), ts: Date.now()};
    saveLocal(); render(); if(manual) toast('Kurlar güncellendi');
  } catch(e){ if(manual) toast('Kurlar alınamadı. İnterneti kontrol et ya da kurları elle yaz.'); }
}
let view = { ym: todayYM, tab: 'ozet', day: null };
let mode = 'loading';  // 'db' | 'local' | 'loading'
let col = null;

/* ---------- storage ---------- */
const LS_KEY = 'cuzdan-defteri-v1';
function loadLocal(){
  try { const raw = localStorage.getItem(LS_KEY); if(raw){ const d=JSON.parse(raw); if(d&&d.settings){ S=d; S.rates=S.rates||{}; S.settings.debts=S.settings.debts||[]; } } } catch(e){}
}
function saveLocal(){
  writeReminders();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ toast('Tarayıcı kaydı kapalı. Yedeği Ayarlar’dan dışa aktar.'); }
}
const pending = {}, running = {};
function queueWrite(id, data){
  pending[id] = data;
  if(!running[id]) flush(id);
}
async function flush(id){
  running[id] = true;
  while(pending[id] !== undefined){
    const d = pending[id]; delete pending[id];
    try { d === null ? await col.doc(id).delete() : await col.doc(id).set(d); }
    catch(e){
      if(e && e.code === 'unavailable'){
        await new Promise(r=>setTimeout(r, 800+Math.random()*800));
        try { d === null ? await col.doc(id).delete() : await col.doc(id).set(d); continue; } catch(_){}
      }
      if(e && e.code === 'quota_exceeded') toast('Depolama dolu. Eski ayları silip tekrar dene.');
      else if(e && e.code === 'invalid_argument') toast('Kaydedilemedi: bu sayfaya yazma iznin yok.');
      else toast('Kaydedilemedi. Bağlantını kontrol edip tekrar dene.');
    }
  }
  running[id] = false;
}
function saveMonth(ym){
  if(mode==='db') queueWrite('m-'+ym, S.months[ym] || {items:[],skip:[]});
  else saveLocal();
}
function saveSettings(){
  if(mode==='db') queueWrite('settings', S.settings);
  else saveLocal();
}

async function init(){
  render();
  let db=null, user=null;
  if(window.claude && typeof window.claude.use === 'function'){
    try { [db,user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch(e){}
  }
  const id = user ? await user.id() : null;
  if(db && id){
    mode = 'db';
    col = db.collection('data/users/'+id);
    col.onSnapshot(snap => {
      const next = { settings: defaultSettings(), months: {} };
      for(const d of snap.docs){
        const body = JSON.parse(JSON.stringify(d.data()||{}));
        if(d.id==='settings'){ if(Array.isArray(body.cats)) next.settings = { cats: body.cats, recurring: body.recurring||[] }; }
        else if(d.id.startsWith('m-')) next.months[d.id.slice(2)] = { items: body.items||[], skip: body.skip||[] };
      }
      S = next; render();
    }, () => { toast('Bağlantı koptu. Sayfayı yenile.'); });
  } else {
    mode = 'local'; loadLocal(); render();
    if(!S.rates.ts || Date.now()-S.rates.ts > 3*3600e3) fetchRates(false);
  }
}

/* ---------- derived data ---------- */
const cat = id => S.settings.cats.find(c=>c.id===id) || {id, name:'Silinmiş kategori', t:'out', budget:0};
const monthDoc = ym => { const m = S.months[ym] || (S.months[ym] = {items:[], skip:[], sav:[], pay:{}}); m.sav = m.sav||[]; m.pay = m.pay||{}; return m; };
function entriesFor(ym){
  const m = S.months[ym] || {items:[], skip:[]};
  const list = m.items.map(x=>({...x}));
  for(const r of S.settings.recurring){
    if(ym < r.from || (r.until && ym > r.until) || (m.skip||[]).includes(r.id)) continue;
    list.push({ id:'r:'+r.id, rid:r.id, t:r.t, amt:r.amt, cat:r.cat, note:r.note,
      date:`${ym}-${pad(Math.min(r.day, daysIn(ym)))}`, rec:true });
  }
  return list.sort((a,b)=> b.date.localeCompare(a.date) || (b.rec?0:1)-(a.rec?0:1));
}
function totals(ym){
  let inc=0, out=0; const byCat={};
  for(const e of entriesFor(ym)){
    if(e.t==='in') inc+=e.amt; else { out+=e.amt; byCat[e.cat]=(byCat[e.cat]||0)+e.amt; }
  }
  return {inc, out, byCat};
}

/* ---------- render ---------- */
const main = document.getElementById('main');
function render(){
  document.getElementById('monthLbl').textContent = ymLabel(view.ym);
  applyTheme();
  document.querySelectorAll('nav .tab').forEach(b => { if(b.dataset.tab===view.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if(mode==='loading'){ main.innerHTML = `<div class="empty"><b>Defter açılıyor</b>Kayıtların yükleniyor…</div>`; return; }
  main.innerHTML = view.tab==='ozet' ? renderSummary() : view.tab==='liste' ? renderList() : view.tab==='birikim' ? renderSavings() : view.tab==='odeme' ? renderDebts() : renderSettings();
  if(view.tab==='ayar') bindSettings();
  if(view.tab==='birikim') bindSavings();
  if(view.tab==='odeme') bindDebts();
}

function renderSummary(){
  const {inc,out,byCat} = totals(view.ym);
  const left = inc - out;
  const hasAny = entriesFor(view.ym).length > 0;
  const limited = S.settings.cats.filter(c=>c.t==='out' && c.budget>0);
  const orphan = Object.keys(byCat).filter(id=>!S.settings.cats.some(c=>c.id===id)).map(cat);
  const unlimited = [...S.settings.cats.filter(c=>c.t==='out' && !(c.budget>0) && byCat[c.id]), ...orphan]
    .sort((a,b)=>byCat[b.id]-byCat[a.id]);
  const plain = unlimited.length ? `<div class="plain"><span class="label">Limitsiz</span>${unlimited.map(c=>`<div><span>${esc(c.name)}</span><span class="num">${tl.format(byCat[c.id])}</span></div>`).join('')}</div>` : '';
  const rows = limited.map(c => {
    const spent = byCat[c.id]||0, b = c.budget||0;
    const scale = Math.max(spent, b) || 1;
    const ratio = b ? spent/b : 0;
    const cls = b ? (ratio>1 ? 'over' : ratio>=.8 ? 'near' : '') : '';
    const pill = cls==='over' ? `<span class="pill over">${tl.format(spent-b)} aştı</span>` : cls==='near' ? `<span class="pill near">%${Math.round(ratio*100)}</span>` : '';
    return { spent, html: `<div>
      <div class="bar-top"><span>${esc(c.name)}${pill}</span><span class="num">${tl.format(spent)}${b?` / ${tl.format(b)}`:''}</span></div>
      <div class="track"><div class="fill ${cls}" style="width:${(spent/scale*100).toFixed(1)}%"></div>${b?`<div class="limit" style="left:calc(${(b/scale*100).toFixed(1)}% - 1px)" title="Limit"></div>`:''}</div>
    </div>`};
  }).sort((a,b)=>b.spent-a.spent).map(r=>r.html).join('');

  return `${alertsHTML()}
  <div class="hero">
    <div><div class="label">${ymLabel(view.ym)} · kalan</div><div class="big num">${left<0?'−':''}${tl.format(Math.abs(left))}</div></div>
    <div class="row">
      <div class="cell"><span class="label">Gelir</span><b class="num">${tl.format(inc)}</b></div>
      <div class="cell"><span class="label">Gider</span><b class="num">${tl.format(out)}</b></div>
    </div>
  </div>
  ${savCard(view.ym)}
  ${!hasAny ? `<section><div class="card empty"><b>Bu ay henüz kayıt yok</b>Alttaki <strong>+</strong> düğmesiyle ilk gelirini ya da harcamanı ekle. Maaş, kira gibi her ay tekrarlananları bir kez “her ay tekrarla” diye eklemen yeterli.</div></section>`:''}
  <section>
    <div class="sec-head"><h2>Kategoriler ve bütçe</h2><small>Çizgi = aylık limit</small></div>
    <div class="card">${rows ? `<div class="bars">${rows}</div>` : `<div class="note">Henüz limitli kategori yok. Limit koymak için Ayarlar’a geç.</div>`}${plain}</div>
  </section>
  <section class="trend">
    <div class="sec-head"><h2>${chartMonths().length>1?'Son '+chartMonths().length+' ay':'Bu ay'}</h2><small>Gelir ve gider</small></div>
    <div class="card">${trendSVG()}
      <div class="legend"><span><i style="background:var(--in)"></i>Gelir</span><span><i style="background:var(--out)"></i>Gider</span></div>
    </div>
  </section>`;
}

function firstYM(){
  let f = null; const take = ym => { if(ym && (!f || ym<f)) f = ym; };
  for(const [ym,m] of Object.entries(S.months)) if((m.items||[]).length || (m.sav||[]).length) take(ym);
  for(const r of S.settings.recurring) take(r.from);
  return f;
}
function chartMonths(){
  const f = firstYM(); const out = [];
  for(let i=5;i>=0;i--){ const ym = ymAdd(view.ym,-i); if(!f || ym>=f) out.push(ym); }
  return out.length ? out : [view.ym];
}
function trendSVG(){
  const months = chartMonths(), n = months.length;
  const data = months.map(ym=>({ym, ...totals(ym)}));
  const max = Math.max(1000, ...data.flatMap(d=>[d.inc,d.out]));
  const nice = (()=>{ const p=Math.pow(10,Math.floor(Math.log10(max))); for(const k of [1,2,2.5,5,10]) if(k*p>=max) return k*p; return 10*p; })();
  const W=340,H=170,L=38,B=24,T=8, ih=H-B-T, gw=(W-L)/n, bw=Math.min(n<4?22:16,gw/3.2);
  const y = v => T + ih - v/nice*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Aylara göre gelir ve gider grafiği">`;
  for(let i=0;i<=2;i++){ const v=nice*i/2; s+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${tlShort(v)}</text>`; }
  data.forEach((d,i)=>{
    const cx = L + gw*i + gw/2, cur = d.ym===view.ym;
    s += `<rect x="${cx-bw-1}" y="${y(d.inc)}" width="${bw}" height="${Math.max(0,ih+T-y(d.inc))}" rx="3" fill="var(--in)" opacity="${cur?1:.55}"/>`;
    s += `<rect x="${cx+1}" y="${y(d.out)}" width="${bw}" height="${Math.max(0,ih+T-y(d.out))}" rx="3" fill="var(--out)" opacity="${cur?1:.55}"/>`;
    s += `<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" fill="${cur?'var(--ink)':'var(--muted)'}" font-weight="${cur?600:400}">${AYLAR[+d.ym.slice(5)-1].slice(0,3)}</text>`;
  });
  return s + `</svg>`;
}

function savCard(ym){
  const v = savMonthTL(ym), n = savFor(ym).length, tgt = S.settings.savTarget||0;
  const cls = v>0 ? 'ok' : v<0 ? 'neg' : 'no';
  const head = v>0 ? `${tl.format(v)} birikim yapıldı` : v<0 ? `Birikimden ${tl.format(-v)} çekildi` : 'Birikim yapılmadı';
  const sub = tgt ? (v>=tgt ? `Aylık hedef (${tl.format(tgt)}) tamamlandı` : `Hedef ${tl.format(tgt)} · ${tl.format(Math.max(0,tgt-v))} kaldı`)
                  : (n ? 'Ayrıntılar Birikim sekmesinde' : 'Altın, döviz ya da TL birikimini Birikim sekmesinden ekle');
  const bar = tgt ? `<div class="track"><div class="fill ${v>=tgt?'':'near'}" style="width:${Math.max(0,Math.min(100,v/tgt*100)).toFixed(1)}%"></div></div>` : '';
  return `<section><div class="sec-head"><h2>${ymLabel(ym)} birikimi</h2></div>
    <button class="card savstat" data-goto="birikim"><span class="badge ${cls}">${v>0?'✓':v<0?'↓':'–'}</span><b class="num">${head}</b><small>${sub}</small>${bar}</button></section>`;
}

function renderSavings(){
  const h = holdings(), r = S.rates;
  const total = ASSETS.reduce((a,x)=>a+(h[x.id]||0)*rate(x.id), 0);
  const missing = ASSETS.some(x=>h[x.id] && !rate(x.id));
  const months = chartMonths();
  const list = savFor(view.ym).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const tgt = S.settings.savTarget||0;
  return `
  <div class="hero">
    <div><div class="label">Toplam birikim · bugünkü kurla</div><div class="big num">${tl.format(total)}</div></div>
    <div class="note" style="color:inherit;opacity:.8">${r.at ? 'Kurlar: '+esc(fmtAt(r.at)) : 'Kurlar henüz alınmadı'}${missing?' · bazı kurlar eksik, aşağıdan yaz':''}</div>
  </div>
  <section><div class="assets">${ASSETS.map(a=>{ const q=h[a.id]||0; return `<div class="asset"><span class="label">${a.name}</span><span class="q num">${q<0?'−':''}${qtyFmt(a.id,q)}</span><small class="num">${a.id==='TRY'?'Nakit / hesap':rate(a.id)?'≈ '+tl.format(q*rate(a.id)):'Kur yok'}</small></div>`; }).join('')}</div></section>
  <section>
    <div class="sec-head"><h2>Aylara göre</h2><small>✓ birikim yapıldı</small></div>
    <div class="card"><div class="streak" style="grid-template-columns:repeat(${months.length},minmax(0,1fr))">${months.map(ym=>{ const v=savMonthTL(ym); const ok = tgt ? v>=tgt : v>0;
      return `<div><b class="${ok?'ok':v<0?'neg':''}" title="${esc(ymLabel(ym))}: ${esc(tl.format(v))}">${ok?'✓':v<0?'↓':v>0?'·':'–'}</b><span class="${ym===view.ym?'cur':''}">${AYLAR[+ym.slice(5)-1].slice(0,3)}</span></div>`; }).join('')}</div>
    ${tgt?`<div class="note" style="margin-top:10px">Hedef: ayda ${tl.format(tgt)}. Hedefin altında kalan aylar nokta ile gösterilir.</div>`:''}</div>
  </section>
  <section>
    <div class="sec-head"><h2>${ymLabel(view.ym)} hareketleri</h2></div>
    ${list.length ? `<div class="items">${list.map(x=>`<button class="item" data-sedit="${esc(x.id)}">
      <span class="dot">${x.asset==='GRA'||x.asset==='CEYREK'?'Au':asset(x.asset).unit}</span>
      <span class="mid"><b>${esc(x.note || asset(x.asset).name)}</b><small>${new Date(x.date+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long'})} · ${x.asset==='TRY'?'':esc(tl.format(x.rate))+' kurla'}</small></span>
      <span class="amt num ${x.dir>0?'in':'out'}">${x.dir>0?'+':'−'}${qtyFmt(x.asset,x.qty)}</span></button>`).join('')}</div>`
      : `<div class="card empty"><b>Bu ay birikim hareketi yok</b>Altın, döviz aldıysan ya da kenara para koyduysan aşağıdan ekle.</div>`}
    <div class="btns" style="margin-top:12px"><button class="btn" id="addSav" style="flex:1">Birikim ekle</button></div>
  </section>
  <section>
    <div class="sec-head"><h2>Kurlar</h2><small>Alış fiyatı, ₺</small></div>
    <div class="card" style="display:grid;gap:12px">
      <div class="rates">${ASSETS.filter(a=>a.id!=='TRY').map(a=>`<div class="field"><label class="label" for="rate-${a.id}">${a.name}</label><input class="num" id="rate-${a.id}" data-rate="${a.id}" inputmode="decimal" value="${rate(a.id)?String(rate(a.id)).replace('.',','):''}" placeholder="₺"></div>`).join('')}</div>
      <button class="btn ghost" id="refreshRates">Kurları internetten güncelle</button>
    </div>
  </section>
  <section>
    <div class="sec-head"><h2>Aylık birikim hedefi</h2><small>0 = hedef yok</small></div>
    <div class="card"><input class="num" id="savTarget" inputmode="decimal" value="${tgt||''}" placeholder="Örn. 5000" aria-label="Aylık birikim hedefi"></div>
  </section>`;
}

function bindSavings(){
  document.getElementById('addSav').onclick = () => openSavSheet(null);
  document.getElementById('refreshRates').onclick = () => fetchRates(true);
  main.querySelectorAll('[data-rate]').forEach(inp => inp.addEventListener('change', () => {
    const v = parseAmt(inp.value); if(!v){ toast('Geçerli bir kur yaz.'); return; }
    S.rates = {...S.rates, [inp.dataset.rate]: v, at: new Date().toISOString()}; saveLocal(); render(); toast('Kur kaydedildi');
  }));
  document.getElementById('savTarget').addEventListener('change', e => {
    const raw = e.target.value.trim(); const v = raw==='' || raw==='0' ? 0 : parseAmt(raw);
    if(v===null){ toast('Geçerli bir tutar yaz.'); return; }
    S.settings.savTarget = v; saveSettings(); render(); toast(v ? 'Hedef kaydedildi' : 'Hedef kaldırıldı');
  });
}

      <div class="two">

        <div class="field"><label class="label" for="sNote">Not</label><input id="sNote" maxlength="60" placeholder="İsteğe bağlı" value="${esc(st.note||'')}"></div>
      </div>

      ${editing?'<button class="btn ghost" id="sDel" style="color:var(--out)">Sil</button>':''}
    </div></div>`;
    const keep = () => { st.qty=document.getElementById('sQty').value; const r=document.getElementById('sRate'); if(r) st.rate=r.value; st.date=document.getElementById('sDate').value; st.note=document.getElementById('sNote').value; };
    const calc = () => { keep(); const q=parseAmt(st.qty), r = st.asset==='TRY'?1:parseAmt(st.rate); document.getElementById('sCalc').textContent = q&&r&&st.asset!=='TRY' ? `Karşılığı ≈ ${tl.format(q*r)}` : ''; };
    sheetRoot.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheetAnimated);
    sheetRoot.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{ keep(); st.dir=+b.dataset.dir; draw(); });
    sheetRoot.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>{ keep(); if(st.asset!==b.dataset.asset){ st.asset=b.dataset.asset; st.rate=rate(st.asset)||''; } draw(); });
    ['sQty','sRate'].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', calc); });
    calc();
    document.getElementById('sSave').onclick = () => {
      keep();
      const qty = parseAmt(st.qty); const r = st.asset==='TRY' ? 1 : parseAmt(st.rate);
      if(!qty) return toast('Miktarı yaz.');
      if(!r) return toast('Birim fiyatı yaz.');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(st.date)) return toast('Tarihi seç.');
      const ym = st.date.slice(0,7);
      if(editing){ const om=monthDoc(entry.date.slice(0,7)); om.sav=om.sav.filter(x=>x.id!==entry.id); saveMonth(entry.date.slice(0,7)); }
      monthDoc(ym).sav.push({id: editing?entry.id:uid(), dir:st.dir, asset:st.asset, qty, rate:r, date:st.date, note:st.note.trim()});
      saveMonth(ym); view.ym=ym; closeSheet(); render(); toast(editing?'Güncellendi':'Birikim kaydedildi');
    };
    const del = document.getElementById('sDel');
    if(del) del.onclick = () => { if(!del.dataset.armed){ del.dataset.armed=1; del.textContent='Silmek için tekrar dokun'; return; }
      const ym=entry.date.slice(0,7), m=monthDoc(ym); m.sav=m.sav.filter(x=>x.id!==entry.id); saveMonth(ym); closeSheet(); render(); toast('Silindi'); };
  };
  draw();
  if(!editing) setTimeout(()=>document.getElementById('sQty')?.focus(), 60);
}

function renderList(){
  const list = entriesFor(view.ym);
  const outBy = {}, inBy = {};
  list.forEach(e => { const o = e.t==='in' ? inBy : outBy; o[e.date] = (o[e.date]||0) + e.amt; });
  const dim = daysIn(view.ym), [y,m] = view.ym.split('-').map(Number);
  const lead = (new Date(y,m-1,1).getDay()+6)%7;
  const max = Math.max(1, ...Object.values(outBy));
  let cells = ['Pt','Sa','Ça','Pe','Cu','Ct','Pz'].map(w=>`<span class="wd">${w}</span>`).join('') + '<span></span>'.repeat(lead);
  for(let d=1; d<=dim; d++){
    const iso = `${view.ym}-${pad(d)}`, v = outBy[iso]||0, sel = view.day===iso;
    const cls = [iso>todayISO?'fut':'', iso===todayISO?'today':''].join(' ').trim();
    const bg = !sel && v ? ` style="background:color-mix(in srgb,var(--out) ${Math.round(12+38*v/max)}%,var(--sunk))"` : '';
    cells += `<button class="${cls}" data-day="${iso}" aria-pressed="${sel}"${bg} aria-label="${d} ${AYLAR[m-1]}, ${v?tl.format(v)+' harcama':'harcama yok'}">${d}<small>${v?tlShort(v):''}</small></button>`;
  }
  const spent = Object.values(outBy).reduce((a,b)=>a+b,0);
  const elapsed = view.ym<todayYM ? dim : view.ym===todayYM ? now.getDate() : 0;
  const top = Object.entries(outBy).sort((a,b)=>b[1]-a[1])[0];
  const stats = (elapsed && spent) || top ? `<div class="daystats">${elapsed&&spent?`<span>Günlük ortalama <b class="num">${tl.format(Math.round(spent/elapsed))}</b></span>`:''}${top?`<span>En çok harcanan gün <b>${dayLabel(top[0],{day:'numeric',month:'long'})}</b> <span class="num">(${tl.format(top[1])})</span></span>`:''}</div>` : '';
  const head = view.day
    ? `<div class="sec-head" style="margin:18px 0 10px"><h2>${dayLabel(view.day)}</h2><button class="chip" data-day="">Tüm ay</button></div>`
    : `<div class="sec-head" style="margin:18px 0 10px"><h2>Tüm hareketler</h2><small>Bir güne dokun, sadece onu gör</small></div>`;
  const shown = view.day ? list.filter(e=>e.date===view.day) : list;
  let body;
  if(!list.length) body = `<div class="card empty"><b>${ymLabel(view.ym)} için kayıt yok</b>Alttaki <strong>+</strong> ile ekleyebilirsin.</div>`;
  else if(!shown.length) body = `<div class="card empty"><b>Bu gün kayıt yok</b>Başka bir güne dokun ya da “Tüm ay”a dön.</div>`;
  else {
    const groups = {};
    shown.forEach(e => (groups[e.date] ||= []).push(e));
    body = Object.entries(groups).map(([d,es]) => `
    <div class="day"><h3><span>${d===todayISO?'Bugün · ':''}${dayLabel(d)}</span><span class="num">${outBy[d]?'−'+tl.format(outBy[d]):''}${inBy[d]?(outBy[d]?' · ':'')+'+'+tl.format(inBy[d]):''}</span></h3><div class="items">
    ${es.map(e => { const c=cat(e.cat); return `<button class="item" data-edit="${esc(e.id)}">
      <span class="dot">${esc(c.name.charAt(0))}</span>
      <span class="mid"><b>${esc(e.note || c.name)}</b><small>${esc(c.name)}${e.rec?'<span class="rec">↻ her ay</span>':''}</small></span>
      <span class="amt num ${e.t}">${e.t==='in'?'+':'−'}${tl.format(e.amt)}</span></button>`; }).join('')}
    </div></div>`).join('');
  }
  return `<div class="card"><div class="cal">${cells}</div>${stats}</div>${head}${body}`;
}

/* ---------- kredi kartları ve krediler ---------- */
const debts = () => S.settings.debts || (S.settings.debts = []);
const ymDiff = (a,b) => { const [y1,m1]=a.split('-').map(Number), [y2,m2]=b.split('-').map(Number); return (y2-y1)*12+(m2-m1); };
const dayDiff = (a,b) => Math.round((new Date(b+'T12:00') - new Date(a+'T12:00'))/864e5);
const isoAdd = (iso,n) => { const d=new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
function instNo(d, ym){ if(d.kind!=='loan') return ym >= d.from ? 1 : 0; const i = ymDiff(d.start, ym); return i>=0 && i<d.count ? i+1 : 0; }
const dueOf = (d, ym) => `${ym}-${pad(Math.min(d.dueDay, daysIn(ym)))}`;
const payOf = (d, ym) => ((S.months[ym]||{}).pay||{})[d.id] || null;
const amtOf = (d, ym) => { const p = payOf(d, ym); return (p && p.amt) || (d.kind==='loan' ? d.amt : 0); };
function statusOf(d, ym){
  const p = payOf(d, ym);
  if(p && p.paid) return {cls:'paid', txt:'Ödendi'};
  if(ym < d.from) return {cls:'paid', txt:'Takip öncesi'};
  const n = dayDiff(todayISO, dueOf(d, ym));
  if(n < 0) return {cls:'late', txt:`${-n} gün gecikti`};
  if(n === 0) return {cls:'today', txt:'Son gün bugün'};
  if(n <= (d.remind||3)) return {cls:'soon', txt:`${n} gün kaldı`};
  return {cls:'', txt:`${n} gün var`};
}
function alertsNow(){
  const out = [];
  for(const ym of [ymAdd(todayYM,-1), todayYM, ymAdd(todayYM,1)])
    for(const d of debts()){ if(!instNo(d,ym)) continue; const st = statusOf(d,ym); if(st.cls==='late'||st.cls==='today'||st.cls==='soon') out.push({d, ym, st, due:dueOf(d,ym)}); }
  return out.sort((a,b)=>a.due.localeCompare(b.due));
}
function alertsHTML(){
  const a = alertsNow(); if(!a.length) return '';
  const late = a.some(x=>x.st.cls==='late');
  return `<button class="alert ${late?'late':''}" data-goto="odeme" data-ym="${a[0].ym}"><b>${late?'Geciken ödeme var':'Yaklaşan ödemeler'}</b>${a.map(x=>{ const v=amtOf(x.d,x.ym); return `<div><span>${esc(x.d.name)} · ${dayLabel(x.due,{day:'numeric',month:'short'})}</span><span class="num">${x.st.txt}${v?' · '+tl.format(v):''}</span></div>`; }).join('')}</button>`;
}

  <section><div class="btns"><button class="btn" data-adddebt="card" style="flex:1">Kart ekle</button><button class="btn" data-adddebt="loan" style="flex:1">Kredi ekle</button></div></section>

            : `<div class="note">Android’de uygulama kapalıyken de yaklaşan ödemeler için bildirim gönderebilir.</div><button class="btn ghost" id="notifBtn">Bildirimlere izin ver</button>`}

function ensureCat(id, name){ if(!S.settings.cats.some(c=>c.id===id)){ S.settings.cats.push({id, name, t:'out', budget:0}); saveSettings(); } return id; }
function markPaid(d, ym, amt, addExp){
  const m = monthDoc(ym); let exp = null;
  if(addExp){
    const catId = d.kind==='loan' ? ensureCat('kredi','Kredi ödemesi') : ensureCat('kartodeme','Kart ödemesi');

  m.pay[d.id] = {amt, paid:true, paidOn:todayISO, exp};
  saveMonth(ym);

function unpay(d, ym){

/* takvim (.ics) hatırlatıcısı */
function icsText(d){
  let ym = todayYM;
  if(dayDiff(todayISO, dueOf(d, ym)) < 0 || (payOf(d, ym)||{}).paid) ym = ymAdd(ym, 1);
  const byDay = d.dueDay > 28 ? `BYMONTHDAY=${Array.from({length:d.dueDay-27},(_,i)=>28+i).join(',')};BYSETPOS=-1` : `BYMONTHDAY=${d.dueDay}`;
  let rule = `FREQ=MONTHLY;${byDay}`;
  if(d.kind==='loan'){
    if(ym < d.start) ym = d.start;
    const rem = d.count - ymDiff(d.start, ym);
    if(rem <= 0) return null;
    rule += `;COUNT=${rem}`;
  }
  const dt = dueOf(d, ym).replace(/-/g,'');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const r = d.remind || 3;
  const t = v => String(v).replace(/[\\,;]/g, m => '\\' + m);
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Bocekler Cuzdan//TR','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT', `UID:${d.id}-${dt}@bocekler-cuzdan`, `DTSTAMP:${stamp}`, `DTSTART:${dt}T100000`, `DTEND:${dt}T103000`, `RRULE:${rule}`,
    `SUMMARY:${t(d.name+' son ödeme günü')}`, `DESCRIPTION:${t('Böcekler Cüzdan hatırlatıcısı. Ödeyince uygulamada Ödendi olarak işaretle.')}`,

    'BEGIN:VALARM','ACTION:DISPLAY', `DESCRIPTION:${t(d.name+': son ödeme günü bugün')}`, 'TRIGGER:PT0M', 'END:VALARM',

function addToCalendar(d){

  const file = 'bocekler-' + (d.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'odeme') + '.ics';
  if(navigator.serviceWorker && navigator.serviceWorker.controller){

/* Android bildirimleri: hatırlatma listesi IndexedDB'de tutulur, servis çalışanı günde bir kontrol eder */
function idb(){ return new Promise((res,rej)=>{ const r = indexedDB.open('bocekler',1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(k,v){ const db = await idb(); return new Promise(res=>{ const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete = () => res(); tx.onerror = () => res(); }); }
async function writeReminders(){
  try {
    const list = [];
    for(const ym of [ymAdd(todayYM,-1), todayYM, ymAdd(todayYM,1), ymAdd(todayYM,2)])
      for(const d of debts()){
        if(!instNo(d,ym) || ym < d.from || (payOf(d,ym)||{}).paid) continue;
        const v = amtOf(d,ym);
        list.push({key:d.id+'@'+ym, name:d.name, due:dueOf(d,ym), from:isoAdd(dueOf(d,ym), -(d.remind||3)), amt: v ? tl.format(v) : ''});
      }
    await idbSet('reminders', list);
  } catch(e){}
}
async function enableNotifications(){
  if(!notifOK()) return toast('Bu tarayıcı bildirim desteklemiyor.');
  const p = await Notification.requestPermission();
  if(p !== 'granted'){ render(); return toast('İzin verilmedi. Telefon ayarlarından açabilirsin.'); }
  const reg = await navigator.serviceWorker.ready;
  try { if('periodicSync' in reg) await reg.periodicSync.register('odeme-kontrol', {minInterval: 12*3600e3}); } catch(e){}
  await writeReminders();
  try { await reg.showNotification('Böcekler Cüzdan', {body:'Bildirimler açık. Yaklaşan ödemelerde haber vereceğim.', icon:'icon-192.png'}); } catch(e){}
  render();
}

function stopRecurring(rid){

  else r.until = until;
  saveSettings();
}

function importData(ev){

    if(!d || !d.settings || !Array.isArray(d.settings.cats) || typeof d.months!=='object') return toast('Bu dosya bir Böcekler Cüzdan yedeği değil.');
    const n = Object.values(d.months).reduce((a,m)=>a+(m.items||[]).length,0);
    const area = document.getElementById('dataArea');
    area.innerHTML = `<div class="field"><span class="note">${esc(d.exported||'')} tarihli yedekte ${n} kayıt var. Yüklersen mevcut kayıtlarının yerine geçer.</span>

    document.getElementById('cancelImport').onclick = () => { area.innerHTML=''; ev.target.value=''; };
    document.getElementById('doImport').onclick = () => {
      const old = Object.keys(S.months);
      S = { settings: {cats:d.settings.cats, recurring:d.settings.recurring||[], savTarget:d.settings.savTarget||0, debts:d.settings.debts||[]}, months: {}, rates: d.rates||S.rates||{} };
      for(const [ym,m] of Object.entries(d.months)) if(/^\d{4}-\d{2}$/.test(ym)) S.months[ym] = {items:m.items||[], skip:m.skip||[], sav:m.sav||[], pay:m.pay||{}};
      if(mode==='db'){
        queueWrite('settings', S.settings);
        for(const ym of Object.keys(S.months)) queueWrite('m-'+ym, S.months[ym]);
        for(const ym of old) if(!S.months[ym]) queueWrite('m-'+ym, null);
      } else saveLocal();
      render(); toast('Yedek yüklendi');
    };
  };
  rd.readAsText(f);
}

// Pencereyi aşağı çekerek kapatma: tutamaktan her zaman, içerikten en üstteyken
(() => {
  let d = null;
  const start = (y, target) => {
    const sh = target.closest('.sheet'); if(!sh || target.closest('input,select,textarea')) return;
    d = { sh, y0:y, t0:Date.now(), dy:0, on:false, grab: !!target.closest('.grab') };
  };
  const move = (y, ev) => {
    if(!d) return;
    d.dy = y - d.y0;
    if(!d.on){
      if(d.dy > 8 && (d.grab || d.sh.scrollTop <= 0)){ d.on = true; d.sh.classList.add('dragging'); }
      else if(d.dy < -8 && !d.grab){ d = null; return; }
    }
    if(d.on){ if(ev.cancelable) ev.preventDefault(); d.sh.style.transform = `translateY(${Math.max(0,d.dy)}px)`;
      const sc = sheetRoot.querySelector('.scrim'); if(sc) sc.style.opacity = String(Math.max(.2, 1 - d.dy/400)); }
  };
  const end = () => {
    if(!d) return;
    const {sh, dy, on, t0} = d; d = null; if(!on) return;
    const fast = dy / Math.max(1, Date.now()-t0) > .5;
    if(dy > 110 || (fast && dy > 30)) closeSheetAnimated();
    else { sh.classList.remove('dragging'); sh.style.transition = 'transform .2s ease-out'; sh.style.transform = '';
      const sc = sheetRoot.querySelector('.scrim'); if(sc){ sc.style.transition='opacity .2s'; sc.style.opacity=''; }
      setTimeout(()=>{ sh.style.transition=''; }, 220); }
  };
  sheetRoot.addEventListener('touchstart', e => start(e.touches[0].clientY, e.target), {passive:true});
  sheetRoot.addEventListener('touchmove', e => move(e.touches[0].clientY, e), {passive:false});
  sheetRoot.addEventListener('touchend', end); sheetRoot.addEventListener('touchcancel', end);
  sheetRoot.addEventListener('mousedown', e => { if(e.target.closest('.grab')) start(e.clientY, e.target); });
  window.addEventListener('mousemove', e => move(e.clientY, e)); window.addEventListener('mouseup', end);
})();
document.addEventListener('keydown', e => { if(e.key==='Escape' && sheetRoot.innerHTML) closeSheet(); });

function save(st, entry){
  const amt = parseAmt(st.amt);
  if(!amt) return toast('Tutarı yaz (örn. 1.250,50).');
  if(!st.cat) return toast('Bir kategori seç.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(st.date)) return toast('Tarihi seç.');
  const ym = st.date.slice(0,7), day = +st.date.slice(8);
  if(entry && entry.rec){
    const r = S.settings.recurring.find(x=>x.id===entry.rid);
    Object.assign(r, {t:st.t, amt, cat:st.cat, note:st.note.trim(), day});
    saveSettings();
  } else if(entry){
    const oldYm = entry.date.slice(0,7);
    const om = monthDoc(oldYm); om.items = om.items.filter(i=>i.id!==entry.id);
    const nm = monthDoc(ym); nm.items.push({id:entry.id, t:st.t, amt, cat:st.cat, date:st.date, note:st.note.trim()});
    saveMonth(oldYm); if(ym!==oldYm) saveMonth(ym);
  } else if(st.repeat){
    S.settings.recurring.push({id:uid(), t:st.t, amt, cat:st.cat, note:st.note.trim(), day, from:ym});
    saveSettings();
  } else {
    monthDoc(ym).items.push({id:uid(), t:st.t, amt, cat:st.cat, date:st.date, note:st.note.trim()});
    saveMonth(ym);
  }
  view.ym = ym; closeSheet(); render(); toast(entry ? 'Güncellendi' : 'Kaydedildi');
}
function removeItem(entry){
  const ym = entry.date.slice(0,7); const m = monthDoc(ym);
  m.items = m.items.filter(i=>i.id!==entry.id); saveMonth(ym); closeSheet(); render(); toast('Kayıt silindi');
}

/* ---------- events ---------- */
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 2600); }
document.getElementById('prevM').onclick = () => { view.ym = ymAdd(view.ym,-1); view.day = null; render(); };
document.getElementById('nextM').onclick = () => { view.ym = ymAdd(view.ym,1); view.day = null; render(); };
document.getElementById('monthLbl').onclick = () => { if(mode!=='loading') openMonthPicker(); };
document.getElementById('addBtn').onclick = () => { if(mode==='loading') return; view.tab==='birikim' ? openSavSheet(null) : view.tab==='odeme' ? openDebtSheet(null,'card') : openSheet(null); };
document.querySelectorAll('nav .tab').forEach(b => b.onclick = () => { view.tab=b.dataset.tab; render(); window.scrollTo(0,0); });
main.addEventListener('click', e => {
  const g = e.target.closest('[data-goto]'); if(g){ view.tab=g.dataset.goto; if(g.dataset.ym) view.ym=g.dataset.ym; render(); window.scrollTo(0,0); return; }
  const dy = e.target.closest('[data-day]'); if(dy){ view.day = dy.dataset.day && dy.dataset.day!==view.day ? dy.dataset.day : null; render(); return; }
  const find = id => debts().find(x=>x.id===id);
  const pb = e.target.closest('[data-pay]'); if(pb){ const d=find(pb.dataset.pay); if(!d) return;
    if((payOf(d,view.ym)||{}).paid){ if(!pb.dataset.armed){ pb.dataset.armed=1; pb.textContent='Geri almak için tekrar dokun'; return; } unpay(d,view.ym); render(); toast('Ödeme geri alındı'); }
    else openPaySheet(d, view.ym); return; }
  const ic = e.target.closest('[data-ics]'); if(ic){ const d=find(ic.dataset.ics); if(d) addToCalendar(d); return; }
  const de = e.target.closest('[data-dedit]'); if(de){ const d=find(de.dataset.dedit); if(d) openDebtSheet(d); return; }
  const ad = e.target.closest('[data-adddebt]'); if(ad){ openDebtSheet(null, ad.dataset.adddebt); return; }
  const sv = e.target.closest('[data-sedit]'); if(sv){ const x=savFor(view.ym).find(y=>y.id===sv.dataset.sedit); if(x) openSavSheet(x); return; }
  const b = e.target.closest('[data-edit]'); if(!b) return;
  const entry = entriesFor(view.ym).find(x=>x.id===b.dataset.edit); if(entry) openSheet(entry);
});

init();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
