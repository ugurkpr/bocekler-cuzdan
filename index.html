      el.innerHTML = !v ? '' : n<=1 ? `Tek çekim · ${esc(cardById(st.pay).name)} ekstresine ${tl.format(v)} olarak girer.` : `<b>${n} × ${tl.format(instPart({amt:v,inst:n},1))}</b> · her ay giderlere bu kadar yansır · son taksit ${ymLabel(ymAdd(d.slice(0,7), n-1))}`; };
    document.getElementById('fAmt').addEventListener('input', calc); calc();
    const fut = () => { const d = document.getElementById('fDate').value, el = document.getElementById('futNote'); if(el) el.textContent = d > todayISO ? `Bu tarih henüz gelmedi. Kayıt ${dayLabel(d,{day:'numeric',month:'long'})} gelene kadar “beklenen” olarak görünür, kalana eklenmez.` : ''; };
    document.getElementById('fDate').addEventListener('change', fut); document.getElementById('fDate').addEventListener('input', fut); fut();
    const fn = document.getElementById('fNow'); if(fn) fn.onclick = () => { keep(); st.date = todayISO; save(st, entry); };
    document.getElementById('fSave').onclick = () => { keep(); save(st, entry); };
    const del = document.getElementById('fDel');
    if(del) del.onclick = () => { if(!del.dataset.armed){ del.dataset.armed=1; del.textContent='Silmek için tekrar dokun'; return; } removeItem(entry); };
    const skip = document.getElementById('fSkip');
    if(skip) skip.onclick = () => { const ym=entry.date.slice(0,7); const m=monthDoc(ym); m.skip=[...(m.skip||[]), entry.rid]; saveMonth(ym); closeSheet(); render(); toast('Bu ayın kaydı silindi'); };
    const stop = document.getElementById('fStop');
    if(stop) stop.onclick = () => { if(!stop.dataset.armed){ stop.dataset.armed=1; stop.textContent='Emin misin?'; return; } stopRecurring(entry.rid); closeSheet(); render(); toast('Tekrar durduruldu'); };
  };
  draw();
  if(!editing) setTimeout(()=>document.getElementById('fAmt')?.focus(), 60);
}
function closeSheet(){ sheetRoot.innerHTML=''; }
function closeSheetAnimated(){
  const sh = sheetRoot.querySelector('.sheet'), sc = sheetRoot.querySelector('.scrim');
  if(!sh) return closeSheet();
  sh.classList.remove('dragging'); sh.style.transition = 'transform .2s ease-in'; sh.style.transform = 'translateY(105%)';
  if(sc){ sc.style.transition = 'opacity .2s'; sc.style.opacity = '0'; }
  setTimeout(closeSheet, 200);
}
// Pencereyi aşağı çekerek kapatma: tutamaktan her zaman, içerikten en üstteyken
(() => {
  let d = null;
  const start = (y, target) => {
    const sh = target.closest('.sheet'); if(!sh || target.closest('input,select,textarea')) return;
    d = { sh, y0:y, t0:Date.now(), dy:0, on:false, grab: !!target.closest('.grab') };
  };
  const move = (y, ev) => {
    if(!d) return;
    d.dy = y - d.y0;
    if(!d.on){
      if(d.dy > 8 && (d.grab || d.sh.scrollTop <= 0)){ d.on = true; d.sh.classList.add('dragging'); }
      else if(d.dy < -8 && !d.grab){ d = null; return; }
    }
    if(d.on){ if(ev.cancelable) ev.preventDefault(); d.sh.style.transform = `translateY(${Math.max(0,d.dy)}px)`;
      const sc = sheetRoot.querySelector('.scrim'); if(sc) sc.style.opacity = String(Math.max(.2, 1 - d.dy/400)); }
  };
  const end = () => {
    if(!d) return;
    const {sh, dy, on, t0} = d; d = null; if(!on) return;
    const fast = dy / Math.max(1, Date.now()-t0) > .5;
    if(dy > 110 || (fast && dy > 30)) closeSheetAnimated();
    else { sh.classList.remove('dragging'); sh.style.transition = 'transform .2s ease-out'; sh.style.transform = '';
      const sc = sheetRoot.querySelector('.scrim'); if(sc){ sc.style.transition='opacity .2s'; sc.style.opacity=''; }
      setTimeout(()=>{ sh.style.transition=''; }, 220); }
  };
  sheetRoot.addEventListener('touchstart', e => start(e.touches[0].clientY, e.target), {passive:true});
  sheetRoot.addEventListener('touchmove', e => move(e.touches[0].clientY, e), {passive:false});
  sheetRoot.addEventListener('touchend', end); sheetRoot.addEventListener('touchcancel', end);
  sheetRoot.addEventListener('mousedown', e => { if(e.target.closest('.grab')) start(e.clientY, e.target); });
  window.addEventListener('mousemove', e => move(e.clientY, e)); window.addEventListener('mouseup', end);
})();
document.addEventListener('keydown', e => { if(e.key==='Escape' && sheetRoot.innerHTML) closeSheet(); });

const payFields = st => st.t==='out' && st.pay && st.pay!=='cash' ? {pay:st.pay, inst: st.inst>1 ? st.inst : 1} : {};
function save(st, entry){
  if(st.t==='out' && st.pay && S.settings.lastPay !== st.pay){ S.settings.lastPay = st.pay; saveSettings(); }
  const amt = parseAmt(st.amt);
  if(!amt) return toast('Tutarı yaz (örn. 1.250,50).');
  if(!st.cat) return toast('Bir kategori seç.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(st.date)) return toast('Tarihi seç.');
  const ym = st.date.slice(0,7), day = +st.date.slice(8);
  if(entry && entry.rec){
    const r = S.settings.recurring.find(x=>x.id===entry.rid);
    Object.assign(r, {t:st.t, amt, cat:st.cat, sub:st.sub||null, pay: st.t==='out' && st.pay!=='cash' ? st.pay : null, note:st.note.trim(), day});
    saveSettings();
  } else if(entry){
    const oldYm = entry.date.slice(0,7);
    const om = monthDoc(oldYm); om.items = om.items.filter(i=>i.id!==entry.id);
    const nm = monthDoc(ym); nm.items.push({id:entry.id, t:st.t, amt, cat:st.cat, sub:st.sub||null, ...payFields(st), date:st.date, note:st.note.trim()});
    saveMonth(oldYm); if(ym!==oldYm) saveMonth(ym);
  } else if(st.repeat){
    S.settings.recurring.push({id:uid(), t:st.t, amt, cat:st.cat, sub:st.sub||null, pay: st.t==='out' && st.pay!=='cash' ? st.pay : null, note:st.note.trim(), day, from:ym});
    saveSettings();
  } else {
    monthDoc(ym).items.push({id:uid(), t:st.t, amt, cat:st.cat, sub:st.sub||null, ...payFields(st), date:st.date, note:st.note.trim()});
    saveMonth(ym);
  }
  view.ym = ym; closeSheet(); render();
  toast(st.date > todayISO ? `Kaydedildi · ${dayLabel(st.date,{day:'numeric',month:'long'})} ${st.t==='in'?'gelir olarak bekleniyor':'için planlandı'}` : entry ? 'Güncellendi' : 'Kaydedildi');
}
function removeItem(entry){
  const ym = entry.date.slice(0,7); const m = monthDoc(ym);
  m.items = m.items.filter(i=>i.id!==entry.id); saveMonth(ym); closeSheet(); render(); toast('Kayıt silindi');
}

/* ---------- events ---------- */
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 2600); }
document.getElementById('prevM').onclick = () => { view.ym = ymAdd(view.ym,-1); view.day = null; render(); };
document.getElementById('nextM').onclick = () => { view.ym = ymAdd(view.ym,1); view.day = null; render(); };
document.getElementById('monthLbl').onclick = () => { if(mode!=='loading') openMonthPicker(); };
document.getElementById('addBtn').onclick = () => { if(mode==='loading') return; view.tab==='birikim' ? openSavSheet(null) : view.tab==='odeme' ? openDebtSheet(null,'card') : openSheet(null); };
document.querySelectorAll('nav .tab').forEach(b => b.onclick = () => { view.tab=b.dataset.tab; view.cat=null; view.sub=null; render(); window.scrollTo(0,0); });
main.addEventListener('click', e => {
  const cg = e.target.closest('[data-catgo]');
  if(cg){ view.cat = cg.dataset.catgo || null; view.sub = (view.cat && cg.dataset.sub) || null; view.day = null; view.tab = 'liste'; render(); window.scrollTo({top:0, behavior:'smooth'}); return; }
  const rp = e.target.closest('[data-report]'); if(rp){ openReport(view.ym); return; }
  const as = e.target.closest('[data-addsav]'); if(as){ openSavSheet(null, as.dataset.addsav); return; }
  const ce = e.target.closest('[data-catedit]'); if(ce){ const c = S.settings.cats.find(x=>x.id===ce.dataset.catedit); if(c) openCatSheet(c); return; }
  const re = e.target.closest('[data-recedit]'); if(re){ const r = S.settings.recurring.find(x=>x.id===re.dataset.recedit); if(r){ const ym = r.from > todayYM ? r.from : todayYM;
      openSheet({ id:'r:'+r.id, rid:r.id, t:r.t, amt:r.amt, cat:r.cat, note:r.note, date:`${ym}-${pad(Math.min(r.day, daysIn(ym)))}`, rec:true }); } return; }
  const pm = e.target.closest('[data-pick-month]');
  if(pm){ if(pm.dataset.pickMonth!==view.ym){ view.ym = pm.dataset.pickMonth; view.day = null; render(); window.scrollTo({top:0, behavior:'smooth'}); toast(ymLabel(view.ym)); } return; }
  const g = e.target.closest('[data-goto]'); if(g){ view.tab=g.dataset.goto; if(g.dataset.ym) view.ym=g.dataset.ym; render(); window.scrollTo(0,0); return; }
  const dy = e.target.closest('[data-day]'); if(dy){ view.day = dy.dataset.day && dy.dataset.day!==view.day ? dy.dataset.day : null; render(); return; }
  const find = id => debts().find(x=>x.id===id);
  const pb = e.target.closest('[data-pay]'); if(pb){ const d=find(pb.dataset.pay); if(!d) return;
    if(d.kind==='card'){ openCardPaySheet(d, view.ym); return; }
    if((payOf(d,view.ym)||{}).paid){ if(!pb.dataset.armed){ pb.dataset.armed=1; pb.textContent='Geri almak için tekrar dokun'; return; } unpay(d,view.ym); render(); toast('Ödeme geri alındı'); }
    else openPaySheet(d, view.ym); return; }
  const ic = e.target.closest('[data-ics]'); if(ic){ const d=find(ic.dataset.ics); if(d) addToCalendar(d); return; }
  const de = e.target.closest('[data-dedit]'); if(de){ const d=find(de.dataset.dedit); if(d) openDebtSheet(d); return; }
  const ad = e.target.closest('[data-adddebt]'); if(ad){ openDebtSheet(null, ad.dataset.adddebt); return; }
  const sv = e.target.closest('[data-sedit]'); if(sv){ const x=savFor(view.ym).find(y=>y.id===sv.dataset.sedit); if(x) openSavSheet(x); return; }
  const b = e.target.closest('[data-edit]'); if(!b) return;
  const entry = entriesFor(view.ym).find(x=>x.id===b.dataset.edit); if(!entry) return;
  if(entry.srcId){ const orig = findItem(entry.srcId); if(orig) openSheet({...orig}); return; }
  openSheet(entry);
});

// Açılış ekranı: video bitince (en geç 4 sn) ya da dokununca kaybolur
(() => {
  const sp = document.getElementById('splash'), v = document.getElementById('splashVid');
  let done = false;
  const hide = () => { if(done) return; done = true; sp.classList.add('out'); setTimeout(()=>sp.remove(), 400); };
  sp.addEventListener('click', hide);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ try { v.pause(); } catch(e){} setTimeout(hide, 700); return; }
  v.addEventListener('ended', hide);
  v.addEventListener('error', () => setTimeout(hide, 600));
  const p = v.play && v.play(); if(p && p.catch) p.catch(() => setTimeout(hide, 900));
  setTimeout(hide, 4500);
})();
init();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
